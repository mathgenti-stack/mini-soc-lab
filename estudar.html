ndows Update</td></tr><tr><td>Verificar a proteção</td><td>Windows Security</td></tr><tr><td>Controlar conexões de rede</td><td>Firewall</td></tr></table><h3>Para ir além</h3><ul><li><b>Event Viewer:</b> os logs do Windows.</li><li><b>Services:</b> programas que rodam em segundo plano.</li><li><b>UAC:</b> o aviso “permitir que este app faça alterações?”, que exige permissão de administrador.</li><li><b>CMD e PowerShell:</b> a linha de comando do Windows.</li></ul><h3>No dia a dia de um SOC</h3><ul><li>Task Manager: um processo desconhecido com uso alto pode ser malware.</li><li>Windows Update atrasado deixa falhas conhecidas abertas.</li><li>Windows Security: alertas de ameaça ou proteção desligada.</li><li>Firewall com regra aberta demais expõe o computador.</li><li>Event Viewer: logins e erros para investigar.</li></ul><h3>Para completar</h3><ul><li>O Windows Security inclui o antivírus da Microsoft (Microsoft Defender Antivirus). O nome “Windows Defender” aparece em materiais mais antigos.</li><li><b>Event Viewer</b> mostra os logs. <b>UAC</b> pede permissão de administrador antes de mudanças importantes, o que ajuda a impedir que um programa malicioso mude o sistema sem aviso.</li></ul><h3>Como explicar numa entrevista</h3><p><b>A user says their PC is slow. What do you do?</b><br><i>I ask when it started and what changed. Then I open Task Manager to see CPU, memory and disk usage and find the process using the most resources. I check startup apps and Windows Update, run a scan with Windows Security, explain the cause to the user and document it in the ticket.</i></p><p><b>An application is frozen. What do you do?</b><br><i>I open Task Manager with Ctrl+Shift+Esc, select the application and choose End task. If it keeps happening, I look for updates or errors in Event Viewer.</i></p>`},
{id:"linux",n:"Linux Básico",ic:"🐧",tags:["Linux"],chk:["Explicar a diferença entre pwd e ls","Explicar ls -l e ls -al (arquivos ocultos)","Andar pelas pastas com cd e cd ..","Usar find e cat","Explicar whoami, uname -a e df -h","Explicar a pasta /etc e ler o os-release","Acertar 8 de 10 no quiz de Linux"],st:`<p class="mu">Linux é muito usado em servidores. No terminal você digita comandos em texto (a CLI).</p><h3>Onde estou e o que tem aqui</h3><ul><li><b>pwd</b> (print working directory): mostra <b>onde você está</b>, o caminho completo.</li><li><b>ls</b>: lista o que <b>tem</b> na pasta atual: os <b>nomes</b> dos arquivos e das pastas. Para ler o que está escrito dentro de um arquivo, use o <b>cat</b>.</li><li><b>ls -l</b>: lista em formato longo, com permissões, dono, tamanho e data.</li><li><b>ls -al</b>: igual, mais os arquivos ocultos (nomes que começam com ponto).</li></ul><p><b>Atenção:</b> o pwd diz onde você está. O ls diz o que tem aqui.</p><h3>Andar pelas pastas</h3><ul><li><b>cd Documentos:</b> entra na pasta Documentos.</li><li><b>cd ..:</b> sobe um nível, para a pasta de cima. Para voltar ao lugar onde estava antes, use <b>cd -</b>.</li><li><b>cd /etc:</b> vai direto para /etc. Caminhos que começam com / partem da raiz.</li></ul><h3>Ler e procurar</h3><ul><li><b>cat arquivo:</b> mostra o conteúdo de um arquivo.</li><li><b>find:</b> procura arquivos. Exemplo: find / -name notas.txt</li></ul><h3>Quem sou eu e que sistema é este</h3><ul><li><b>whoami:</b> mostra o usuário com o qual você está logado.</li><li><b>uname:</b> mostra o nome do sistema (Linux). <b>uname -a</b> mostra tudo: kernel, nome da máquina e versão.</li><li><b>df -h:</b> espaço em disco em formato legível (G e M, não bytes).</li></ul><h3>Tabela de comandos</h3><table><tr><th>Preciso de...</th><th>Comando</th></tr><tr><td>Saber onde estou</td><td>pwd</td></tr><tr><td>Ver o que tem na pasta</td><td>ls</td></tr><tr><td>Ver detalhes</td><td>ls -l</td></tr><tr><td>Ver arquivos ocultos</td><td>ls -al</td></tr><tr><td>Entrar em uma pasta</td><td>cd</td></tr><tr><td>Subir um nível</td><td>cd ..</td></tr><tr><td>Ler um arquivo</td><td>cat</td></tr><tr><td>Procurar um arquivo</td><td>find</td></tr><tr><td>Saber meu usuário</td><td>whoami</td></tr><tr><td>Saber o sistema</td><td>uname -a</td></tr><tr><td>Ver espaço em disco</td><td>df -h</td></tr></table><h3>Pastas importantes</h3><ul><li><b>/</b> (raiz): onde tudo começa.</li><li><b>/etc:</b> configurações do sistema. Exemplo: cat /etc/os-release mostra o nome e a versão do Linux.</li></ul><p class="mu">Outras pastas que você vai ver bastante: /home (arquivos dos usuários), /var/log (logs). As permissões (rwx) aparecem em Segurança do SO.</p><h3>No dia a dia de um SOC</h3><ul><li>Servidores costumam ser Linux, então o terminal é ferramenta diária.</li><li>ls -l mostra permissões: um arquivo estranho com permissão demais merece atenção.</li><li>Logs são arquivos de texto, lidos com comandos como o cat.</li><li>df -h: disco cheio pode impedir a gravação de logs.</li><li>whoami: confere se você é usuário comum ou root.</li></ul><h3>Para completar</h3><ul><li><b>Linux é o kernel.</b> Ubuntu, Debian e Kali são distribuições (distros): o kernel mais as ferramentas.</li><li><b>Maiúsculas importam:</b> Documentos e documentos são pastas diferentes.</li><li><b>Atalhos:</b> ~ é a sua pasta pessoal, . é a pasta atual, .. é a pasta de cima. A tecla Tab completa nomes. comando --help explica um comando.</li><li><b>sudo</b> executa um comando como administrador (root). Ainda não visto: use com cuidado.</li></ul><h3>Como explicar numa entrevista</h3><p><b>Which Linux commands do you use first on a machine?</b><br><i>pwd to see where I am, ls to see what is there, cat to read a file, whoami to check my user, and uname -a for system information.</i></p><p><b>Why is Linux so common on servers?</b><br><i>It is stable, secure, flexible and free, and it is easy to manage remotely from the command line.</i></p>`},
{id:"wcli",n:"Windows CLI",ic:"⌨️",tags:["WinCLI"],chk:["Explicar o que é o CMD","Saber onde estou (cd) e o que tem aqui (dir)","Ver ocultos (dir /a) e procurar com dir /s","Navegar com cd e cd ..","Ler um arquivo com type","Usar whoami, hostname, systeminfo e ipconfig","Comparar os comandos de Linux e de Windows","Acertar 8 de 10 no quiz de Windows CLI"],st:`<p class="mu">O CMD (Prompt de Comando) é a linha de comando do Windows. Para abrir: tecla Windows, digite cmd e Enter.</p><h3>Onde estou e o que tem aqui</h3><ul><li><b>cd</b> (sem nada depois): mostra <b>a pasta em que você está</b>. No Linux isso é o pwd.</li><li><b>dir</b>: lista <b>o que tem</b> na pasta.</li><li><b>dir /a</b>: inclui os arquivos ocultos.</li></ul><h3>Andar e procurar</h3><ul><li><b>cd Documents</b>: entra na pasta Documents.</li><li><b>cd ..</b>: sobe um nível, para a pasta de cima.</li><li><b>dir /s nome-do-arquivo</b>: procura na pasta atual e em todas as subpastas e mostra o caminho completo do arquivo.</li></ul><h3>Ler um arquivo</h3><ul><li><b>type arquivo.txt</b>: mostra o conteúdo do arquivo.</li></ul><h3>Informações do sistema</h3><ul><li><b>whoami:</b> o usuário logado.</li><li><b>hostname:</b> o nome do computador.</li><li><b>systeminfo:</b> a versão do Windows e muitos detalhes do sistema.</li><li><b>ipconfig:</b> a configuração de rede: IP, máscara e gateway. Com <b>ipconfig /all</b> aparecem também o MAC (Endereço Físico), o DNS e o DHCP.</li></ul><p>Ligação com Redes: IP, gateway, DHCP, DNS e MAC, que você estudou, aparecem na saída do ipconfig /all.</p><h3>Linux x Windows</h3><table><tr><th>Quero...</th><th>Linux</th><th>Windows</th></tr><tr><td>Saber onde estou</td><td>pwd</td><td>cd</td></tr><tr><td>Ver o que tem aqui</td><td>ls</td><td>dir</td></tr><tr><td>Ver ocultos</td><td>ls -al</td><td>dir /a</td></tr><tr><td>Procurar arquivo</td><td>find</td><td>dir /s</td></tr><tr><td>Ler arquivo</td><td>cat</td><td>type</td></tr><tr><td>Meu usuário</td><td>whoami</td><td>whoami</td></tr><tr><td>Sistema</td><td>uname -a</td><td>systeminfo</td></tr><tr><td>Nome da máquina</td><td>hostname</td><td>hostname</td></tr></table><h3>No dia a dia de um SOC</h3><ul><li>Em um incidente, whoami, hostname e systeminfo identificam quem e qual máquina.</li><li>O ipconfig mostra o IP da máquina, que você cruza com os logs.</li><li>O systeminfo mostra a versão e as atualizações: sem patches, mais risco.</li><li>dir /a e dir /s ajudam a achar arquivos ocultos ou suspeitos.</li></ul><h3>Para completar</h3><ul><li><b>cls</b> limpa a tela. A seta para cima repete o comando anterior e a tecla Tab completa nomes.</li><li>Se o caminho tiver espaços, use aspas: cd "Program Files".</li><li><b>CMD x PowerShell:</b> o CMD é o antigo e mais simples. O PowerShell é mais poderoso e muito usado por administradores. Os dois aparecem em vagas.</li><li>Próximos comandos de rede: <b>ping</b> (testa se há resposta) e <b>nslookup</b> (testa o DNS).</li></ul><h3>Como explicar numa entrevista</h3><p><b>How would you find a computer’s IP address on Windows?</b><br><i>I open Command Prompt and run ipconfig. With ipconfig /all I can also see the DNS servers, the DHCP server and the MAC address.</i></p><p><b>How do you find out which user is logged in and which machine it is?</b><br><i>I run whoami for the user and hostname for the computer name. systeminfo gives me the Windows version and more details.</i></p>`},
{id:"segso",n:"Segurança do SO",ic:"🛡️",tags:["SegSO"],chk:["Explicar hardware, software e o papel do sistema operacional", "Explicar os tipos de SO (computador, celular, servidor e os dois)", "Explicar a tríade CIA com um exemplo de cada", "Explicar os 3 fatores de autenticação", "Explicar por que senhas fracas são perigosas e o que é uma boa senha", "Explicar o princípio do menor privilégio e permissões fracas", "Explicar programas maliciosos (Trojan, ransomware) e qual pilar da CIA atingem", "Explicar o que é SSH, a porta 22 e como ele autentica", "Acertar 8 de 10 no quiz de Segurança do SO","Explicar o laboratório prático (senha fraca, ls, cat, history)"],st:`<p class="mu">Segurança de SO é proteger o computador e o celular contra quem quer ler, alterar ou derrubar o que está neles.</p>
<h3>Hardware, software e sistema operacional</h3><ul><li><b>Hardware:</b> a parte física que dá para tocar. Tela, teclado, impressora, pendrive e a <b>placa-mãe (motherboard)</b>, onde todo o resto se conecta.</li><li><b>Software:</b> os programas, como Firefox, Chrome, WhatsApp e Telegram.</li><li><b>Sistema operacional (SO):</b> a camada entre o hardware e os programas. Os programas não rodam direto no hardware. O SO libera o acesso segundo regras.</li><li>O hardware sozinho não serve para rodar programas. Ele precisa do SO para ser controlado.</li></ul>
<table><tr><th>Tipo</th><th>Exemplos</th></tr><tr><td>Computador</td><td>Windows 11, macOS</td></tr><tr><td>Celular</td><td>Android, iOS</td></tr><tr><td>Servidor</td><td>Windows Server 2022, IBM AIX, Oracle Solaris</td></tr><tr><td>Computador e servidor</td><td>Linux</td></tr></table>
<h3>Por que proteger o SO</h3><p>O celular e o computador guardam conversas, fotos, e-mails, senhas salvas no navegador, apps de banco e cópias de documentos como RG ou passaporte. Quem abre o aparelho sem permissão acessa tudo isso.</p>
<h3>A tríade CIA</h3><table><tr><th>Pilar</th><th>Pergunta</th><th>Exemplo de ataque</th></tr><tr><td><b>Confidencialidade</b></td><td>Só quem deve vê?</td><td>Alguém lê suas mensagens ou fotos sem permissão</td></tr><tr><td><b>Integridade</b></td><td>Ninguém alterou?</td><td>Um arquivo é modificado sem você saber, guardado ou durante o envio pela rede</td></tr><tr><td><b>Disponibilidade</b></td><td>Funciona quando preciso?</td><td>Ransomware tranca seus arquivos, ou um ataque derruba o sistema</td></tr></table>
<p>No SOC, todo incidente é classificado assim: qual dos três pilares foi afetado.</p>
<h3>Fraqueza 1: autenticação e senhas fracas</h3><p><b>Autenticação</b> é provar quem você é, em um sistema local ou remoto. Existem 3 jeitos:</p><table><tr><th>Fator</th><th>Exemplo</th></tr><tr><td>Algo que você <b>sabe</b></td><td>Senha, PIN</td></tr><tr><td>Algo que você <b>é</b></td><td>Impressão digital, rosto</td></tr><tr><td>Algo que você <b>tem</b></td><td>Celular, token, chave de segurança</td></tr></table>
<ul><li>Usar <b>dois ou mais</b> fatores juntos é a <b>autenticação multifator (MFA)</b>. É uma das defesas mais eficazes.</li><li>Receber código por SMS conta como "algo que você tem", mas é o mais fraco dos métodos desse tipo. Um app autenticador ou chave física é mais seguro.</li></ul>
<p>A senha é a forma mais usada, então é a mais atacada. Os erros mais comuns:</p><ul><li>Senhas fáceis de adivinhar (123456, password, qwerty, 111111).</li><li>Usar a mesma senha em vários sites. Se um site vaza, o atacante testa a senha nos outros.</li><li>Usar dados pessoais, como data de nascimento ou nome do pet.</li><li>Palavras do dicionário (iloveyou, monkey, dragon).</li><li>Padrões do teclado (qwertyuiop, 1q2w3e4r5t). Parecem complexas, mas seguem o layout do teclado e os atacantes conhecem.</li><li>Trocar letras por números (p4ssw0rd). Os atacantes testam essas trocas primeiro, então quebra rápido.</li></ul>
<p>O NCSC (centro nacional de cibersegurança do Reino Unido) publica a lista das senhas mais comuns vazadas em ataques.</p>
<p><b>Uma boa senha:</b> longa, única para cada conta, de preferência uma <b>frase com várias palavras sem relação</b> (passphrase), guardada em um <b>gerenciador de senhas</b>. Com MFA ligado, melhor ainda.</p>
<h3>Fraqueza 2: permissões de arquivo fracas</h3><ul><li><b>Princípio do menor privilégio (least privilege):</b> cada pessoa acessa só o que precisa para fazer o trabalho. Em resumo: quem pode acessar o quê.</li><li>Exemplo pessoal: o plano da viagem é compartilhado com quem vai viajar, não de forma pública.</li><li>Permissões fracas atingem a <b>confidencialidade</b> (acesso a arquivos que não deveria) e a <b>integridade</b> (alteração de arquivos que não deveria editar).</li><li>No Linux, o exemplo clássico é um arquivo com permissão 777 (todo mundo lê, escreve e executa). No Windows, as permissões ficam na aba Segurança do arquivo.</li></ul>
<h3>Fraqueza 3: programas maliciosos (malware)</h3><table><tr><th>Tipo</th><th>O que faz</th><th>Pilar atingido</th></tr><tr><td><b>Cavalo de Troia (Trojan)</b></td><td>Parece um programa útil, mas dá ao atacante acesso ao sistema. Ele lê e altera arquivos.</td><td>Confidencialidade e integridade</td></tr><tr><td><b>Ransomware</b></td><td>Criptografa os arquivos do usuário. Sem a senha de descriptografia, viram texto ilegível. O atacante cobra resgate.</td><td>Disponibilidade</td></tr></table>
<ul><li>Pagar o resgate não garante recuperar os arquivos. A defesa certa é ter <b>backup</b> separado da rede e não abrir anexos suspeitos.</li><li>Muitos ransomwares também roubam os dados antes de criptografar, então atingem a confidencialidade também.</li></ul>
<h3>SSH (Secure Shell)</h3><ul><li><b>O que é:</b> um protocolo de rede <b>criptografado</b> para acesso remoto seguro e administração de sistemas, mesmo por uma rede não segura (como a internet).</li><li><b>Como funciona:</b> abre um <b>túnel seguro</b> entre um cliente (você) e um servidor. A criptografia garante a <b>confidencialidade</b> (ninguém lê) e a <b>integridade</b> (ninguém altera) dos dados na transmissão.</li><li><b>Porta:</b> TCP/22.</li><li><b>Para que serve:</b> executar comandos em servidores Linux, transferir arquivos com segurança (<b>SCP</b> ou <b>SFTP</b>) e gerenciar infraestrutura de TI à distância.</li><li><b>Características:</b> criptografia, autenticação robusta, tunelamento e encaminhamento de portas (port forwarding) e versatilidade.</li></ul>
<p>Comando básico: ssh usuario@endereco-ip</p>
<p><b>Autenticação no SSH:</b> por <b>senha</b> (algo que você sabe) ou por <b>par de chaves</b>: a chave privada fica com você e a pública fica no servidor. Chave é bem mais segura do que senha.</p>
<p><b>Por que existe:</b> antes se usava o <b>Telnet</b> (porta 23), que manda tudo, inclusive a senha, em texto puro. Qualquer um na rede conseguia ler. O SSH substituiu o Telnet por isso.</p>
<p><b>No SOC:</b> muitas tentativas de login SSH falhando vindas do mesmo IP indicam ataque de força bruta. As defesas são desligar o login por senha, usar chaves, MFA e bloquear IPs suspeitos.</p>
<h3>Laboratório prático: auditoria de segurança no Linux</h3><p>Imagine que você foi contratado para checar a segurança de uma máquina Linux. É um teste <b>autorizado</b>: só se faz com permissão.</p><ol><li><b>Digitar a senha no Linux:</b> ela <b>não aparece</b> na tela, nem com pontinhos. Isso é normal. O Linux esconde para ninguém ver o tamanho da senha. Digite e aperte Enter.</li><li><b>pwd:</b> mostra em que pasta você está.</li><li><b>ls:</b> lista os arquivos da pasta, <b>menos os escondidos</b>. Para ver também os escondidos (nomes que começam com ponto), use ls -a.</li><li><b>cat nome-do-arquivo:</b> mostra o conteúdo de um arquivo de texto na tela.</li><li><b>Adivinhar a senha:</b> testando uma lista de 20 senhas comuns, a certa era <b>abc123</b>. É o ataque de <b>dicionário</b>: testar as senhas mais comuns. Funcionou porque o usuário usou uma senha fraca, e o mesmo esquema abriu a conta do Johnny.</li><li><b>history:</b> mostra os comandos que o usuário digitou antes. Nesse histórico, o Johnny digitou a <b>senha por engano</b> como se fosse um comando, e ela ficou gravada.</li><li><b>Resultado:</b> com essa senha, foi possível ler o arquivo protegido em <b>/root/flag.txt</b> (cat /root/flag.txt). A pasta /root é a pasta do administrador, e o arquivo secreto do exercício (a flag) estava lá.</li></ol>
<p><b>Lições de segurança:</b></p><ul><li>Senha fraca (abc123) abre a conta em segundos.</li><li>Nunca digite a senha na linha de comando. Ela fica no histórico (history) e qualquer um que ler pode usar.</li><li>Quem entra com a senha certa lê os arquivos que o usuário pode ler, e por isso o menor privilégio e as permissões corretas importam.</li><li>Para o SOC: logins estranhos e consultas ao history de contas comprometidas são parte da investigação.</li></ul>
<h3>Cuidado com estas confusões</h3><ul><li>Princípio do <b>menor</b> privilégio (least), não "último".</li><li>Hardware sozinho não funciona. Precisa do SO.</li><li>Ransomware atinge a <b>disponibilidade</b> (e muitas vezes também a confidencialidade).</li></ul>
<h3>No dia a dia de um SOC</h3><ul><li>Muitas falhas de login seguidas de um sucesso: senha fraca adivinhada (força bruta ou dicionário).</li><li>Arquivos sensíveis com permissão para todos (como 777) são achados comuns de auditoria.</li><li>Numa conta comprometida, o history mostra o que o atacante digitou.</li><li>SSH exposto à internet recebe tentativas o dia inteiro: por isso se usa chave em vez de senha.</li></ul>
<h3>Como explicar numa entrevista</h3><p><b>What is the principle of least privilege?</b><br><i>Every user and program gets only the access it needs to do its job. If an account is compromised, the damage is limited.</i></p><p><b>Why are weak passwords dangerous on a Linux server?</b><br><i>Attackers run dictionary and brute-force attacks against SSH. A weak password can be guessed in seconds, so we use strong passwords or SSH keys, lockouts and monitoring of failed logins.</i></p>`},
{id:"dados",n:"Representação de Dados",ic:"🔢",tags:["Dados"],chk:["Explicar decimal, binário, hexadecimal e octal", "Dizer que 4 bits formam 1 dígito hexadecimal e 3 bits formam 1 dígito octal", "Explicar bit, byte e octeto", "Explicar como uma cor é representada (RGB)", "Converter números pequenos entre binário, decimal e hexadecimal", "Acertar 8 de 10 no quiz de Representação de Dados"],st:`
<p class="mu">O computador só entende dois estados: ligado e desligado, escritos como 1 e 0. Tudo o que ele guarda, como números, textos, cores e imagens, vira uma sequência de 0 e 1.</p>
<h3>Os 4 sistemas numéricos</h3><table><tr><th>Sistema</th><th>Base</th><th>Dígitos</th><th>Onde aparece</th></tr><tr><td>Decimal</td><td>10</td><td>0 a 9</td><td>Vida diária</td></tr><tr><td>Binário</td><td>2</td><td>0 e 1</td><td>O que o computador entende</td></tr><tr><td>Hexadecimal</td><td>16</td><td>0 a 9 e A a F</td><td>Cores, MAC, hashes, memória</td></tr><tr><td>Octal</td><td>8</td><td>0 a 7</td><td>Pouco comum (permissões Linux)</td></tr></table>
<p>No hexadecimal as letras valem números: A = 10, B = 11, C = 12, D = 13, E = 14 e F = 15.</p>
<h3>Bit e byte</h3><ul><li><b>Bit</b> (binary digit): o menor pedaço de informação, 0 ou 1.</li><li><b>Byte:</b> nos sistemas modernos, 8 bits. Também é chamado de <b>octeto</b> (octet), nome muito usado em redes.</li><li>Um byte guarda 256 valores diferentes (2 elevado a 8), de 0 a 255.</li></ul>
<h3>Como ler um número binário</h3><p>Cada posição vale o dobro da anterior, da direita para a esquerda:</p><table><tr><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td></tr></table><p>Some só as posições com 1: 8 + 2 = <b>10</b>. Então 00001010 em decimal é 10. E 11111111 é 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = <b>255</b>, o maior valor de um byte.</p>
<h3>Por que o hexadecimal existe</h3><ul><li><b>4 bits viram 1 dígito hexadecimal.</b> Um byte (8 bits) fica com 2 dígitos hex. Exemplo: 1010 1111 é AF.</li><li><b>3 bits viram 1 dígito octal.</b> Atenção: são 3 <b>bits</b>, não 3 bytes. Exemplo: 111 é 7.</li><li>Escrever em hex é bem mais curto e mais fácil de ler do que uma sequência longa de 0 e 1.</li></ul>
<table><tr><th>Decimal</th><th>Binário</th><th>Hex</th></tr><tr><td>0</td><td>0000</td><td>0</td></tr><tr><td>1</td><td>0001</td><td>1</td></tr><tr><td>2</td><td>0010</td><td>2</td></tr><tr><td>3</td><td>0011</td><td>3</td></tr><tr><td>4</td><td>0100</td><td>4</td></tr><tr><td>5</td><td>0101</td><td>5</td></tr><tr><td>6</td><td>0110</td><td>6</td></tr><tr><td>7</td><td>0111</td><td>7</td></tr><tr><td>8</td><td>1000</td><td>8</td></tr><tr><td>9</td><td>1001</td><td>9</td></tr><tr><td>10</td><td>1010</td><td>A</td></tr><tr><td>11</td><td>1011</td><td>B</td></tr><tr><td>12</td><td>1100</td><td>C</td></tr><tr><td>13</td><td>1101</td><td>D</td></tr><tr><td>14</td><td>1110</td><td>E</td></tr><tr><td>15</td><td>1111</td><td>F</td></tr></table>
<p>Exemplo completo: o número 255 é 11111111 em binário, FF em hexadecimal e 377 em octal.</p>
<h3>Como uma cor é representada</h3><ul><li>Na tela, toda cor é uma mistura de <b>vermelho, verde e azul</b> (RGB: Red, Green, Blue).</li><li>Cada cor primária usa <b>1 byte</b> (0 a 255). Então uma cor usa 3 bytes, ou 24 bits.</li><li>Quantas cores? 256 x 256 x 256 = <b>16.777.216</b>, ou seja, mais de 16 milhões.</li><li>Em hexadecimal, cada cor vira 2 dígitos: <b>#RRGGBB</b>.</li></ul><table><tr><th>Cor</th><th>Hex</th><th>RGB</th></tr><tr><td>Vermelho</td><td>#FF0000</td><td>255, 0, 0</td></tr><tr><td>Verde</td><td>#00FF00</td><td>0, 255, 0</td></tr><tr><td>Azul</td><td>#0000FF</td><td>0, 0, 255</td></tr><tr><td>Preto</td><td>#000000</td><td>0, 0, 0</td></tr><tr><td>Branco</td><td>#FFFFFF</td><td>255, 255, 255</td></tr></table>
<h3>Onde isso aparece em TI e segurança</h3><ul><li><b>Endereço IPv4:</b> 4 octetos, cada um de 0 a 255 (por isso 192.168.0.25 existe, mas 192.168.0.256 não).</li><li><b>Endereço MAC:</b> 6 bytes escritos em hexadecimal (A4:5E:60:C1:22:9B).</li><li><b>Hash de um arquivo</b> (como SHA-256): 64 dígitos hexadecimais. É assim que o analista identifica um arquivo malicioso.</li><li><b>Códigos de erro do Windows</b> aparecem em hex (como 0x80070005, acesso negado).</li><li><b>URLs:</b> %20 é o espaço escrito em hexadecimal.</li><li><b>Permissões do Linux:</b> chmod 755 está em octal. Cada dígito é 3 bits: 7 = 111 = rwx e 5 = 101 = r-x.</li></ul>
<h3>Cuidado com estas confusões</h3><ul><li>Octal: 3 <b>bits</b> por dígito. Hexadecimal: 4 <b>bits</b> por dígito.</li><li>Bit (1 dígito binário) não é byte (8 bits).</li><li>O hexadecimal chega a F (15), não a 9.</li></ul>
<h3>Como explicar numa entrevista</h3><p><b>Why do analysts need hexadecimal?</b><br><i>Hashes, MAC addresses, memory addresses and many error codes are written in hex. One hex digit is four bits, so a byte is two hex digits, which makes binary data easy to read.</i></p><p><b>What is the difference between a bit and a byte?</b><br><i>A bit is a single 0 or 1. A byte is eight bits and can hold 256 different values.</i></p>`},
{id:"ms",n:"Administração Microsoft",ic:"🪟",tags:["Admin"],chk:["Explicar o que é o Active Directory e o Domain Controller", "Usar o ADUC: criar usuário, resetar senha e desbloquear conta", "Diferenciar OU e grupo e saber por que dar permissão a grupos", "Explicar o que é uma GPO e usar gpupdate /force e gpresult /r", "Diferenciar conta bloqueada, desativada e senha expirada", "Explicar Entra ID, Microsoft 365 admin center e licenças", "Explicar MFA e o que fazer quando o usuário troca de celular", "Explicar o Intune (MDM) e o que é Wipe", "Explicar DHCP e DNS no Windows Server e por que o AD depende do DNS", "Descrever o processo de entrada e saída de funcionário (joiner/leaver)", "Saber os Event IDs 4624, 4625, 4740 e 4720", "Resolver os desafios de Admin Microsoft na aba Desafios", "Acertar 8 de 10 no quiz de Administração Microsoft"],st:`<p class="mu">Esse tópico é o que as vagas de IT Support e Service Desk mais pedem. Se faz tempo que você não mexe com isso, aqui é o lugar para lembrar. Treine também na aba Desafios, em Admin Microsoft.</p>
<h3>1. Active Directory (AD DS)</h3><ul><li><b>O que é:</b> o cadastro central da empresa. Guarda usuários, computadores e grupos e decide quem entra e o que pode acessar.</li><li><b>Domain Controller (DC):</b> o servidor que roda o AD e valida os logins.</li><li><b>Domínio:</b> o conjunto gerenciado pelo AD, por exemplo empresa.local. O PC "entra no domínio" (domain joined).</li><li><b>Workgroup:</b> o contrário. Cada PC tem só contas locais. Serve em casa ou em empresas muito pequenas.</li></ul>
<h3>2. Ferramentas do dia a dia</h3><table><tr><th>Ferramenta</th><th>Para quê</th><th>Atalho</th></tr><tr><td>Active Directory Users and Computers (ADUC)</td><td>Usuários, senhas, grupos, desbloquear</td><td>dsa.msc</td></tr><tr><td>Group Policy Management</td><td>Criar e ligar GPOs</td><td>gpmc.msc</td></tr><tr><td>DNS Manager</td><td>Registros DNS</td><td>dnsmgmt.msc</td></tr><tr><td>DHCP</td><td>Escopos e reservas de IP</td><td>dhcpmgmt.msc</td></tr><tr><td>Microsoft 365 admin center</td><td>Usuários, licenças e e-mail na nuvem</td><td>admin.microsoft.com</td></tr><tr><td>Intune</td><td>Dispositivos e apps</td><td>intune.microsoft.com</td></tr></table>
<p class="mu">As ferramentas gráficas do AD instalam-se em um Windows comum com o pacote RSAT (Remote Server Administration Tools).</p>
<h3>3. Tarefas que mais aparecem em chamados</h3><ul><li><b>Resetar senha:</b> ADUC → botão direito no usuário → Reset Password. Marque "User must change password at next logon".</li><li><b>Desbloquear conta:</b> ADUC → Propriedades → aba Account → Unlock account.</li><li><b>Ver grupos:</b> ADUC → aba Member Of.</li><li><b>Criar usuário:</b> ADUC → na OU certa → New → User. Depois coloque nos grupos do setor.</li><li><b>Desativar conta (saída):</b> botão direito → Disable Account.</li></ul>
<h3>4. OU x Grupo</h3><ul><li><b>OU</b> é uma pasta para organizar (Financeiro, Vendas) e receber GPOs.</li><li><b>Grupo de segurança</b> dá permissões (acesso a pasta, impressora, sistema).</li><li>Regra de bolso: <b>OU organiza, grupo dá acesso.</b></li><li>Boa prática: dar permissão a grupos, nunca a pessoas soltas. Menor privilégio: só o que a pessoa precisa.</li></ul>
<h3>5. GPO (Group Policy)</h3><ul><li>Regras aplicadas automaticamente a usuários ou computadores de uma OU.</li><li>Exemplos: política de senha, bloquear USB, papel de parede, mapear unidade de rede.</li><li><b>gpupdate /force:</b> atualiza as políticas na hora.</li><li><b>gpresult /r:</b> mostra quais GPOs estão valendo naquele PC.</li></ul>
<h3>6. Conta bloqueada, desativada ou senha expirada</h3><table><tr><th>Situação</th><th>Causa</th><th>Solução</th></tr><tr><td>Bloqueada</td><td>Muitas tentativas erradas</td><td>Unlock account e achar a causa</td></tr><tr><td>Desativada</td><td>O TI desligou</td><td>Reativar só se for legítimo</td></tr><tr><td>Senha expirada</td><td>Passou do prazo</td><td>Usuário cria nova senha</td></tr></table>
<p class="mu">Antes de qualquer reset: confirme a identidade de quem pediu. Nunca peça a senha do usuário.</p>
<h3>7. Nuvem: Entra ID e Microsoft 365</h3><ul><li><b>Entra ID</b> (antigo Azure AD): identidade na nuvem. Faz o login no Microsoft 365.</li><li><b>Híbrido:</b> AD local sincronizado com o Entra ID pelo Entra Connect.</li><li><b>Licença:</b> sem licença o usuário existe, mas não tem e-mail (Exchange Online), Teams ou Office.</li><li><b>Exchange Online:</b> e-mail, caixas compartilhadas (shared mailbox) e listas de distribuição.</li><li><b>MFA:</b> senha + segundo fator (app Authenticator). Troca de celular? Confirme a identidade e redefina os métodos de MFA.</li></ul>
<h3>8. Intune (gerenciar dispositivos)</h3><ul><li>Aplica políticas, instala apps e verifica se o aparelho está em conformidade.</li><li>Aparelho perdido: <b>Lock</b> (bloquear), <b>Wipe</b> (apagar tudo) ou <b>Retire</b> (remover só dados da empresa).</li><li><b>Autopilot:</b> o notebook novo se configura sozinho ao ligar.</li></ul>
<h3>9. DHCP e DNS no servidor</h3><ul><li><b>DHCP:</b> escopo (faixa de IPs), lease (tempo emprestado) e reserva (mesmo IP sempre, ligado ao MAC).</li><li><b>DNS:</b> registros A (nome → IP). O AD usa o DNS para achar o DC.</li><li>Erro de domínio com internet funcionando? Veja o DNS no <b>ipconfig /all</b>: deve ser o do servidor da empresa.</li></ul>
<h3>10. Entrada e saída de funcionário</h3><ul><li><b>Entrada (joiner):</b> criar conta, grupos, licença, MFA, equipamento e inventário.</li><li><b>Mudança (mover):</b> trocar os grupos e o acesso, remover o que não precisa mais.</li><li><b>Saída (leaver):</b> desativar a conta, tirar dos grupos, encerrar sessões, recolher equipamentos e guardar o e-mail conforme a política. Apagar só depois.</li></ul>
<h3>11. Permissões de pasta</h3><ul><li><b>Compartilhamento (Share)</b> e <b>NTFS (Security)</b> trabalham juntos. Vale a mais restritiva.</li><li>Acesso negado? Veja os grupos do usuário e as permissões da pasta.</li><li>Depois de entrar em um grupo novo, o usuário pode precisar sair e entrar de novo.</li></ul>
<h3>12. Comandos úteis</h3><table><tr><th>Comando</th><th>O que faz</th></tr><tr><td>whoami /groups</td><td>Grupos do usuário atual</td></tr><tr><td>net user nome /domain</td><td>Dados da conta no domínio</td></tr><tr><td>gpupdate /force</td><td>Atualiza GPOs</td></tr><tr><td>gpresult /r</td><td>Mostra GPOs aplicadas</td></tr><tr><td>ipconfig /all</td><td>IP, DNS, DHCP, MAC</td></tr><tr><td>ipconfig /release e /renew</td><td>Devolve e pede IP de novo</td></tr><tr><td>ipconfig /flushdns</td><td>Limpa o cache de DNS</td></tr><tr><td>nslookup nome</td><td>Testa a resolução de DNS</td></tr></table>
<h3>13. Visão de SOC: Event IDs do Windows</h3><table><tr><th>ID</th><th>Significa</th></tr><tr><td>4624</td><td>Login com sucesso</td></tr><tr><td>4625</td><td>Falha de login</td></tr><tr><td>4740</td><td>Conta bloqueada</td></tr><tr><td>4720</td><td>Conta criada</td></tr><tr><td>4728 / 4732</td><td>Usuário adicionado a um grupo</td></tr><tr><td>4672</td><td>Privilégios especiais no login</td></tr></table>
<p class="mu">Muitos 4625 seguidos de um 4624 podem ser força bruta que funcionou. Um 4720 inesperado ou alguém entrando no grupo de administradores (4728/4732) merece atenção.</p>
<h3>Como praticar de graça</h3><ul><li>A sala gratuita <b>Active Directory Basics</b>, do TryHackMe.</li><li>Baixar o Windows Server em versão de avaliação e rodar no VirtualBox: criar um domínio, usuários, OUs e uma GPO.</li><li>Um tenant de teste do Microsoft 365 Developer, se disponível na sua conta, para treinar licenças e MFA.</li></ul>
<h3>Como explicar numa entrevista</h3><p><b>What is Active Directory?</b><br><i>It is Microsoft's directory of users, computers and groups. Domain controllers check logins, and Group Policy applies settings to many computers at once.</i></p><p><b>A user's account is locked out. What do you check?</b><br><i>I check event 4740 to see where the lockouts come from. It can be an old password saved on a phone or a mapped drive, or an attack. If it is an attack, I treat it as an incident instead of just unlocking the account.</i></p>`},
{id:"soc",n:"SOC na Prática",ic:"🛡️",tags:["SOC"],chk:["Explicar o que é um SOC e os 3 níveis","Descrever o caminho de um alerta em 6 passos","Diferenciar falso e verdadeiro positivo","Citar SIEM, EDR e firewall e para que servem","Dizer as 4 fases da resposta a incidentes","Explicar o MITRE ATT&CK com um exemplo","Acertar 8 de 10 no quiz de SOC"],st:`<h3>O que é um SOC</h3><p>Security Operations Center: o time que vigia a segurança da empresa 24 horas por dia. É a sala de controle: vê os alertas, decide o que é ameaça real e age.</p><h3>Níveis (tiers)</h3><ul><li><b>Nível 1 (você começa aqui):</b> monitora alertas, faz a triagem, descarta falsos positivos e escala o que for sério.</li><li><b>Nível 2:</b> investiga a fundo os incidentes escalados.</li><li><b>Nível 3:</b> caça ameaças, melhora as detecções e lidera incidentes graves.</li></ul><h3>O caminho de um alerta</h3><ol><li>O SIEM dispara um alerta.</li><li>Você lê: qual regra, que IP, que usuário, que horário?</li><li>Checa o contexto: o IP é conhecido? É interno ou externo? O usuário costuma fazer isso?</li><li>Decide: <b>falso positivo</b> (fecha e anota) ou <b>verdadeiro positivo</b> (segue).</li><li>Se for verdadeiro: contém (ex.: bloqueia o IP) ou escala.</li><li>Registra tudo no ticket, em linguagem clara.</li></ol><h3>Falso e verdadeiro positivo</h3><ul><li><b>Falso positivo:</b> o alerta disparou, mas era atividade normal (ex.: um administrador fazendo vários logins para testar). Fecha e anota o motivo.</li><li><b>Verdadeiro positivo:</b> o alerta está certo e há ameaça real. Documenta, contém e escala.</li></ul><h3>Ferramentas</h3><ul><li><b>SIEM</b> (Splunk, Microsoft Sentinel): junta e correlaciona logs.</li><li><b>EDR</b> (Defender for Endpoint, CrowdStrike): vigia e isola computadores.</li><li><b>Firewall e IDS/IPS:</b> bloqueiam e detectam tráfego suspeito.</li><li><b>Ticket:</b> onde cada caso é documentado.</li></ul><h3>Ciclo de resposta a incidentes</h3><ol><li><b>Preparação:</b> ter ferramentas, regras e treino prontos antes do ataque.</li><li><b>Detecção e análise:</b> perceber o alerta e investigar o que aconteceu.</li><li><b>Contenção, erradicação e recuperação:</b> parar o ataque, remover a ameaça e voltar ao normal.</li><li><b>Lições aprendidas:</b> revisar o que deu certo e errado para melhorar.</li></ol><h3>MITRE ATT&amp;CK</h3><p>Catálogo de como os atacantes agem (táticas e técnicas). Serve para dar nome ao que você vê. Ex.: muitos logins errados seguidos = tentativa de força bruta.</p><h3>Exemplo prático</h3><p>Alerta: 300 logins falhos no SSH (porta 22) em 2 minutos, de um IP externo, e depois 1 login com sucesso. Isso preocupa: o atacante pode ter acertado a senha. Ação: tratar como verdadeiro positivo, escalar, bloquear o IP e ver o que a conta fez.</p><h3>Phishing: o que checar</h3><ul><li>O remetente e o domínio parecem certos?</li><li>Para onde o link leva? (passe o mouse, não clique)</li><li>Há urgência, ameaça ou anexo inesperado?</li><li>Mais pessoas receberam o mesmo e-mail?</li></ul><h3>Para completar</h3><ul><li><b>Falso negativo:</b> um ataque real que não gerou alerta. É o mais perigoso, porque ninguém olha. Por isso os analistas também ajustam e criam regras novas.</li><li><b>Tríade CIA:</b> Confidencialidade (só quem pode vê), Integridade (ninguém altera sem permissão) e Disponibilidade (o sistema está disponível). Todo incidente quebra pelo menos uma.</li><li><b>Ameaça, vulnerabilidade e risco:</b> a vulnerabilidade é a falha, a ameaça é quem pode explorá-la, e o risco é a chance de acontecer multiplicada pelo impacto.</li><li><b>IOC (indicador de comprometimento):</b> sinais que provam um ataque, como um IP malicioso ou o hash de um arquivo.</li><li><b>Prioridade:</b> casos críticos primeiro (conta administrativa, máquina isolada, dados de clientes).</li><li><b>Ciclo de incidentes:</b> as 4 fases são do guia do NIST.</li><li><b>MITRE:</b> força bruta é a técnica T1110 e phishing é a T1566.</li><li><b>Boa nota de ticket:</b> o que aconteceu, quando, em qual máquina ou usuário, o que você fez e o que falta.</li></ul><h3>Como explicar numa entrevista</h3><p><b>Walk me through how you handle an alert.</b><br><i>I read the alert: the rule, source, user and time. Then I check the context, whether the IP is known and whether this is normal for that user. If it is a false positive I close it and note why. If it is real I contain it, escalate and document everything in the ticket.</i></p><p><b>What is the CIA triad?</b><br><i>Confidentiality, integrity and availability. Confidentiality means only authorised people can see the data, integrity means it is not changed without permission, and availability means systems and data can be used when needed.</i></p><p><b>What is the difference between a false positive and a false negative?</b><br><i>A false positive is an alert for harmless activity. A false negative is a real attack that raised no alert, which is more dangerous.</i></p>`},
