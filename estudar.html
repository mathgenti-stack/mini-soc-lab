["Funcionário saiu da empresa", "CHAMADO #4035\nO RH avisa: João (Vendas) foi desligado hoje às 17h.", "Prioridade alta", [["O que fazer primeiro com a conta dele?", ["Desativá-la (Disable Account) e encerrar as sessões", "Apagá-la na hora", "Deixá-la ativa para o gestor ver depois", "Mudar o nome da conta e continuar usando"], "Desativar corta o acesso imediatamente e mantém os dados caso a empresa precise. Apagar vem depois, pela política."], ["E o e-mail dele?", ["Seguir a política: guardar a caixa, dar acesso ao gestor ou encaminhar, sem apagar na hora", "Apagar imediatamente", "Dar a senha dele ao gestor", "Ignorar"], "O gestor pode precisar dos e-mails de trabalho. Nunca compartilhe a senha de ninguém."], ["O que completa o processo?", ["Remover dos grupos, recolher o notebook e o celular, atualizar o inventário e documentar", "Esperar que ele devolva quando quiser", "Apagar o ticket", "Manter os grupos para facilitar uma volta"], "Grupos antigos e aparelhos soltos são risco. O inventário e o ticket comprovam o que foi feito."]], "Leaver process for João (Sales).\nAction: disabled the account, removed group memberships, revoked sessions, retained the mailbox per policy, collected laptop and phone, updated the inventory.\nResult: access removed. Ticket closed."],
["GPO que não aplica", "CHAMADO #4048\nVocê criou uma GPO para bloquear pen drives no setor Financeiro. Um PC continua aceitando USB.", "Prioridade média", [["Primeiro teste no PC com problema?", ["Rodar gpupdate /force e depois gpresult /r", "Formatar o PC", "Mudar a GPO para todos os setores", "Desligar o firewall"], "gpupdate atualiza as políticas na hora. gpresult /r mostra quais GPOs estão aplicadas."], ["O gpresult não lista a GPO. O que verificar?", ["Se o computador está na OU em que a GPO está ligada (linked)", "A cor do monitor", "O tamanho do disco", "O papel de parede"], "GPO só vale para objetos dentro da OU onde está ligada. Um PC em outra OU não recebe."], ["O PC estava na OU errada. Qual é o fecho certo?", ["Mover o PC para a OU Financeiro, atualizar as políticas, testar com um pen drive e documentar", "Ligar a GPO a todo o domínio", "Desistir da GPO", "Dar o pen drive de volta e fechar"], "Corrigir a causa (OU errada), testar o resultado e documentar. Ligar a todos afetaria quem não deveria."]], "USB-blocking GPO was not applying to one Finance PC.\nCause: the computer account was in the wrong OU.\nAction: moved it to the Finance OU, ran gpupdate /force, verified with gpresult /r and a USB test.\nResult: policy applied. Ticket closed."],
["Notebook perdido (Intune)", "CHAMADO #4052\nPedro esqueceu o notebook da empresa em um táxi. Ele tem e-mails e arquivos de clientes.", "Prioridade alta", [["Primeira ação?", ["Registrar o incidente, avisar a segurança e agir rápido no dispositivo", "Esperar uma semana para ver se aparece", "Comprar outro e esquecer", "Só pedir para ele procurar"], "Dados de clientes em um aparelho perdido são um risco de vazamento. Aja rápido e avise a segurança."], ["No Intune, o que fazer com o aparelho?", ["Lock e, se necessário, Wipe", "Nada, o Windows protege sozinho", "Renomear o aparelho", "Atribuir uma licença nova"], "Lock bloqueia o aparelho. Wipe apaga os dados à distância. Retire remove só os dados da empresa."], ["O que mais deve ser feito?", ["Resetar a senha de Pedro, revogar as sessões e preparar um aparelho de reposição", "Não mexer na conta dele", "Dar a ele acesso de administrador", "Desativar o MFA"], "A conta também pode estar exposta. Reset de senha e fim das sessões reduzem o risco. MFA deve continuar ligado."]], "Company laptop lost in a taxi by user Pedro; it contained customer data.\nAction: reported to security, locked the device in Intune and issued a remote wipe, reset the password and revoked sessions, arranged a replacement.\nResult: risk contained. Ticket updated."],
["Trocou de celular e o MFA não funciona", "CHAMADO #4060\nMarta comprou um celular novo e agora não consegue passar do código do Authenticator para entrar no e-mail.", "Prioridade média", [["O que fazer antes de mexer no MFA?", ["Confirmar a identidade de Marta por um método seguro", "Desativar o MFA de todos", "Pedir o código do celular antigo por mensagem", "Dar a senha do gestor"], "Resetar MFA sem confirmar a identidade abre a porta para um golpista que roubou a senha."], ["Depois de confirmar, como resolver?", ["Redefinir os métodos de MFA da conta para ela registrar o novo celular", "Apagar a conta", "Desligar o MFA para sempre", "Trocar a licença"], "Ao redefinir os métodos, no próximo login ela configura o Authenticator no novo aparelho."], ["Como fechar?", ["Acompanhar o registro, confirmar que o e-mail abre e documentar", "Mandar um e-mail dizendo “resolvido” sem testar", "Pedir a ela para resolver sozinha", "Deixar o MFA desativado só por hoje"], "Sempre teste com o usuário. MFA desativado, mesmo por pouco tempo, é risco."]], "User replaced her phone and could not approve MFA prompts.\nAction: verified identity, reset MFA methods in Entra ID, user registered the new device in Authenticator.\nResult: sign-in confirmed. Ticket closed."]
]},
{k:"hd",n:"Helpdesk",ic:"🎧",c:"#38bdf8",d:"Suporte ao usuário: chamados do dia a dia",l:[
["Não consigo entrar no e-mail","CHAMADO #1042\nUsuária: Ana (Financeiro)\n“Não consigo entrar no e-mail desde cedo. Aparece senha incorreta.”","Prioridade média",[["Qual a primeira ação?",["Perguntar o que mudou, confirmar o erro exato e ver se outros apps funcionam","Resetar a senha na hora, sem confirmar quem é","Reinstalar o Windows","Pedir para tentar mais tarde"],"Entenda o problema antes de agir. Resetar sem confirmar a identidade abre uma brecha de segurança."],["Ana diz que trocou a senha ontem em outro aparelho. O que verificar?",["Se o celular ainda usa a senha antiga e está bloqueando a conta por tentativas","Trocar o teclado dela","Comprar um computador novo","Desligar o roteador"],"Apps com a senha antiga tentam entrar várias vezes e podem bloquear a conta."],["Qual é a solução correta?",["Confirmar a identidade, desbloquear a conta, orientar a atualizar a senha no celular e registrar no ticket","Pedir a senha dela para testar","Apagar a conta e criar outra","Fechar o chamado sem testar"],"Nunca peça a senha do usuário. Confirme a identidade, resolva, teste e documente."]],"User could not log in to email after changing the password yesterday.\nCause: phone still using the old password, causing repeated failed attempts and an account lock.\nAction: verified identity, unlocked the account, user updated the password on the phone.\nResult: login confirmed. Ticket closed."],
["Computador lento","CHAMADO #1057\nUsuário: João (Vendas)\n“O PC está muito lento há 2 dias.”","Prioridade média",[["O que checar primeiro?",["Task Manager: uso de CPU, memória e disco e programas na inicialização","Formatar o computador","Trocar o mouse","Pedir para ele esperar"],"O Task Manager mostra o que está consumindo recursos agora."],["O disco está em 100% e um programa desconhecido usa muito processador. Próximo passo?",["Investigar o programa (local, nome, editor), rodar o antivírus e escalar se parecer malware","Encerrar e ignorar","Apagar a pasta do Windows","Reinstalar o navegador"],"Programa desconhecido com uso alto pode ser malware: investigue e escale, não só encerre."],["Era um programa legítimo travado e há 3 GB livres. Como fechar?",["Reiniciar o app, liberar espaço, orientar o usuário e registrar a causa","Fechar sem falar com o João","Trocar o PC","Dizer que foi vírus sem provar"],"Resolva, explique ao usuário e documente a causa real."]],"User reported a slow PC for 2 days.\nCause: a legitimate application was frozen and using high CPU; disk space was low.\nAction: restarted the application, freed 3 GB, and advised the user.\nResult: performance back to normal. Ticket closed."],
["Impressora não imprime","CHAMADO #1063\nSetor: Financeiro (5 pessoas)\n“Só o nosso setor não imprime. Os outros imprimem.”","Prioridade alta",[["Qual a primeira pergunta útil?",["Quem é afetado, desde quando e o que aparece (erro, fila parada)","Quem derrubou a impressora?","Vamos comprar outra impressora","Reinicie o prédio"],"Delimite o problema: quem, quando e qual sintoma."],["Só o Financeiro é afetado e o PC mostra driver não disponível. Hipótese?",["Problema de driver ou de configuração naquele grupo de computadores","A internet do mundo caiu","O papel acabou em todas as impressoras","Erro de DNS"],"Se os outros imprimem, o problema é local desse grupo."],["Como validar a correção?",["Reinstalar o driver, imprimir uma página de teste com o usuário e documentar","Dizer que deve funcionar e fechar","Reiniciar sem testar","Pedir que o usuário resolva"],"Só feche o chamado depois de testar com o usuário."]],"Finance team (5 users) could not print; other teams were fine.\nCause: printer driver missing on those computers.\nAction: reinstalled the driver and printed a test page with the users.\nResult: printing restored. Ticket closed."]
]},
{k:"it",n:"Técnico de TI",ic:"🔧",c:"#34d399",d:"Equipamentos, rede e manutenção",l:[
["Preparar um notebook novo","CHAMADO #2011\nNovo colaborador começa na segunda e precisa de um notebook configurado.","Prioridade média",[["O que fazer antes de entregar?",["Seguir o checklist: atualizar o Windows, instalar os programas padrão, ativar antivírus e criptografia e criar a conta com as permissões certas","Entregar como veio da caixa","Dar acesso de administrador a tudo","Instalar programas piratas"],"Um checklist garante o mesmo padrão e a segurança em todos os equipamentos."],["O funcionário pede acesso de administrador local. Qual a resposta?",["Seguir o menor privilégio: dar só o necessário e pedir aprovação do gestor se precisar de mais","Dar na hora para evitar chamados","Recusar sem explicar","Dar a senha de administrador do domínio"],"Menos permissão reduz o estrago se a conta for comprometida."],["Como finalizar?",["Registrar o inventário (modelo, número de série, usuário) e entregar com um termo de recebimento","Deixar na mesa","Anotar no papel","Não registrar"],"Inventário permite saber o que existe, onde está e quem usa."]],"Prepared a new laptop for a new starter.\nAction: updated Windows, installed standard software, enabled antivirus and disk encryption, created the account with standard permissions.\nResult: laptop delivered, inventory updated (model, serial number, user) and receipt signed."],
["Sala sem rede","CHAMADO #2024\n“Sala 3: nenhum computador tem internet. O resto do prédio funciona.”","Prioridade alta",[["O que sugere o problema só nessa sala?",["Problema local: switch, cabo ou porta daquela sala","Queda do provedor","Falha global de DNS","Vírus no computador do diretor"],"Se o resto funciona, a internet está bem: foque no que é só dessa sala."],["Os computadores têm IP 169.254.x.x. O que isso indica?",["Não receberam IP do DHCP: verificar a conexão com a rede e o switch","Estão conectados normalmente","O Windows está desatualizado","O site está fora do ar"],"169.254 é um IP automático de emergência, sem DHCP."],["O switch estava sem energia. Próximo passo?",["Religar, confirmar IP e internet e documentar a causa e a correção","Religar e ir embora","Trocar todos os cabos","Reinstalar os computadores"],"Confirme com os usuários e registre a causa para prevenir."]],"Room 3 had no network access; the rest of the building was fine.\nCause: the room switch had lost power; computers showed 169.254.x.x addresses (no DHCP).\nAction: restored power to the switch and confirmed valid IP addresses and internet access.\nResult: network restored. Recommended a UPS."],
["Servidor com disco cheio","ALERTA #2040\nServidor de arquivos: 95% do disco usado.","Prioridade alta",[["Primeiro passo?",["Descobrir o que usa o espaço antes de apagar qualquer coisa","Apagar pastas aleatórias","Ignorar até chegar a 100%","Formatar o disco"],"Medir antes de agir evita perder dados importantes."],["A maior parte são backups antigos duplicados. O que fazer?",["Confirmar a política de retenção, remover só o que ela permite e conferir se o backup atual está íntegro","Apagar todos os backups","Mover para o desktop de alguém","Desligar o servidor"],"Siga a política e confirme que o backup atual funciona."],["Como evitar que volte a acontecer?",["Criar alerta de espaço, automatizar a limpeza pela política e documentar","Esperar o próximo alerta","Comprar disco sem analisar","Desativar o alerta"],"Prevenção e documentação evitam que o problema se repita."]],"File server disk at 95%.\nCause: duplicated old backups.\nAction: confirmed the retention policy, removed expired backups, verified the latest backup is intact, set up a space alert.\nResult: usage down to 60%."]
]},
{k:"soc",n:"Analista de SOC",ic:"🛡️",c:"#a78bfa",d:"Triagem de alertas e resposta a incidentes",l:[
["Login de administrador fora do horário","ALERTA SIEM #3001\n03:20 login da conta ops-admin vindo de outro país.","Prioridade alta",[["Primeira ação na triagem?",["Checar o contexto: IP, país, horário habitual, viagem ou VPN e outros eventos da conta","Fechar como falso positivo","Bloquear todos os usuários","Ignorar até de manhã"],"Triagem começa pelo contexto, antes de decidir."],["Não há viagem nem VPN e a conta baixou arquivos depois do login. O que indica?",["Verdadeiro positivo provável: possível conta comprometida","Comportamento normal","Erro do SIEM","Atualização do Windows"],"Login incomum seguido de ação suspeita eleva muito o risco."],["Quais as ações corretas?",["Contenção: encerrar sessões e forçar a troca de senha, escalar ao Nível 2 e preservar os logs","Apagar os logs","Mandar um e-mail depois","Deixar o acesso aberto para observar"],"Conter, escalar e preservar as evidências."]],"Alert: ops-admin logged in at 03:20 from an unusual country; files downloaded afterwards.\nAssessment: true positive, possible account compromise.\nAction: terminated sessions, forced a password reset, preserved logs, escalated to Tier 2."],
["EDR: executável em pasta temporária","ALERTA EDR #3014\nPC-12 executou update.exe da pasta Temp e abriu conexões externas.","Prioridade alta",[["O que olhar primeiro?",["Quem executou, o hash e a reputação do arquivo, o processo pai e para onde conectou","Só o nome do arquivo","A cor do ícone","Nada, é update"],"Um nome inocente não prova nada: veja origem, hash e conexões."],["O hash é conhecido como malicioso. Próximo passo?",["Isolar o PC pelo EDR, escalar e coletar evidências","Reiniciar o PC","Apagar o arquivo e seguir","Avisar só no fim do mês"],"Isolar impede que a ameaça se espalhe e preserva evidências."],["Como registrar o caso?",["O que aconteceu, quando, máquina e usuário, indicadores (hash, IP), ações e próximos passos","Só “resolvido”","Opinião sobre o usuário","Nada"],"Um bom registro permite que outra pessoa continue o caso."]],"EDR alert: update.exe ran from Temp on PC-12 and made external connections.\nAssessment: file hash known as malicious.\nAction: isolated the host, collected evidence, escalated to Tier 2.\nIOCs: file hash and destination IP recorded."],
["Phishing em massa","CASO #3027\n10 usuários reportaram um e-mail “Fatura em atraso” com anexo.","Prioridade alta",[["Como tratar vários relatos iguais?",["Tratar como campanha: analisar uma amostra, achar o padrão e ver quem abriu ou clicou","Responder um por um sem ligar os casos","Ignorar, são só 10","Abrir o anexo no seu PC"],"Vários relatos iguais indicam uma campanha, não casos isolados."],["3 usuários abriram o anexo. Qual a prioridade?",["Isolar e investigar esses 3 computadores, resetar as senhas e checar o que mais eles fizeram","Só apagar o e-mail","Punir os usuários","Esperar"],"Quem abriu o anexo pode estar comprometido: contenha primeiro."],["Para reduzir novos casos?",["Bloquear remetente, domínio e anexo, remover o e-mail das caixas e avisar os usuários","Nada, é raro","Desligar o e-mail da empresa","Só pedir cuidado"],"Bloquear, remover e comunicar reduz o impacto."]],"Phishing campaign: 10 reports of a fake invoice email with an attachment.\nImpact: 3 users opened the attachment.\nAction: isolated the 3 hosts, reset passwords, blocked the sender and domain, removed the email from mailboxes, notified users."],
["Muitos bloqueios de conta", "ALERTA SIEM #3040\n40 eventos 4625 (falha de login) em 2 min contra a conta ops-admin, seguidos de um 4740 (conta bloqueada). Origem: um único IP externo.", "Prioridade alta", [["O que esse padrão sugere?", ["Tentativa de força bruta contra a conta", "Uso normal", "Falha do monitor", "Atualização do Windows"], "Muitas falhas rápidas, seguidas de bloqueio e vindas de um IP externo, é o padrão clássico de força bruta."], ["O que você verifica?", ["Se houve um 4624 (sucesso) depois, de que IP e se a conta fez algo suspeito", "Só o nome do IP", "Nada, a conta já está bloqueada", "O papel de parede do PC"], "A conta bloqueada pode ter sido o fim do ataque, mas um 4624 antes do bloqueio ou de outro IP muda tudo."], ["Ações corretas?", ["Bloquear o IP, confirmar com o dono da conta, forçar troca de senha se houve sucesso, registrar os IOCs e escalar se preciso", "Desbloquear sem verificar", "Apagar os logs", "Ignorar"], "Contenha, confirme, registre os indicadores e escale. Nunca apague logs."]], "Alert: 40 failed logins (4625) against ops-admin followed by a lockout (4740) from one external IP.\nAssessment: brute-force attempt; no successful login (4624) found.\nAction: blocked the source IP, informed the account owner, recorded the IP as an IOC.\nResult: contained, monitoring continues."],
["Usuário adicionado a Domain Admins", "ALERTA SIEM #3052\nEvento 4728: o usuário temp-user foi adicionado ao grupo Domain Admins às 02:10 pela conta svc-backup.", "Prioridade crítica", [["Por que isso é grave?", ["Domain Admins controla todo o domínio. Um acesso indevido pode comprometer a empresa inteira", "É só um grupo qualquer", "É normal à noite", "É um alerta de impressora"], "Domain Admins é o grupo mais poderoso do AD. Mudanças nele devem ser raras, aprovadas e documentadas."], ["O que checar?", ["Se existe um chamado de mudança aprovado, quem fez, de qual máquina e o que mais a conta svc-backup fez", "Só a cor do alerta", "Nada, esperar de manhã", "Se o usuário gosta do TI"], "Sem mudança aprovada e com uma conta de serviço fazendo algo fora do normal, é muito suspeito."], ["Sem mudança aprovada, qual é a ação?", ["Escalar como incidente crítico, remover o usuário do grupo conforme o procedimento, isolar a origem e preservar evidências", "Deixar para depois do fim de semana", "Apagar o usuário e os logs", "Ignorar"], "Contenha rapidamente e escale. Preserve os logs para a investigação."]], "Alert: user temp-user added to Domain Admins (event 4728) at 02:10 by svc-backup. No approved change found.\nAssessment: probable privilege escalation.\nAction: escalated as critical, removed the user from the group per procedure, isolated the source host, preserved logs.\nResult: handed to Tier 2."]
]}

let CT=null,CC=null,CS=0,CP=0,CR=null;
function rCh(){const el=$("v6");S.ch=S.ch||{};
if(CT===null){el.innerHTML='<p class="mu">Situações reais de trabalho. Escolha uma carreira.</p>'+CH.map((t,i)=>{const done=t.l.filter((_,j)=>S.ch[t.k+j]).length;return `<button class="note tc" data-tr="${i}" style="--c:${t.c}"><span class="ic">${t.ic}</span><span class="tx"><b>${esc(t.n)}</b><span class="mu">${esc(t.d)}</span><span class="mu">${done} de ${t.l.length} desafios concluídos</span><span class="bar"><i style="width:${100*done/t.l.length}%"></i></span></span><span class="ch">›</span></button>`}).join("");el.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{CT=+b.dataset.tr;CC=null;rCh()});return}
const t=CH[CT];
if(CC===null){el.innerHTML=`<button class="btn" id="cb" style="width:100%;margin-bottom:8px">← Carreiras</button><h2>${t.ic} ${esc(t.n)}</h2>`+t.l.map((c,j)=>`<button class="note" data-j="${j}" style="padding:14px"><b>${esc(c[0])}</b><span class="mu" style="display:block;font-weight:400">${S.ch[t.k+j]?"✅ Melhor: "+S.ch[t.k+j].b+"/"+c[3].length:"Ainda não feito"} · ${esc(c[2])}</span></button>`).join("");$("cb").onclick=()=>{CT=null;rCh()};el.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{CC=+b.dataset.j;CS=0;CP=0;CR=null;rCh()});return}
const c=t.l[CC],st=c[3];
if(CS>=st.length){const key=t.k+CC,best=Math.max(CP,(S.ch[key]||{}).b||0);S.ch[key]={b:best};markToday("ch");save();
el.innerHTML=`<div class="card"><div class="q">Resultado: ${CP} de ${st.length}</div><p>${CP==st.length?"Excelente: você decidiu certo em todas as etapas.":"Releia as explicações e tente de novo para melhorar."}</p><h2>Como registrar no ticket</h2><pre class="lg">${esc(c[4])}</pre><p class="mu">Em vagas no Reino Unido, a nota do ticket costuma ser em inglês. Treine escrever assim.</p><div class="row"><button class="btn" id="cp2">Copiar nota</button><button class="btn p" id="cr">Refazer</button></div><div class="row"><button class="btn" id="cl">Voltar à lista</button></div></div>`;
$("cp2").onclick=async()=>{try{await navigator.clipboard.writeText(c[4]);$("cp2").textContent="Copiado"}catch(e){}};$("cr").onclick=()=>{CS=0;CP=0;CR=null;rCh()};$("cl").onclick=()=>{CC=null;rCh()};return}
const s=st[CS];if(!CR)CR=shuf(s[1].map((x,k)=>[x,k==0]));
el.innerHTML=`<button class="btn" id="cl" style="width:100%;margin-bottom:8px">← Lista</button><div class="card"><p class="mu">${esc(t.n)} · ${esc(c[2])} · etapa ${CS+1} de ${st.length}</p><pre class="lg">${esc(c[1])}</pre><div class="q">${esc(s[0])}</div><div id="ho"></div><div id="hf"></div></div>`;

const RC={offsec:["Segurança ofensiva = atacar com autorização para achar falhas antes dos criminosos.", "Sempre há contrato por escrito com escopo. Sem isso é crime.", "Hackers: white hat (ético), black hat (criminoso) e grey hat (sem permissão, sem má intenção, ainda ilegal).", "Fases: reconhecimento, enumeração, exploração, pós-exploração e relatório.", "Vulnerabilidade = falha. Ameaça = quem pode usar. Exploit = método. Risco = chance e estrago.", "Esconder uma página não é proteger. Foi a lição do banco falso.","Banco falso: dirb achou a página /bank-transfer, que permitia depositar dinheiro. A defesa mais eficaz é exigir login.","Sarah testa logins fracos (ofensiva). Mike cria regra de firewall (defensiva)."],defsec:["Defensiva = prevenir, detectar e responder. É o blue team.", "SOC: equipe que monitora alertas, investiga e responde.", "Threat Intelligence: estudar atacantes e indicadores (IPs, domínios).", "DFIR: forense digital e resposta a incidentes.", "Malware analysis: entender o que um programa malicioso faz.", "SIEM: reúne logs e gera alertas.","Exercício FakeBank: alerta de login suspeito, parar o ataque (desativar a conta), investigar (threat intelligence, grupo ShadowFigures) e relatório de incidente.","Ao detectar invasão, primeiro confirmar e entender, depois agir. Falso que a prioridade seja eliminar na hora."],careers:["Defesa: analista de SOC, engenheiro, respondedor de incidentes, perito forense, analista de malware, threat intelligence.", "Ofensiva: pentester e red teamer.", "GRC: governança, risco e conformidade (políticas e auditorias).", "Caminho comum: help desk, SOC nível 1, nível 2 ou 3 ou especialização."],insidepc:["CPU executa. RAM guarda o que está em uso e apaga ao desligar. Armazenamento guarda para sempre.", "Volátil = perde sem energia (RAM). Não volátil = SSD, HDD, pendrive.", "SSD (chips, rápido) x HDD (disco giratório, mais lento e barato).", "BIOS/UEFI testa o hardware e inicia o boot. O SO é carregado na RAM.", "Forense: captura a RAM antes de desligar. CPU em 100% sem motivo pode ser minerador.","Corpo humano (sala): CPU cérebro, RAM memória curta, HDD e SSD memória longa, placa-mãe esqueleto e nervos, PSU coração e pulmões, GPU córtex visual.","Boot: botão, firmware UEFI (substituiu o BIOS), POST, dispositivo de boot, bootloader (leva o SO para a RAM)."],ctypes:["Tipos: PC, servidor, celular e tablet, embarcado, IoT, mainframe, supercomputador.", "Servidor: fornece serviços, fica ligado o tempo todo, atende muitos clientes.", "Embarcado: chip pequeno com função fixa. IoT: aparelho conectado à internet.", "IoT é risco: senha padrão e poucas atualizações. Pode virar botnet.", "Inventário de ativos: não se protege o que não se conhece.","Exercício da empresa atacada: tudo que tem chip e rede é computador, até a cafeteira. Desligue e isole todos."],clientserver:["Cliente faz o pedido, servidor responde. Exemplo: navegador e servidor web.", "Pedido, processamento, resposta.", "IP diz onde está o servidor, a porta diz qual serviço, o DNS traduz nomes em IP.", "Cliente-servidor: servidor central. P2P: cada aparelho é cliente e servidor.", "DDoS: muitos pedidos falsos derrubam o servidor (disponibilidade).", "Códigos: 200 ok, 403 proibido, 404 não encontrado, 500 erro do servidor.","Pizzaria: cliente pede (request), servidor responde (response), protocolo são as regras, porta é a porta de cada serviço, DNS é o GPS.","HTTP não tem estado: o site usa cookie ou token de sessão. Métodos: GET pede, POST envia. URL: scheme, host e arquivo."],encoding:["Caractere = número com significado combinado. Esse combinado é a codificação (encoding).","Símbolos estranhos no texto: quem salvou e quem abriu usaram codificações diferentes (mojibake).","ASCII: 1963, 7 bits, 128 códigos (0 a 127). A é 65, a é 97, 0 é 48. Letras e dígitos em ordem.","Códigos 0 a 31 e 127 são de controle. 10 é LF (nova linha), 127 é DEL.","Hello em hex: 48 65 6c 6c 6f 0a (o 0a é o Enter).","ISO-8859-1 (Europa Ocidental) e ISO-8859-2 (Europa Central) usam os códigos acima de 127 de formas diferentes. Daí a confusão.","Unicode: um número único (code point, como U+0041) para cada caractere do mundo, quase 157 mil na versão 17.0.","UTF-8: 1 a 4 bytes, compatível com o ASCII, muito comum na web. UTF-16: 2 ou 4 bytes (par substituto). UTF-32: sempre 4 bytes.","Segurança: filtro e servidor podem decodificar de formas diferentes, e letras parecidas de outros alfabetos disfarçam endereços. Codificar não é criptografar."],virt:["VM = computador feito de software dentro de outro. Host = físico. Guest = VM. Hypervisor = gerencia.", "Tipo 1 roda direto no hardware (servidores). Tipo 2 roda em um SO (VirtualBox).", "Benefícios: economia, isolamento, snapshots, flexibilidade.", "Container compartilha o SO do host: mais leve e menos isolado.", "Segurança: sandbox para testar arquivos suspeitos. Riscos: VM escape e hypervisor invadido.","Antes: um servidor para cada aplicação. Custo alto, uso de 5% a 20%, implantação lenta, difícil de crescer.","Prédio: servidor físico, apartamentos são as VMs, moradores são as aplicações, síndico é o hypervisor.","Tipo 1: produção, banco de dados, data center. Tipo 2: estudo, malware, Kali, testes. Ao testar malware, isole a VM.","Container usa o kernel do host (por isso não roda container Windows em Linux). Imagem de container = receita. Docker cria e roda containers.","AutoGalo: reiniciar Mail-SERVER em Error, criar Marketing-VM (4 núcleos, 8 GB, 100 GB), HV-PROD-02 quase cheio (98% CPU), HV-BACKUP-01 desconectado."],segso:["Hardware = parte física. Software = programas. SO = camada entre os dois.", "Tipos de SO: computador (Windows 11, macOS), celular (Android, iOS), servidor (Windows Server, IBM AIX) e Linux (os dois).", "CIA: Confidencialidade (só quem deve vê), Integridade (ninguém altera), Disponibilidade (funciona quando preciso).", "Autenticação: algo que você sabe, é e tem. Dois ou mais juntos = MFA.", "Boa senha: longa, única, frase de palavras sem relação, em um gerenciador. Evite padrões de teclado e trocas como p4ssw0rd.", "Menor privilégio: cada um acessa só o que precisa. Permissões fracas atingem confidencialidade e integridade.", "Trojan dá acesso ao atacante. Ransomware criptografa os arquivos e atinge a disponibilidade.","SSH: acesso remoto criptografado, porta TCP/22, também transfere arquivos (SCP e SFTP). Autentica por senha ou por par de chaves. Substituiu o Telnet, que era em texto puro.","Lab: senha digitada no Linux não aparece (normal). ls não mostra escondidos (use ls -a). cat mostra arquivo. history mostra comandos antigos, e senha digitada por engano fica lá."],dados:["O computador só entende 2 estados, escritos como 0 e 1 (binário, base 2).", "Decimal: base 10 (0 a 9). Hexadecimal: base 16 (0 a 9 e A a F). Octal: base 8 (0 a 7).", "4 bits viram 1 dígito hex. 3 bits viram 1 dígito octal.", "Bit = 0 ou 1. Byte = 8 bits = octeto. Um byte vai de 0 a 255.", "Cor = vermelho, verde e azul (RGB), 1 byte cada: 256 x 256 x 256 = 16.777.216 cores. Hex: #RRGGBB.", "Onde aparece: IPv4 (4 octetos), MAC (hex), hashes de arquivos (hex) e permissões do Linux (octal)."],redes:["Abrir um site: o DNS descobre o IP, o TCP conecta (SYN, SYN-ACK, ACK), o TLS protege e o HTTP pede a página.","IP = onde estou agora (muda por rede). MAC = número de série da placa de rede.","DNS traduz nome em IP (porta 53). DHCP entrega IP, máscara, gateway e DNS.","TCP = carta registrada (confirma a entrega). UDP = panfleto (rápido, sem garantia).","Switch liga aparelhos da mesma rede. Roteador liga redes diferentes. Firewall filtra por regras.","Portas: 22 SSH, 23 Telnet (inseguro), 25 SMTP, 53 DNS, 80 HTTP, 443 HTTPS, 445 SMB, 3389 RDP.","OSI: IP na camada 3, TCP e UDP na 4, HTTP e DNS na 7. Frase: Please Do Not Throw Sausage Pizza Away.","Códigos HTTP: 200 OK, 301 movido, 401 sem login, 403 proibido, 404 não encontrado, 500 erro no servidor."],
cloud:["Duas perguntas: ONDE a nuvem fica (pública, privada, híbrida) e QUANTO você gerencia (IaaS, PaaS, SaaS).","IaaS: quarto vazio (EC2). PaaS: apartamento mobiliado. SaaS: hotel, tudo pronto (Gmail, Zoom).","Responsabilidade compartilhada: o provedor protege a infraestrutura; você protege contas, permissões, dados e configurações.","Benefícios: escalabilidade, autosserviço, pagar pelo que usa, alta disponibilidade e acesso global.","Erros comuns: armazenamento público, chaves no código e permissão demais."],
so:["O sistema operacional é a ponte entre os apps e o hardware (Windows, Linux, macOS, Android).","Kernel = cozinha (acesso total ao hardware). User space = salão (apps com permissão limitada).","GUI = visual, com janelas e cliques. CLI = texto, mais rápida e automatizável.","Processo = programa em execução. Driver = tradutor entre o SO e um dispositivo.","Logs: Event Viewer no Windows e /var/log no Linux."],
win:["Desktop, Taskbar, Start Menu e Search: para navegar e achar coisas.","File Explorer = arquivos. Microsoft Store = apps. Windows Update = correções e segurança.","Settings (moderno) e Control Panel (antigo) configuram o computador.","Task Manager (Ctrl+Shift+Esc): vê CPU, memória e disco e encerra app travado.","Windows Security = proteção contra ameaças. Firewall = controla o tráfego de rede.","Programa desconhecido usando muito processador? Task Manager primeiro."],
linux:["pwd = onde estou. ls = o que tem aqui. ls -l = detalhes. ls -al = com arquivos ocultos.","cd entra na pasta, cd .. sobe um nível, cd - volta ao lugar anterior.","cat lê um arquivo. find procura arquivos.","whoami = meu usuário. uname -a = sistema e kernel. df -h = espaço em disco.","/etc guarda configurações. cat /etc/os-release mostra a versão do Linux.","No Linux, maiúsculas e minúsculas fazem diferença."],
wcli:["cd (sozinho) = onde estou. dir = o que tem. dir /a = com ocultos. dir /s = procura nas subpastas.","cd .. sobe um nível. type lê um arquivo.","whoami = usuário. hostname = nome do PC. systeminfo = versão do Windows. ipconfig = rede (com /all: MAC, DNS, DHCP).","Linux para Windows: pwd é cd, ls é dir, cat é type, find é dir /s, uname -a é systeminfo."],
ms:["AD DS = cadastro central de usuários, computadores e grupos. O Domain Controller (DC) valida os logins.","ADUC (dsa.msc): criar usuário, resetar senha, Unlock account e ver grupos (Member Of).","OU organiza e recebe GPO. Grupo dá permissão. A permissão vai para o grupo, não para a pessoa.","GPO = regras para muitos PCs. gpupdate /force atualiza e gpresult /r mostra o que está aplicado.","Bloqueada = tentativas erradas. Desativada = o TI desligou. Expirada = senha velha.","Entra ID = identidade na nuvem. Sem licença do Microsoft 365 não existe e-mail.","MFA = senha mais um segundo fator. Celular novo: confirme a identidade e redefina os métodos.","Intune gerencia dispositivos. Perdeu o aparelho? Lock, Wipe ou Retire.","O AD precisa do DNS. Sem DHCP aparece o IP 169.254.x.x.","Saída de funcionário: desativar, tirar dos grupos, recolher aparelhos e só depois apagar, pela política.","Event IDs: 4624 login ok, 4625 falha, 4740 bloqueio, 4720 conta criada."],
soc:["SOC = time que vigia a segurança 24h. Nível 1 faz triagem, Nível 2 investiga, Nível 3 caça ameaças e lidera.","Alerta: ler, checar o contexto, decidir falso ou verdadeiro positivo, conter ou escalar e registrar no ticket.","Falso positivo = alerta à toa. Falso negativo = ataque real sem alerta (o pior).","SIEM junta logs. EDR vigia e isola computadores. Firewall e IDS/IPS filtram e detectam tráfego.","Incidente (NIST): preparação; detecção e análise; contenção, erradicação e recuperação; lições aprendidas.","MITRE ATT&CK = catálogo de táticas e técnicas. Força bruta: T1110. Phishing: T1566.","CIA = Confidencialidade, Integridade e Disponibilidade.","Phishing: veja o remetente, o link sem clicar, o anexo e quem mais recebeu."],
vagas:["Mais pedidos: Redes, Windows, Linux, logs, SIEM (Splunk, Sentinel), EDR e MITRE.","Security+ é a certificação de entrada mais comum. SC-200 vem depois.","Vaga júnior que pede 2 anos: mostre provas práticas, como write-ups e home lab.","Leia os requisitos de SC/BPSS e de turnos antes de se candidatar.","Nunca invente experiência."],
ent:["Fale em voz alta e em inglês. Use STAR: Situação, Tarefa, Ação e Resultado.","Prepare 2 histórias reais do seu trabalho em TI.","Não sabe a resposta? Diga o que sabe, como investigaria e admita o que não sabe.","Leve 3 perguntas para fazer ao entrevistador.","Sobre turnos: responda com sinceridade."]};

Object.assign(RC,{"powershell": ["PowerShell trabalha com objetos (campos), não com texto: dá para filtrar por IP, usuário ou Event ID.", "Comandos são Verbo-Substantivo (Get-Content, Import-Csv) e o | passa objetos de um para o outro.", "Filtrar: Where-Object. Ordenar: Sort-Object. Contar por campo: Group-Object. Total: Measure-Object.", "Comparar com -eq, -ne, -gt, -lt, -like e -match (nunca com =).", "Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} lê os logins com falha.", "Sinais de ataque: -EncodedCommand, janela escondida, IEX baixando da internet. O evento 4104 mostra o script."], "logs": ["Log é o diário do sistema: quando, onde, quem, de onde e o que aconteceu.", "4624 = login ok. 4625 = falha. 4740 = conta bloqueada. 4720 = conta criada. 4688 = programa iniciado. 1102 = log apagado.", "Logon Type: 2 = no teclado, 3 = pela rede, 10 = Área de Trabalho Remota (RDP).", "Sysmon dá mais detalhes: 1 = processo com linha de comando, 3 = conexão de rede, 22 = DNS.", "Linux: /var/log/auth.log (ou /var/log/secure). Procure Failed password, Invalid user, Accepted e sudo.", "Força bruta = muitas senhas numa conta. Spray = poucas senhas em muitas contas. Sucesso depois de falhas = alerta."], "siem": ["SIEM junta os logs de tudo, normaliza, correlaciona, alerta e guarda.", "Splunk usa SPL. Microsoft Sentinel usa KQL. A lógica é a mesma.", "Consulta típica: filtrar → contar por campo → ordenar → pegar os primeiros.", "SPL: stats count by src_ip | sort - count. KQL: summarize count() by IpAddress | top 10 by count_.", "Regra de detecção = consulta que roda sozinha e gera alerta. Sigma = regra em formato aberto.", "Sempre limite o período (earliest=-24h / ago(24h))."], "phishing": ["Phishing finge ser alguém confiável para roubar senha, dinheiro ou instalar malware (MITRE T1566).", "Spear phishing é sob medida. BEC finge ser o chefe ou um fornecedor pedindo pagamento.", "Cheque From, Reply-To e Return-Path. Domínio parecido (micros0ft.com) é golpe.", "SPF = servidor autorizado. DKIM = assinatura. DMARC = o que fazer se falhar.", "Received se lê de baixo para cima. Links e anexos: urlscan, VirusTotal ou sandbox, nunca clicar.", "Alguém digitou a senha? Trocar senha, encerrar sessões, checar MFA e regras da caixa de entrada."], "ir": ["Triagem: o que disparou, é normal, o que diz a threat intel, deu certo, qual o tamanho.", "Verdadeiro positivo, falso positivo e verdadeiro positivo benigno (autorizado).", "Fases: preparação, detecção e análise, contenção, erradicação, recuperação, lições aprendidas.", "EDR mostra a árvore de processos e isola a máquina. Word abrindo PowerShell = suspeito.", "MITRE ATT&CK: tática = porquê, técnica = como (T1110 força bruta, T1078 contas válidas).", "Ticket bom: o que, quando, onde, o que verificou, o que fez e o que falta."], "sd": ["Service Desk é o ponto único de contato entre os usuários e a TI.", "N0 autoatendimento, N1 primeiro atendimento, N2 especialistas, N3 engenharia ou fornecedor.", "Incidente = algo parou. Requisição = pedido padrão (com aprovação). Problema = causa raiz. Mudança = alteração planejada.", "Prioridade = impacto × urgência. Empresa parada = P1. Uma pessoa sem trabalhar = P3.", "SLA = prazo de primeira resposta e de solução para cada prioridade.", "Escalar com tudo pronto: sintoma, desde quando, quem, o que testou. Segurança: sempre avisar."], "atend": ["Roteiro: abertura, identificação, entender, registrar, resolver ou encaminhar, confirmar e encerrar.", "Perguntas abertas para entender, fechadas para confirmar, e parafrasear para não errar.", "Antes de reset de senha ou MFA: confirmar a identidade pelo processo (ligar de volta no número cadastrado).", "Urgência + autoridade + 'manda para outro número' = engenharia social.", "Usuário irritado: ouvir, reconhecer o impacto, desculpar-se pela situação e focar na solução.", "Nota do ticket: sintoma, o que verificou, o que fez, resultado e próximo passo. Sem opinião."], "trouble": ["7 passos: identificar, teoria, testar, planejar, aplicar, verificar, documentar.", "Divida: quem (um ou todos), o quê, quando (o que mudou?) e onde.", "Rede de baixo para cima: cabo, IP, gateway, internet, DNS, aplicação.", "169.254.x.x = sem DHCP. Ping no IP funciona e no nome não = DNS.", "Impressora travada: limpar a fila e reiniciar o Spooler. Outlook: testar na web.", "Uma mudança por vez, anote como estava e documente o que resolveu."], "contas": ["AD = contas da rede local. Entra ID = contas na nuvem. Quase sempre híbrido.", "Bloqueada = errou a senha. Desativada = de propósito. Senha expirada = passou do prazo.", "Bloqueio repetido = aparelho com senha antiga. O evento 4740 mostra o computador de origem.", "MFA: confirmar identidade e redefinir os métodos. MFA que a pessoa não pediu = segurança.", "Sem licença, sem e-mail. Caixa compartilhada: Full Access, Send As, Send on Behalf.", "Menor privilégio, acesso por grupo, aprovação registrada. Mudou de setor: tirar os acessos antigos."], "sysmon": ["Sysmon grava o que roda no Windows: processo, linha de comando, pai, hash, rede e DNS.", "1 = processo, 3 = conexão, 10 = acesso a processo (lsass!), 11 = arquivo, 13 = registro, 22 = DNS.", "Árvore: Word → PowerShell, Outlook → wscript = suspeito. Olhe sempre o pai.", "LOLBins: ferramentas do Windows usadas para atacar (certutil, mshta, rundll32).", "-enc, -w hidden, IEX, DownloadString: sinais na linha de comando do PowerShell.", "EDR = telemetria + detecção por comportamento + resposta (isolar a máquina)."], "deteccao": ["Regra de detecção = lógica que roda sozinha sobre os logs e gera alerta.", "Tipos: IOC, comportamento (TTP), limite, anomalia e correlação.", "Sigma = regra em YAML (logsource, detection, condition) convertida para qualquer SIEM.", "YARA = arquivos. Suricata/Snort = tráfego de rede.", "Falso negativo é o pior: o ataque passou sem alerta.", "Tuning com exclusões específicas, com dono e data. Nunca desligar a regra inteira."], "cti": ["Threat intel = informação sobre ameaças com contexto, para decidir.", "Níveis: estratégica, operacional, tática (TTPs) e técnica (IOCs).", "Pirâmide da dor: hash e IP são fáceis de trocar; TTPs são difíceis.", "VirusTotal, AbuseIPDB, GreyNoise, URLhaus, MISP. Nunca suba arquivo interno.", "TLP: CLEAR público, GREEN comunidade, AMBER organização, RED só quem estava na conversa.", "ATT&CK: 14 táticas (porquê) e técnicas (como): T1566 phishing, T1110 força bruta, T1059.001 PowerShell."]});
