<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Estudar · Mini SOC Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: painel de status no topo da tela Hoje, barra de abas fixa embaixo, conteúdo em cartões de uma coluna */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f4f7;--sf:#ffffff;--sf2:#e8eef4;--tx:#101b28;--mu:#566478;--bd:#d6dee8;--ac:#0f766e;--acs:#d6efea;--onac:#ffffff;
--ok:#15803d;--onok:#ffffff;--bad:#b91c1c;--onbad:#ffffff;--warn:#b45309;
--hd:#0e1b2a;--hdt:#e8f1fa;--hdm:#9db3c8;--hdac:#2dd4bf;--card:var(--sf);
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#091119;--sf:#111b27;--sf2:#182534;--tx:#e6edf5;--mu:#8c9db0;--bd:#223244;--ac:#2dd4bf;--acs:#12332f;--onac:#04201c;--ok:#4ade80;--onok:#052e16;--bad:#fb7185;--onbad:#2a0a10;--warn:#fbbf24;--hd:#0d1a28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#091119;--sf:#111b27;--sf2:#182534;--tx:#e6edf5;--mu:#8c9db0;--bd:#223244;--ac:#2dd4bf;--acs:#12332f;--onac:#04201c;--ok:#4ade80;--onok:#052e16;--bad:#fb7185;--onbad:#2a0a10;--warn:#fbbf24;--hd:#0d1a28;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--tx);font:16px/1.5 var(--sans);padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide{display:none!important}
/* painel de status */
.hero{background:var(--hd);color:var(--hdt);border-radius:20px;padding:18px;margin-top:14px}
.hr{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;background:var(--hdac);color:#06231f;display:grid;place-items:center;font:600 20px var(--sans);flex:none}
.who{min-width:0}.hi{font:600 20px/1.2 var(--sans)}.sb{font-size:13px;color:var(--hdm)}
.hero .bar{background:rgba(255,255,255,.14);height:8px;margin-top:16px}.hero .bar i{background:var(--hdac)}
.hero .pct{color:var(--hdm);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.stats div{text-align:left;padding-right:8px}
.stats div+div{padding-left:14px;border-left:1px solid rgba(255,255,255,.12)}
.stats b{display:block;font:500 22px var(--mono);color:var(--hdt);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--hdm)}
.pghead{padding:22px 0 8px}.pghead h1{font:600 26px/1.15 var(--sans);margin:0;text-wrap:balance}.pghead p{margin:6px 0 0;color:var(--mu);font-size:15px}
/* barra de abas */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--bd);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);font:500 11px var(--sans);padding:6px 2px;border-radius:10px;min-width:0;min-height:50px;cursor:pointer}
nav svg,.sheet svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button.on{color:var(--ac)}nav button.on span{font-weight:600}
.sheetw{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:640px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.sheet{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:6px;pointer-events:auto;box-shadow:0 10px 30px rgba(8,16,26,.22)}
.sheet button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:11px 10px;border-radius:12px;font:600 15px var(--sans);cursor:pointer}
.sheet button+button{border-top:1px solid var(--bd);border-radius:0}
.sheet button span.d{display:block;font:400 13px var(--sans);color:var(--mu)}
.sheet button.on{color:var(--ac)}
/* conteúdo */
h2{font:600 17px/1.3 var(--sans);margin:24px 0 10px}
.mu{color:var(--mu);font-size:14px;line-height:1.45}
.ph{font:500 12px var(--mono);color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.q{font:600 17px/1.35 var(--sans);text-wrap:pretty}
.a{margin-top:12px;padding:12px 14px;background:var(--sf2);border-radius:12px}.a p{margin:8px 0 0}.a p:first-child{margin-top:0}
.bar{display:block;height:8px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;border-radius:99px;transition:width .3s}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row .btn{min-width:130px}
.btn{flex:1;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:600 15px var(--sans);cursor:pointer;line-height:1.3}
.btn:active{transform:scale(.99)}
.btn.p{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.btn.g{background:var(--ok);color:var(--onok);border-color:var(--ok)}
.btn.r{background:var(--bad);color:var(--onbad);border-color:var(--bad)}
.btn:disabled:not(.g):not(.r){opacity:.6;cursor:default}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:16px/1.45 var(--sans);margin-top:8px}
textarea{min-height:120px;resize:vertical}#nb{min-height:340px}
input[type=checkbox]{accent-color:var(--ac)}
label.it{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
label.it input{width:22px;height:22px;flex:none;margin-top:1px}
label.it.d{background:var(--sf2)}label.it.d span{text-decoration:line-through;color:var(--mu)}
label.it.ck{border-color:var(--ac)}
.note{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:600 15px var(--sans);cursor:pointer}
.note.on{border-color:var(--ac);background:var(--acs)}
.tc{display:flex;gap:14px;align-items:center}
.tc .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--sf))}
.tc .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.tc .tx b{font-size:16px}.tc .mu{font-weight:400}
.tc .bar{height:6px;margin-top:8px}.tc .bar i{background:var(--c)}
.tc .ch{font-size:26px;color:var(--mu);line-height:1}
.sub{display:flex;gap:4px;margin:12px 0;padding:4px;background:var(--sf2);border-radius:12px;overflow-x:auto}
.sub button{flex:1 0 auto;min-height:40px;padding:8px 12px;border:0;background:none;color:var(--mu);border-radius:9px;font:600 14px var(--sans);cursor:pointer}
.sub button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(8,16,26,.15)}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:4px 16px 16px;line-height:1.55}
.st h3{font:600 16px/1.3 var(--sans);color:var(--ac);margin:22px 0 8px}
.st p{margin:8px 0}.st li{margin-bottom:5px}.st ul,.st ol{padding-left:22px;margin:8px 0}
.st table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:14px;margin:10px 0}
.st th{background:var(--sf2);text-align:left}.st td,.st th{border:1px solid var(--bd);padding:8px 10px;vertical-align:top}
.st details,details.card{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}.st summary,details.card summary{font-weight:600;cursor:pointer}
details.card{background:var(--sf);margin:0 0 8px}
pre.lg{background:var(--hd);color:#b8f2dd;border-radius:12px;padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--mono);white-space:pre-wrap;margin:10px 0}
.nd{position:absolute;top:48px;width:12%;text-align:center;font-size:12px;line-height:1.2}
.ft{text-align:center;color:var(--mu);font:12px var(--mono);margin-top:32px}.ft b{color:var(--ac);font-weight:500}
/* tela Hoje */
.sum{display:flex;gap:16px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:16px 0 4px}
.sn{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);flex:none}.sn b{font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}.sn span{color:var(--mu);font-size:14px}
.sx{flex:1;min-width:0}.sl{font-size:14px;font-weight:600;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:500 12px var(--mono);padding:4px 9px;border-radius:99px;background:var(--acs);color:var(--ac)}.chip.off{background:var(--sf2);color:var(--mu)}
.task{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px}
.th{display:flex;gap:12px;align-items:flex-start}
.ti{width:40px;height:40px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;font-size:20px;flex:none}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.tb b{font-weight:600;line-height:1.35}
.task input[type=checkbox]{width:26px;height:26px;flex:none;margin-top:6px}
.task.d{background:var(--sf2)}.task.d .tb b{color:var(--mu);text-decoration:line-through}.task.auto .tb b{text-decoration:none}
.task .btn,.task textarea{width:100%;margin-top:0}.task textarea{min-height:84px}.task .row{margin-top:0}
/* avisos */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(6,12,20,.55);display:grid;place-items:center;padding:16px}
.dbox{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:360px}.dbox p{margin:0 0 4px;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* Computador: menu à esquerda e conteúdo mais largo (o layout de celular continua igual) */
nav a.lab{display:none}
@media (min-width:1000px){
body{max-width:none;margin:0;padding:0 48px 48px calc(260px + 48px)}
.hero,.pghead,main,.ft{max-width:920px}
body::before{display:none}
nav{left:0;top:0;bottom:0;transform:none;width:260px;max-width:none;display:flex;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--bd);padding:20px 14px}
nav::before{content:"Mini SOC Lab";font:600 18px var(--sans);color:var(--tx);padding:4px 12px 16px}
nav button{flex-direction:row;justify-content:flex-start;gap:12px;font:500 15px var(--sans);min-height:44px;padding:10px 12px;width:100%}
nav button.on{background:var(--acs)}
nav a.lab{display:flex;gap:12px;align-items:center;margin-top:auto;padding:12px;border-radius:10px;background:var(--ac);color:var(--onac);font:600 15px var(--sans);text-decoration:none}
.sheetw{left:260px;transform:none;bottom:24px;width:360px;padding:0 12px}
.toast{left:calc(50% + 130px);bottom:24px}
}
/* >>> curso */
/* ===== Visual do curso (curso/visual.css, copiado para estudar.html por curso/montar.py) ===== */
:root{--sh:0 1px 2px rgba(8,16,26,.06),0 4px 14px rgba(8,16,26,.06);--sh2:0 2px 6px rgba(8,16,26,.08),0 12px 28px rgba(8,16,26,.1);--r:16px}
:root[data-theme="dark"],:root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 8px 24px rgba(0,0,0,.35)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--sh:0 1px 2px rgba(8,16,26,.06),0 4px 14px rgba(8,16,26,.06);--sh2:0 2px 6px rgba(8,16,26,.08),0 12px 28px rgba(8,16,26,.1)}}
body{background:radial-gradient(1200px 500px at 70% -10%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 70%) fixed,var(--bg)}
/* topo da tela Hoje */
.hero{background:linear-gradient(135deg,#0b1726 0%,#0e2a3a 55%,#0f4c4a 100%);border-radius:22px;padding:22px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.28),transparent 70%);pointer-events:none}
.hi{font-size:22px;letter-spacing:-.01em}
.av{border-radius:14px;box-shadow:0 0 0 3px rgba(45,212,191,.25)}
.hero .bar{height:10px}.hero .bar i{background:linear-gradient(90deg,#2dd4bf,#5eead4)}
.pghead h1{font-size:28px;letter-spacing:-.015em}
/* cartões e botões */
.card,.st,.sum,label.it,.note{border-radius:var(--r);box-shadow:var(--sh)}
.card,.st,.sum{border-color:color-mix(in srgb,var(--bd) 70%,transparent)}
.note{transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.note:hover{transform:translateY(-1px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--c,var(--ac)) 45%,var(--bd))}
.btn{border-radius:12px;transition:filter .15s,transform .1s,box-shadow .15s}
.btn.p{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 75%,#0ea5e9));border:0;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn.p:hover{filter:brightness(1.07)}
.btn:hover:not(.p):not(:disabled){border-color:var(--ac)}
.bar i{background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#38bdf8))}
h2{letter-spacing:-.01em}
/* texto de estudo */
.st{padding:8px 22px 22px;font-size:16px;line-height:1.65}
.st h3{display:flex;align-items:center;gap:10px;font-size:17px;margin:26px 0 8px}
.st h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--ac);flex:none}
.st code{font:13.5px var(--mono);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;word-break:break-word}
.st pre{background:#0b1726;color:#c7f9ec;border-radius:12px;padding:14px 16px;overflow-x:auto;font:13.5px/1.6 var(--mono);margin:12px 0;box-shadow:inset 0 0 0 1px rgba(45,212,191,.15)}
.st table{border-radius:10px}
.st th{background:color-mix(in srgb,var(--ac) 12%,var(--sf))}
.st tr:nth-child(even) td{background:color-mix(in srgb,var(--sf2) 55%,transparent)}
.st p i{color:color-mix(in srgb,var(--tx) 80%,var(--ac))}
/* Hoje: continue de onde parou */
.cont{position:relative;margin:18px 0 6px;padding:20px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--sf)),var(--sf) 60%);border:1px solid color-mix(in srgb,var(--c) 40%,var(--bd));box-shadow:var(--sh2)}
.cont .k,.trtop .k{display:inline-block;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ac);background:var(--acs);padding:4px 10px;border-radius:99px}
.cont .ct{display:flex;gap:14px;align-items:center;margin-top:12px}
.cont .ct .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 22%,var(--sf));flex:none}
.cont .ct b{display:block;font:600 21px/1.2 var(--sans);letter-spacing:-.01em}
.cont .cs{margin:14px 0 8px;font-size:15px}
.cont .btn{width:100%;margin-top:14px;min-height:52px;font-size:16px}
.cont .cf{display:block;text-align:center;margin-top:10px;font-size:13px}
/* trilha */
.trtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--sf);border-radius:20px;padding:18px;box-shadow:var(--sh2);margin:8px 0 18px;border:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
.trtop .trk{flex:1 1 240px;display:flex;flex-direction:column;gap:8px}
.trtop .trk b{font:600 18px var(--sans)}
.trtop .btn{flex:1 1 220px;min-height:50px}
.mod{position:relative;margin:0 0 22px;padding:16px 16px 6px;border-radius:20px;background:color-mix(in srgb,var(--c) 6%,var(--sf));border:1px solid color-mix(in srgb,var(--c) 22%,var(--bd))}
.mh{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.mn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:600 18px var(--mono);color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#0b1726));flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}
.mod.mdone .mn{background:linear-gradient(135deg,#16a34a,#15803d)}
.mt{flex:1;min-width:0}.mt h3{margin:2px 0 2px;font:600 18px/1.25 var(--sans);letter-spacing:-.01em}.mt .mu{margin:0}
.mc{font:600 13px var(--mono);color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;flex:none}
.trow .num{font:500 12px var(--mono);color:var(--mu);margin-right:2px}
.trow.done{background:color-mix(in srgb,#16a34a 7%,var(--sf))}
.trow.done .ic{background:color-mix(in srgb,#16a34a 18%,var(--sf))}
.dots{display:flex;gap:4px;flex:none}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--sf2);filter:grayscale(1);opacity:.45}
.dot.ok{filter:none;opacity:1;background:color-mix(in srgb,#16a34a 18%,var(--sf))}
@media(max-width:520px){.dots{display:none}}
/* tópico: cabeçalho e passos */
.bk{width:auto!important;flex:none;min-height:40px;padding:8px 14px;margin-top:10px}
.thd{display:flex;gap:14px;align-items:center;margin:16px 0 4px}
.thd .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 20%,var(--sf));box-shadow:var(--sh);flex:none}
.thd .tt{flex:1;min-width:0}.thd h2{margin:2px 0 0;font-size:24px;line-height:1.2}
.thd .tp{font:600 15px var(--mono);color:var(--ac);background:var(--acs);border-radius:99px;padding:6px 12px;flex:none}
.steps{display:flex;gap:6px;margin:16px 0;padding:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow-x:auto;position:sticky;top:8px;z-index:5}
.steps button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 12px;border:0;background:none;color:var(--mu);border-radius:11px;font:600 14px var(--sans);cursor:pointer;transition:background .15s,color .15s}

<script>
const P=[];
const Q=[
["O que acontece quando você abre um site?","O navegador pergunta ao DNS o IP do domínio, faz o handshake TCP, negocia TLS (HTTPS), envia a requisição HTTP e o servidor responde."],
["Qual serviço usa a porta 22?","SSH (acesso remoto seguro)."],
["Qual serviço usa a porta 53?","DNS."],
["Quais portas usam HTTP e HTTPS?","80 (HTTP) e 443 (HTTPS)."],
["Qual serviço usa a porta 3389?","RDP (Área de Trabalho Remota do Windows)."],
["Qual a diferença entre TCP e UDP?","TCP é confiável, com conexão e confirmação de entrega. UDP é mais rápido, sem conexão e sem garantia."],
["O que faz o DHCP?","Entrega automaticamente IP, máscara, gateway e DNS aos dispositivos da rede."],
["Quais as 7 camadas do modelo OSI?","Física, Enlace, Rede, Transporte, Sessão, Apresentação, Aplicação."],
["O que é phishing?","Ataque que engana a pessoa (e-mail, SMS, site falso) para roubar dados ou fazê-la executar algo malicioso."],
["O que é malware?","Software criado para causar dano ou obter acesso indevido: vírus, ransomware, trojan, spyware."],
["Diferença entre vulnerabilidade, ameaça e risco?","Vulnerabilidade é a falha. Ameaça é quem ou o que pode explorá-la. Risco é a chance de isso acontecer vezes o impacto."],
["O que é um SIEM?","Plataforma que coleta e correlaciona logs de vários sistemas para detectar e investigar incidentes (ex.: Splunk, Elastic)."],
["O que é o MITRE ATT&CK?","Base de conhecimento com táticas e técnicas usadas por atacantes, útil para classificar e detectar ataques."],
["O que é a Cyber Kill Chain?","Modelo das etapas de um ataque: reconhecimento, armamento, entrega, exploração, instalação, comando e controle, ações finais."],
["O que é um IoC?","Indicador de comprometimento: IP, hash, domínio ou comportamento que sugere que um ataque ocorreu."],
["O que é um falso positivo?","Alerta disparado para algo que na verdade é legítimo. O analista de SOC precisa triar e descartar."],
["Nuvem: qual a diferença entre pública, privada e híbrida?","Pública: infraestrutura de um provedor (AWS, Azure, Google) compartilhada com outros clientes. Privada: usada por uma só organização. Híbrida: mistura das duas."],
["Nuvem: IaaS, PaaS e SaaS, o que você gerencia em cada?","IaaS: você gerencia sistema, apps e dados (ex.: máquina virtual na AWS). PaaS: você gerencia só app e dados. SaaS: você só usa o software (ex.: Gmail)."],

["1. IP — o endereço de casa","Todo dispositivo numa rede tem um número único, tipo 192.168.0.1. É o endereço de casa dele.\n\nIP público = o endereço da casa visto da rua (o mundo vê). IP privado = número do apartamento dentro do prédio (só a rede local vê).\n\nPra lembrar: IP = CEP do computador."],
["2. TCP vs UDP","Imagina mandar uma carta grande cortada em pedaços numerados.\n\nTCP (confiável): o carteiro confirma cada pedaço entregue, reenvia o que falta. Mais lento, garante que nada se perca. Usado em sites, e-mail, arquivos.\n\nUDP (rápido, sem garantia): manda tudo de uma vez, sem confirmar. Usado em vídeo chamada, jogos online.\n\nPra lembrar: TCP = Sedex com rastreio. UDP = carta simples, mais rápida, sem garantia."],
["3. Portas — qual porta da casa","O IP leva até a casa certa. As portas dizem qual serviço você quer falar com ela.\n\nPorta 80 = HTTP. Porta 443 = HTTPS (cadeado). Porta 22 = SSH (acesso remoto). Porta 53 = DNS.\n\nPra lembrar: IP é o endereço da casa, porta é qual porta você bateu."],

"A OU é como uma pasta para organizar usuários e computadores, por exemplo Financeiro ou Vendas. Nela se aplicam as GPOs. O grupo é uma lista de pessoas que recebe permissões, por exemplo acesso a uma pasta de rede. Regra de bolso: OU organiza, grupo dá acesso.",

"Com a GPO o TI define regras uma vez e elas chegam a todos os computadores ou usuários de uma OU: política de senha, bloquear USB, papel de parede, mapear unidade de rede, instalar impressoras. Edita-se no Group Policy Management (gpmc.msc).",
"Os PCs buscam GPOs novas a cada algum tempo (cerca de 90 minutos), então pode demorar. O gpupdate /force pede a atualização na hora. Depois, o gpresult /r mostra quais GPOs estão aplicadas e quais foram negadas, ótimo para investigar.",
"O bloqueio (lockout) é uma proteção: após X tentativas erradas, a conta trava por um tempo. Primeiro confirme a identidade de quem pede. Depois, no ADUC, aba Account, marque Unlock account. Mas pergunte o que causou: o celular com senha antiga tentando entrar sozinho é a causa mais comum.",
"Bloqueada (locked out): muitas tentativas erradas, resolve com Unlock. Desativada (disabled): alguém desligou a conta de propósito, por exemplo na saída de um funcionário. Só reative se for legítimo. Expirada: a senha passou do prazo da política e o usuário precisa criar uma nova.",

"Com MFA a pessoa precisa de algo que sabe (senha) mais algo que tem (celular com o app Microsoft Authenticator) ou é (biometria). Se um golpista descobrir a senha em um phishing, ainda não consegue entrar. Troca de celular é chamado comum: o TI precisa registrar o novo método depois de confirmar a identidade.",

{id:"redes",n:"Redes",ic:"🌐",guide:1,tags:["Redes","Portas","HTTP","OSI"],chk:["Explicar o que acontece ao abrir um site","Explicar IP, MAC, DNS e DHCP","Explicar TCP e UDP","Dizer as 7 camadas do OSI","Decorar a tabela de portas","Explicar HTTP, HTTPS e os códigos","Acertar 8 de 10 no quiz de Redes"],st:`<h3>A ideia central</h3><p>Rede é um grupo de aparelhos conversando. Cada um precisa de um endereço (IP), uma porta (qual serviço) e regras (protocolos).</p><h3>O que acontece ao abrir um site</h3><ol><li>Você digita o nome. O <b>DNS</b> descobre o IP (agenda de contatos).</li><li>O <b>TCP</b> abre a conexão: SYN, SYN-ACK, ACK.</li><li>O <b>TLS</b> protege a conversa (HTTPS).</li><li>O navegador pede a página (<b>HTTP GET</b>).</li><li>O servidor responde e a página aparece.</li></ol><h3>IP: o endereço</h3><p>Todo aparelho em uma rede recebe um número chamado IP (ex.: 192.168.0.25). É como o endereço da sua casa: serve para os outros saberem onde entregar. Ele muda quando você troca de rede (casa, trabalho, café). IPs que começam com 192.168 são privados, usados dentro de casa. O IP que o mundo vê é o do seu roteador.</p><h3>MAC: a identidade do aparelho</h3><p>É um código gravado na placa de rede (ex.: A4:5E:60:C1:22:9B). Dentro da rede local (casa, escritório), os aparelhos se encontram pelo MAC. Resumo: IP = onde você está agora. MAC = quem você é.</p><h3>DNS: a agenda de contatos</h3><p>Pessoas lembram nomes (youtube.com), computadores usam números (IP). O DNS traduz o nome em IP. Seu aparelho pergunta ao servidor DNS “qual o IP de youtube.com?”, recebe a resposta e só então se conecta. Usa a porta 53. Sem DNS a internet parece fora do ar, mesmo com a conexão funcionando.</p><h3>DHCP: o recepcionista</h3><p>Ao conectar o celular no Wi-Fi, você não digita nada: o DHCP entrega sozinho o IP, a máscara e o gateway (a saída para a internet, normalmente o roteador). Sem DHCP, você teria que configurar tudo à mão.</p><h3>Porta: o cômodo certo</h3><p>O IP leva até o aparelho. A porta leva ao serviço certo dentro dele. Exemplo: o servidor tem um IP, e a porta 443 atende sites seguros enquanto a 22 atende acesso remoto.</p><h3>TCP e UDP em detalhe</h3><p>Os dados viajam em pedacinhos (pacotes). O <b>TCP</b> abre uma conexão, numera os pedacinhos, confirma o recebimento e reenvia o que se perdeu. É usado quando nada pode faltar: sites, e-mail, download. O <b>UDP</b> só envia, sem confirmar. É mais rápido e leve, usado em chamadas de vídeo, jogos e transmissão ao vivo, onde perder um pedaço quase não importa. O handshake do TCP tem 3 passos: SYN (“quero conversar”), SYN-ACK (“ok, eu também”) e ACK (“combinado”).</p><h3>OSI: 7 camadas em detalhe</h3><p>É um modelo para organizar quem faz o quê numa comunicação. Frase para decorar, de baixo para cima: Please Do Not Throw Sausage Pizza Away.</p><table><tr><th>#</th><th>Camada</th><th>O que faz</th><th>Exemplo</th></tr><tr><td>1</td><td>Física</td><td>cabos e sinais</td><td>cabo, Wi-Fi</td></tr><tr><td>2</td><td>Enlace</td><td>entrega na rede local (MAC)</td><td>switch</td></tr><tr><td>3</td><td>Rede</td><td>endereços e rotas (IP)</td><td>roteador</td></tr><tr><td>4</td><td>Transporte</td><td>como entregar (portas)</td><td>TCP, UDP</td></tr><tr><td>5</td><td>Sessão</td><td>abre e fecha conversas</td><td>sessão de login</td></tr><tr><td>6</td><td>Apresentação</td><td>formato e criptografia</td><td>TLS</td></tr><tr><td>7</td><td>Aplicação</td><td>o serviço que você usa</td><td>HTTP, DNS, e-mail</td></tr></table><p>Dica: diante de um problema, comece de baixo. O cabo está conectado (1)? Tem IP (3)? O site responde (7)?</p><h3>HTTP e HTTPS em detalhe</h3><p>HTTP é a língua entre o navegador e o site. O navegador faz um pedido (<b>GET</b> pede uma página, <b>POST</b> envia dados, como uma senha) e o servidor devolve uma resposta com um código. HTTPS é o HTTP dentro de uma conexão criptografada (TLS): quem estiver no meio do caminho não consegue ler. Códigos: <b>2xx</b> sucesso (200 OK); <b>3xx</b> redirecionamento (301 movido); <b>4xx</b> erro do cliente (403 proibido, 404 não encontrado); <b>5xx</b> erro do servidor (500).</p><h3>Roteador, switch e firewall</h3><p>O <b>switch</b> liga aparelhos da mesma rede (o corredor entre os apartamentos). O <b>roteador</b> liga redes diferentes, como a sua casa e a internet (a portaria do prédio). O <b>firewall</b> é o porteiro: decide o que passa, seguindo regras (ex.: bloquear a porta 23).</p><h3>Resumo rápido das peças</h3><ul><li><b>IP:</b> endereço da casa. Muda conforme a rede.</li><li><b>MAC:</b> número de série da placa de rede.</li><li><b>DHCP:</b> entrega o IP sozinho (recepcionista).</li><li><b>Porta:</b> o cômodo da casa, diz qual serviço atende.</li><li><b>Roteador:</b> liga redes diferentes. <b>Switch:</b> liga aparelhos da mesma rede.</li><li><b>Firewall:</b> porteiro que libera ou bloqueia por regras.</li></ul><h3>TCP e UDP</h3><ul><li><b>TCP</b> = carta registrada: confirma a entrega (sites, e-mail).</li><li><b>UDP</b> = panfleto: mais rápido, sem garantia (chamadas, vídeo ao vivo).</li></ul><h3>Modelo OSI</h3><p>Please Do Not Throw Sausage Pizza Away: Physical, Data link, Network, Transport, Session, Presentation, Application. IP é camada 3. TCP e UDP são camada 4. HTTP e DNS são camada 7. O TCP/IP resume tudo em 4 camadas.</p><h3>Portas para decorar</h3><table><tr><th>Porta</th><th>Serviço</th><th>Para lembrar</th></tr><tr><td>21</td><td>FTP</td><td>enviar arquivos</td></tr><tr><td>22</td><td>SSH</td><td>terminal remoto seguro (dois 2, dois S)</td></tr><tr><td>23</td><td>Telnet</td><td>terminal remoto inseguro</td></tr><tr><td>25</td><td>SMTP</td><td>enviar e-mail</td></tr><tr><td>53</td><td>DNS</td><td>nome vira IP</td></tr><tr><td>80</td><td>HTTP</td><td>site sem cadeado</td></tr><tr><td>443</td><td>HTTPS</td><td>site com cadeado</td></tr><tr><td>445</td><td>SMB</td><td>arquivos no Windows, alvo de ransomware</td></tr><tr><td>3389</td><td>RDP</td><td>área de trabalho remota do Windows</td></tr></table><h3>HTTP</h3><p>HTTP é o cartão-postal (todos leem). HTTPS é a carta lacrada. GET pede uma página; POST envia dados (ex.: login). Códigos: 200 OK, 301 movido, 403 proibido, 404 não encontrado, 500 erro no servidor.</p><h3>No dia a dia de um SOC</h3><ul><li>Muitas tentativas nas portas 22 ou 3389 vindas de fora podem ser tentativa de invasão.</li><li>DNS para domínios estranhos pode indicar máquina infectada.</li><li>Telnet ou HTTP sem criptografia merecem atenção.</li><li>Os logs do firewall mostram quem tentou entrar.</li></ul><h3>Lendo um log</h3><p><b>[14:32:07] SRC=203.0.113.44 DST=192.168.0.1 PORT=443 PROTO=TCP ACTION=ALLOWED</b></p><p>Tradução: o IP externo 203.0.113.44 enviou uma conexão TCP para a porta 443 (HTTPS) do roteador, e o firewall permitiu. Perguntas do analista: esse IP é conhecido? Isso é normal para esse servidor? Houve muitas tentativas?</p><h3>Para completar</h3><ul><li><b>IPs privados:</b> além de 192.168.x.x, também são privados 10.x.x.x e 172.16 a 172.31. O roteador usa NAT para que vários aparelhos dividam um único IP público.</li><li><b>MAC não é prova de identidade:</b> ele pode ser falsificado (spoofing) e muitos celulares usam um MAC aleatório em cada rede. Por isso o analista não confia só no MAC.</li><li><b>DHCP</b> entrega também o DNS, e o IP é emprestado por um tempo (lease).</li><li><b>DNS</b> usa normalmente UDP na porta 53. Respostas grandes usam TCP.</li><li><b>Portas</b> vão de 0 a 65535. As de 0 a 1023 são as mais conhecidas (80, 443, 22).</li><li><b>401 x 403:</b> 401 = você precisa se identificar. 403 = identificado, mas sem permissão.</li><li><b>OSI e TLS:</b> o TLS não encaixa perfeitamente numa camada. Em entrevista, diga que ele protege a conversa entre o HTTP e o TCP.</li></ul><h3>Não confunda</h3><table><tr><th>Dúvida</th><th>Resposta curta</th></tr><tr><td>IP x MAC</td><td>IP: onde estou agora (muda). MAC: número de série da placa.</td></tr><tr><td>DNS x DHCP</td><td>DNS traduz nome em IP. DHCP entrega o IP ao aparelho.</td></tr><tr><td>Switch x roteador</td><td>Switch: dentro da mesma rede. Roteador: entre redes.</td></tr><tr><td>TCP x UDP</td><td>TCP confirma a entrega. UDP só envia, mais rápido.</td></tr><tr><td>HTTP x HTTPS</td><td>HTTPS é HTTP criptografado com TLS.</td></tr></table><h3>Como explicar numa entrevista</h3><p class="mu">Fale em voz alta, em inglês, com as suas palavras. Estes modelos são só um guia.</p><p><b>What is DNS?</b><br><i>DNS translates names like google.com into IP addresses, so people do not have to remember numbers. If DNS fails, the internet looks down even though the connection works.</i></p><p><b>What is the difference between DNS and DHCP?</b><br><i>DHCP gives a device its IP address automatically when it joins the network. DNS translates names into IP addresses.</i></p><p><b>What is the difference between a switch and a router?</b><br><i>A switch connects devices inside the same network. A router connects different networks, for example a home network and the internet.</i></p>`},
{id:"offsec",n:"Offensive Security",ic:"⚔️",tags:["Ofensiva"],chk:["Explicar o que é segurança ofensiva e para que serve", "Diferenciar hacker ético, black hat e grey hat", "Explicar por que é preciso autorização por escrito", "Descrever as fases de um teste de invasão", "Explicar o exemplo do site de banco falso (página escondida)", "Diferenciar vulnerabilidade, ameaça, risco e exploit", "Acertar 8 de 10 no quiz de Offensive Security"],st:`<p class="mu">Segurança ofensiva é <b>pensar e agir como o atacante</b>, mas com permissão, para achar as falhas antes que um criminoso ache.</p>
<h3>A ideia central</h3><ul><li>A equipe ofensiva ataca os sistemas da própria empresa (ou de um cliente) de forma <b>autorizada e controlada</b>.</li><li>O objetivo é descobrir falhas, provar o impacto e <b>ajudar a corrigir</b>.</li><li>Um profissional dessa área é chamado de <b>hacker ético</b> ou pentester.</li></ul>
<h3>Os "chapéus" dos hackers</h3><table><tr><th>Tipo</th><th>Quem é</th></tr><tr><td><b>White hat</b> (hacker ético)</td><td>Ataca com autorização para melhorar a segurança</td></tr><tr><td><b>Black hat</b></td><td>Ataca sem autorização, por dinheiro ou dano. É crime</td></tr><tr><td><b>Grey hat</b></td><td>Invade sem permissão, mas sem má intenção. Continua sendo ilegal</td></tr></table>
<h3>Autorização é tudo</h3><p>Antes de qualquer teste existe um <b>contrato por escrito</b> dizendo o que pode ser testado (escopo), quando e como. Sem isso, o teste é invasão e é crime, mesmo que a intenção seja boa.</p>
<h3>Fases de um teste de invasão (pentest)</h3><ol><li><b>Reconhecimento:</b> juntar informações sobre o alvo.</li><li><b>Varredura e enumeração:</b> descobrir portas abertas, serviços, pastas e páginas.</li><li><b>Exploração:</b> usar uma falha para entrar ou executar ações.</li><li><b>Pós-exploração:</b> ver até onde o acesso chega.</li><li><b>Relatório:</b> explicar o que achou, o risco e como corrigir. É a parte que o cliente mais valoriza.</li></ol>
<h3>Exemplo 1: Sarah e Mike</h3><p>Duas pessoas trabalham no mesmo banco:</p><ul><li><b>Sarah</b> tenta entrar no site do banco com senhas comuns, em uma conta de teste, para ver se o site aceita senhas fracas. Isso é <b>ofensiva</b>: ela age como um atacante para achar a falha.</li><li><b>Mike</b> cria uma regra de firewall que bloqueia tentativas de login suspeitas. Isso é <b>defensiva</b>: ele protege e impede.</li></ul>
<h3>Exemplo 2: o banco falso (FakeBank)</h3><p>Um exercício clássico de quem começa: atacar, de forma legal e segura, um site de banco fictício. Os passos:</p><ol><li><b>Conhecer o alvo:</b> o FakeBank mostra a conta da Mrs G. Benjamin, número <b>8881</b>.</li><li><b>Achar páginas escondidas:</b> hackers procuram <b>páginas que não têm link</b> no site, porque podem levar a ferramentas internas que a empresa não queria mostrar. A ferramenta usada foi o <b>dirb</b>, no terminal: ela testa palavras comuns como login e admin. Exemplo: dirb http://fakebank.thm</li><li><b>Resultado:</b> o dirb achou duas páginas, e a que dava acesso às ferramentas internas era <b>/bank-transfer</b>.</li><li><b>Atacar a página de admin:</b> ao digitar o endereço com /bank-transfer no navegador, abriu um painel escondido que permitia <b>depositar dinheiro</b> na conta 8881. Ao depositar pelo menos 2.000, o saldo ficou positivo e apareceu a mensagem em verde que confirmou o ataque (BANK-HACKED).</li></ol>
<p><b>Lição:</b> uma página escondida não é uma página protegida. A defesa mais eficaz para essa página é <b>exigir login</b>. Deixar a URL mais difícil de adivinhar ou mudar a página de servidor não resolve, porque quem achar o endereço ainda entra.</p>
<h3>Palavras que se confundem</h3><table><tr><th>Termo</th><th>Significado</th></tr><tr><td>Vulnerabilidade</td><td>A falha (porta destrancada)</td></tr><tr><td>Ameaça</td><td>Quem ou o que pode explorar a falha (ladrão)</td></tr><tr><td>Exploit</td><td>O método ou programa que usa a falha (a chave falsa)</td></tr><tr><td>Risco</td><td>A chance de acontecer e o tamanho do estrago</td></tr></table>
<h3>Ofensiva, red team e vulnerability scan</h3><ul><li><b>Vulnerability scan:</b> programa automático que lista falhas conhecidas. Rápido, mas não prova nada.</li><li><b>Pentest:</b> uma pessoa tenta realmente explorar as falhas e mostra o impacto.</li><li><b>Red team:</b> simula um atacante real por semanas, de forma discreta, testando também a equipe de defesa.</li></ul>
<h3>No dia a dia de um SOC</h3><p>Quem trabalha na defesa precisa entender o ataque. Saber como o atacante pensa (reconhecer, explorar, subir de nível) ajuda a identificar o que aparece nos logs. Muitas tentativas em páginas que não existem (erro 404) podem ser alguém fazendo enumeração.</p>
<h3>Como explicar numa entrevista</h3><p>"Segurança ofensiva é simular um ataque de forma autorizada para achar falhas antes dos criminosos. Segue fases (reconhecimento, enumeração, exploração e relatório) e sempre exige autorização por escrito. Eu atuo do lado defensivo, mas entender a ofensiva me ajuda a reconhecer sinais de ataque."</p>`},
{id:"defsec",n:"Defensive Security",ic:"🛡️",tags:["Defensiva"],chk:["Explicar o que é segurança defensiva e o blue team", "Dizer as 3 tarefas: prevenir, detectar e responder", "Explicar o que faz um SOC", "Explicar Threat Intelligence, DFIR e análise de malware", "Explicar o que é um SIEM", "Comparar segurança ofensiva e defensiva", "Acertar 8 de 10 no quiz de Defensive Security", "Descrever as 4 fases do exercício do FakeBank (alerta, parar, investigar, relatório)"],st:`<p class="mu">Segurança defensiva é <b>proteger, vigiar e reagir</b>. É o trabalho do <b>blue team</b>, a equipe de defesa.</p>
<h3>As 3 tarefas da defesa</h3><table><tr><th>Tarefa</th><th>O que é</th><th>Exemplo</th></tr><tr><td><b>Prevenir</b></td><td>Evitar que o ataque aconteça</td><td>Atualizações, senhas fortes, firewall, MFA</td></tr><tr><td><b>Detectar</b></td><td>Perceber que algo estranho está acontecendo</td><td>Alertas de SIEM e monitoramento</td></tr><tr><td><b>Responder</b></td><td>Conter o problema e se recuperar</td><td>Bloquear um IP, isolar um computador</td></tr></table>
<h3>As áreas da defesa</h3><ul><li><b>SOC (Security Operations Center):</b> equipe que monitora alertas 24 horas por dia, investiga e responde.</li><li><b>Threat Intelligence (inteligência de ameaças):</b> estudar quem ataca, com quais técnicas, e quais IPs e domínios são perigosos.</li><li><b>DFIR (Digital Forensics and Incident Response):</b> investigar o que aconteceu depois de um ataque, preservando provas, e conduzir a resposta.</li><li><b>Malware Analysis:</b> analisar um programa malicioso para entender o que ele faz e como detectá-lo.</li><li><b>SIEM:</b> sistema que reúne logs de vários lugares e gera alertas quando vê um padrão suspeito.</li></ul>
<h3>Na prática: um ataque no SOC de um banco (FakeBank)</h3><p>Imagine que você trabalha no SOC de um banco fictício. Um ataque passa por 4 fases:</p><ol><li><b>Um ataque começa:</b> o painel de monitoramento (dashboard) mostra a atividade dos aparelhos e da rede. Chegou um alerta de <b>"Suspicious Login"</b>: centenas de tentativas de login em uma conta, a <b>dave.saunders</b>.</li><li><b>Parar o ataque:</b> o atacante testa senhas aleatórias até acertar, o que se chama <b>força bruta</b>. Para impedir, você <b>desativou a conta</b> na página de gerenciamento de contas, antes de o atacante acertar a senha. Quanto mais cedo se para o ataque, menor o dano.</li><li><b>Investigar o atacante:</b> o painel indicou que podia ser o grupo <b>ShadowFigures</b>, que ataca bancos. Em defesa se <b>compartilham informações sobre atacantes</b>. Isso é <b>threat intelligence</b>. Você atualizou o relatório de inteligência com o que o grupo tentou: a página e o usuário.</li><li><b>Enviar o relatório:</b> você criou um <b>relatório de incidente</b>, que resume o que aconteceu e serve também como aprendizado para a equipe.</li></ol>
<p><b>Atenção, pegadinha comum:</b> ao detectar uma invasão em andamento, a primeira prioridade é eliminar a ameaça na hora? <b>Não</b>. Primeiro se <b>confirma</b> que o ataque é real e se entende o que está acontecendo. Depois se age para parar. Atacantes inteligentes mudam o comportamento quando percebem que foram descobertos.</p>
<h3>Ofensiva x defensiva</h3><table><tr><th></th><th>Ofensiva (red team)</th><th>Defensiva (blue team)</th></tr><tr><td>Objetivo</td><td>Achar falhas atacando</td><td>Proteger, detectar e responder</td></tr><tr><td>Pergunta</td><td>"Como eu entro?"</td><td>"Como eu percebo e impeço?"</td></tr></table><p>Quando as duas equipes trabalham juntas se fala em <b>purple team</b>.</p>
<h3>No dia a dia de um SOC</h3><p>O analista recebe um alerta, confere se é um falso ou verdadeiro positivo, investiga nos logs, escala se for grave e documenta tudo. O que você viu aqui (SIEM, threat intelligence, DFIR) são as ferramentas e áreas desse trabalho.</p>
<h3>Como explicar numa entrevista</h3><p>"Segurança defensiva é proteger os sistemas, detectar atividades suspeitas e responder a incidentes. Em um SOC usamos um SIEM para reunir logs e gerar alertas, e a inteligência de ameaças para saber quais IPs e técnicas são perigosos."</p>`},
{id:"careers",n:"Carreiras em Cyber",ic:"💼",tags:["Carreiras"],chk:["Citar 4 carreiras da área de cibersegurança", "Explicar o que faz um analista de segurança (SOC)", "Diferenciar pentester e red teamer", "Explicar o papel do respondedor de incidentes e do perito forense", "Explicar o que é GRC", "Dizer qual carreira é o seu caminho e por quê", "Acertar 8 de 10 no quiz de Carreiras em Cyber"],st:`<p class="mu">Cibersegurança tem muitos caminhos. Escolher bem começa por saber o que cada profissional faz no dia a dia.</p>
<h3>Lado defensivo (blue team)</h3><table><tr><th>Carreira</th><th>O que faz</th></tr><tr><td><b>Analista de segurança / analista de SOC</b></td><td>Monitora alertas, investiga, classifica e escala. É a porta de entrada mais comum</td></tr><tr><td><b>Engenheiro de segurança</b></td><td>Constrói e configura as defesas (firewall, SIEM, EDR)</td></tr><tr><td><b>Respondedor de incidentes</b></td><td>Entra em ação durante um ataque para conter e recuperar</td></tr><tr><td><b>Perito forense digital</b></td><td>Investiga o que aconteceu e preserva as provas</td></tr><tr><td><b>Analista de malware</b></td><td>Analisa programas maliciosos para entender e detectar</td></tr><tr><td><b>Analista de threat intelligence</b></td><td>Estuda os atacantes e suas técnicas</td></tr></table>
<h3>Lado ofensivo (red team)</h3><table><tr><th>Carreira</th><th>O que faz</th></tr><tr><td><b>Pentester</b></td><td>Testa sistemas e aplicações procurando falhas, com autorização</td></tr><tr><td><b>Red teamer</b></td><td>Simula um atacante real de forma discreta e prolongada</td></tr></table>
<h3>Outras áreas</h3><ul><li><b>GRC (Governança, Risco e Conformidade):</b> políticas, auditorias e normas (como ISO 27001). Menos técnico.</li><li><b>Segurança em nuvem, de aplicações e de redes:</b> especializações.</li></ul>
<h3>Caminho típico de quem começa</h3><ol><li>Suporte de TI ou help desk (você já tem essa base).</li><li>Analista de SOC nível 1.</li><li>Nível 2 ou 3, ou uma especialização (forense, malware, threat hunting, engenharia).</li></ol>
<h3>No dia a dia de um SOC</h3><p>O analista de SOC nível 1 lê alertas, descarta os falsos positivos, abre chamados e escala os graves. Boas qualidades: curiosidade, atenção aos detalhes, calma sob pressão e comunicação clara por escrito.</p>
<h3>Como explicar numa entrevista</h3><p><b>Why do you want to work in a SOC?</b><br><i>I enjoy investigating and solving problems, and a SOC protects people and data every day. I am building hands-on skills with log analysis, SIEM queries and phishing analysis in a home lab, and I want to grow into incident response.</i></p>`},
{id:"insidepc",n:"Dentro do Computador",ic:"🖥️",tags:["Computador"],chk:["Explicar CPU, RAM e armazenamento com uma analogia", "Diferenciar memória volátil e não volátil", "Diferenciar HDD e SSD", "Explicar o papel da placa-mãe e da placa de rede", "Explicar o UEFI (antigo BIOS) e as 5 etapas do boot", "Dizer por que isso importa para segurança", "Acertar 8 de 10 no quiz de Dentro do Computador"],st:`<p class="mu">Antes de proteger um computador, é preciso saber do que ele é feito. Pense num castelo: não dá para defender um castelo que você nunca viu. Aqui o computador é comparado ao <b>corpo humano</b>, com cada peça fazendo um papel.</p>
<h3>As peças principais</h3><table><tr><th>Peça</th><th>Função</th><th>No corpo humano</th></tr><tr><td><b>CPU</b> (processador)</td><td>Executa as instruções. É o cérebro</td><td>O cérebro</td></tr><tr><td><b>RAM</b> (memória)</td><td>Guarda o que está em uso agora. Rápida, mas <b>apaga ao desligar</b></td><td>Memória de curto prazo</td></tr><tr><td><b>Armazenamento</b> (HDD e SSD)</td><td>Guarda arquivos de forma permanente</td><td>Memória de longo prazo</td></tr><tr><td><b>Placa-mãe (motherboard)</b></td><td>Conecta todas as peças</td><td>Esqueleto e nervos</td></tr><tr><td><b>Fonte de energia (PSU)</b></td><td>Alimenta tudo</td><td>Coração e pulmões</td></tr><tr><td><b>GPU</b></td><td>Cuida de imagens e vídeo</td><td>Córtex visual</td></tr><tr><td><b>Placa de rede (NIC)</b></td><td>Conecta à rede. Tem o endereço MAC</td><td>A porta de entrada (analogia minha)</td></tr></table>
<h3>Volátil e não volátil</h3><ul><li><b>Volátil:</b> perde o conteúdo quando falta energia. Exemplo: RAM.</li><li><b>Não volátil:</b> guarda sem energia. Exemplo: SSD, HDD, pendrive.</li></ul>
<h3>HDD e SSD</h3><table><tr><th></th><th>HDD</th><th>SSD</th></tr><tr><td>Como funciona</td><td>Disco giratório com cabeça de leitura</td><td>Chips, sem partes móveis</td></tr><tr><td>Velocidade</td><td>Mais lento</td><td>Bem mais rápido</td></tr><tr><td>Preço por espaço</td><td>Mais barato</td><td>Mais caro</td></tr></table>
<h3>O que a CPU faz</h3><ul><li>Vem com vários <b>núcleos (cores)</b>, cada um executa tarefas.</li><li>A velocidade é medida em <b>GHz</b>.</li><li>Quanto mais RAM, mais programas abertos ao mesmo tempo sem ficar lento.</li></ul>
<h3>O que acontece ao apertar o botão (boot)</h3><p>É como acordar de manhã: o corpo liga, você confere se está tudo bem e só então levanta. São 5 passos:</p><ol><li><b>Apertar o botão:</b> um sinal vai para a fonte (PSU), e a energia começa a fluir.</li><li><b>O firmware inicia:</b> é o <b>UEFI</b>, o sistema na placa-mãe que liga e coordena as peças. Você verá muito o nome <b>BIOS</b>: faz o mesmo papel, mas foi <b>substituído pelo UEFI</b> na maioria dos computadores.</li><li><b>POST (Power-On Self Test):</b> o teste de que tudo que é necessário está presente, configurado e funcionando. Se algo estiver errado, há sinais de alarme.</li><li><b>Escolher o dispositivo de boot:</b> o UEFI tem uma lista em ordem de prioridade de onde procurar o sistema operacional (por exemplo disco, pendrive ou rede).</li><li><b>Iniciar o bootloader:</b> ele transfere o sistema operacional do dispositivo escolhido para a <b>RAM</b>. Quando termina, o UEFI passa o controle das peças para o sistema operacional.</li></ol>
<p>Resumo para decorar: <b>botão, firmware (UEFI), POST, dispositivo de boot, bootloader</b>.</p>
<h3>No dia a dia de um SOC</h3><ul><li>Ao analisar uma máquina infectada, o conteúdo da <b>RAM</b> some se ela for desligada. Por isso, na forense, se captura a memória antes de desligar.</li><li>Lentidão forte e CPU em 100% sem motivo pode indicar um <b>minerador de criptomoeda</b> escondido.</li><li>O <b>processo de boot é um alvo de ataque</b>: malware pode se instalar antes do sistema operacional carregar (bootkit) ou no firmware, e por isso é difícil de remover. Esse tema volta mais tarde, em segurança do sistema.</li><li>O MAC está na placa de rede e é usado para identificar um aparelho na rede local.</li><li>Em suporte, SSD no lugar de HDD é a melhoria mais barata para um computador lento.</li></ul>
<h3>Cuidado com estas confusões</h3><ul><li>RAM não é armazenamento. Não guarda seus arquivos depois de desligar.</li><li>GB de RAM e GB de disco são coisas diferentes.</li></ul>
<h3>Como explicar numa entrevista</h3><p>"A CPU executa as instruções, a RAM guarda o que está em uso e é volátil, e o armazenamento guarda os dados de forma permanente. Em segurança isso importa porque a memória RAM tem provas que somem ao desligar a máquina."</p>`},
{id:"ctypes",n:"Tipos de Computadores",ic:"📱",tags:["Tipos"],chk:["Citar os principais tipos de computador", "Explicar o que é um servidor e por que ele é diferente de um PC", "Explicar o que é um sistema embarcado e dar exemplos", "Explicar o que é IoT e por que é um risco", "Explicar o que é um mainframe e um supercomputador", "Acertar 8 de 10 no quiz de Tipos de Computadores", "Explicar o exercício da empresa atacada (tudo é computador, até a cafeteira)"],st:`<p class="mu">Computador não é só notebook. Tem computador em celular, carro, cafeteira e até no cartão do banco.</p>
<h3>Os principais tipos</h3><table><tr><th>Tipo</th><th>Para que serve</th><th>Exemplo</th></tr><tr><td><b>Computador pessoal</b> (desktop, notebook)</td><td>Uso geral</td><td>Seu notebook</td></tr><tr><td><b>Servidor</b></td><td>Fornece serviços para outros computadores, ligado o tempo todo</td><td>Servidor de e-mail ou de site</td></tr><tr><td><b>Celular e tablet</b></td><td>Computador portátil com tela sensível ao toque</td><td>iPhone, Android</td></tr><tr><td><b>Sistema embarcado</b></td><td>Chip pequeno com uma única função</td><td>Cafeteira, máquina de lavar, carro</td></tr><tr><td><b>IoT</b> (Internet das Coisas)</td><td>Aparelho do dia a dia conectado à internet</td><td>Câmera de segurança, lâmpada inteligente</td></tr><tr><td><b>Mainframe</b></td><td>Computador gigante que processa milhões de transações</td><td>Sistemas de bancos</td></tr><tr><td><b>Supercomputador</b></td><td>Cálculos científicos muito pesados</td><td>Previsão do tempo</td></tr></table>
<h3>Servidor</h3><ul><li>Fica ligado 24 horas e atende vários clientes ao mesmo tempo.</li><li>Costuma ter mais RAM, discos redundantes e fonte reserva.</li><li>Em geral não tem monitor, e é acessado pela rede (por exemplo com SSH).</li></ul>
<h3>Sistema embarcado e IoT</h3><ul><li><b>Embarcado:</b> computador pequeno dentro de um aparelho, com uma tarefa fixa.</li><li><b>IoT:</b> aparelho embarcado conectado à internet.</li><li>Placas como <b>Raspberry Pi</b> são computadores pequenos usados para aprender e fazer projetos.</li></ul>
<h3>Exercício: a empresa sendo atacada</h3><p>Imagine um escritório e todos os computadores dele: <b>laptop, desktop, estação de trabalho (workstation), servidor, impressoras e até uma cafeteira</b>. Uma <b>estação de trabalho</b> é um computador potente para trabalho pesado, como design ou engenharia.</p>
<p>Agora a empresa está sendo atacada e é preciso <b>desligar tudo</b>. Muita gente desliga todos, menos a cafeteira, sem perceber que ela também conta. A lição:</p><ul><li><b>Tudo que tem um chip e se conecta à rede é um computador.</b> Isso inclui impressoras de rede e uma cafeteira inteligente.</li><li>Um atacante pode entrar por qualquer um deles e usá-lo para chegar aos outros.</li><li>Por isso, em um incidente, a defesa precisa conhecer <b>todos</b> os aparelhos da empresa (inventário) e isolar também os que parecem inofensivos.</li></ul>
<h3>Riscos de segurança</h3><ul><li>Aparelhos IoT muitas vezes saem de fábrica com <b>senha padrão</b> (admin/admin) e raramente são atualizados.</li><li>Quando são invadidos, podem virar parte de uma <b>botnet</b> usada em ataques de negação de serviço (DDoS).</li><li>Servidores são alvos valiosos, porque guardam dados e serviços de muita gente.</li></ul>
<h3>No dia a dia de um SOC</h3><p>O inventário de ativos é a base da defesa: não dá para proteger o que você não sabe que existe. O analista precisa reconhecer se um alerta vem de um servidor crítico ou de um aparelho comum.</p>
<h3>Como explicar numa entrevista</h3><p>"Existem computadores pessoais, servidores, celulares, sistemas embarcados e IoT. Em segurança, servidores guardam dados valiosos e aparelhos IoT são arriscados porque têm senhas padrão e poucas atualizações."</p>`},
{id:"clientserver",n:"Cliente e Servidor",ic:"🔁",tags:["ClienteServidor"],chk:["Explicar o modelo cliente-servidor com um exemplo", "Descrever o ciclo de pedido e resposta", "Dar exemplos de servidores (site, e-mail, arquivos, DNS)", "Explicar o papel de IP e porta", "Diferenciar cliente-servidor de ponto a ponto (P2P)", "Explicar por que o servidor é um alvo e o que é DDoS", "Acertar 8 de 10 no quiz de Cliente e Servidor", "Explicar o que é um protocolo e dizer que o HTTP não tem estado", "Ler as partes de uma URL (scheme, host, arquivo) e o que há na resposta HTTP"],st:`<p class="mu">No modelo cliente-servidor, um lado <b>pede</b> (cliente) e o outro <b>atende</b> (servidor). Quase tudo na internet funciona assim.</p>
<h3>A ideia central</h3><ul><li><b>Cliente:</b> quem faz o pedido. Exemplo: seu navegador, o app de e-mail, seu celular.</li><li><b>Servidor:</b> quem recebe o pedido e responde. Está sempre ligado e esperando.</li><li>Uma analogia: o cliente é o freguês no restaurante e o servidor é a cozinha.</li></ul>
<h3>Pedido e resposta</h3><ol><li>O cliente envia um <b>pedido</b> (request): "me dê a página inicial".</li><li>O servidor processa o pedido.</li><li>O servidor envia uma <b>resposta</b> (response): a página ou um erro.</li></ol>
<h3>Exemplos</h3><table><tr><th>Servidor</th><th>O que faz</th><th>Cliente</th></tr><tr><td>Servidor web</td><td>Entrega páginas</td><td>Navegador</td></tr><tr><td>Servidor de e-mail</td><td>Envia e guarda mensagens</td><td>Outlook, Gmail</td></tr><tr><td>Servidor de arquivos</td><td>Guarda arquivos compartilhados</td><td>Seu computador</td></tr><tr><td>Servidor DNS</td><td>Traduz nomes em IPs</td><td>Qualquer aparelho</td></tr><tr><td>Servidor de jogos</td><td>Mantém a partida online</td><td>Seu console ou PC</td></tr></table>
<h3>Como o cliente encontra o servidor</h3><ul><li>O <b>IP</b> diz em que computador está o servidor.</li><li>A <b>porta</b> diz qual serviço dentro dele (80 e 443 para sites, 25 para e-mail, 22 para SSH).</li><li>O <b>DNS</b> converte o nome (google.com) no IP.</li></ul>
<h3>Como surgiu</h3><p>No começo, cada computador trabalhava sozinho: guardava seus arquivos, rodava seus programas e não conversava com os outros. Depois, várias organizações ligaram os computadores para trocar informação e compartilhar recursos, e nasceram as redes que deram origem à internet (ARPANET, CYCLADES, NPL e NSFNET). Com o tempo, cada sistema se especializou em oferecer um <b>serviço</b>. É o que o modelo cliente-servidor descreve.</p>
<h3>A pizzaria (analogia)</h3><table><tr><th>Na pizzaria</th><th>No computador</th></tr><tr><td>Alice, que quer a pizza, e o Bob, que leva o pedido</td><td>O cliente, por exemplo o navegador</td></tr><tr><td>A pizzaria do Luigi</td><td>O servidor, que serve a página</td></tr><tr><td>O pedido: "uma pizza grande de pepperoni e uma coca"</td><td>A requisição (request)</td></tr><tr><td>A entrega do pedido ou "não temos pepperoni"</td><td>A resposta (response), que pode ser um erro</td></tr><tr><td>A língua e as regras para pedir (o cardápio)</td><td>O protocolo</td></tr><tr><td>As portas A (retirada), B (salão) e C (entrega)</td><td>As portas (ports) de cada serviço</td></tr><tr><td>O GPS que acha o endereço da pizzaria pelo nome</td><td>O DNS, que traduz o nome em IP</td></tr></table>
<ul><li><b>O cliente é sempre quem inicia</b> o pedido.</li><li>Se o pedido vier mal formado ou o recurso não existir, o servidor responde com um <b>erro</b>.</li></ul>
<h3>O que é um protocolo</h3><p>É o conjunto de regras e a língua que o cliente e o servidor usam para conversar. Ele define:</p><ul><li>quais comandos os dois entendem (por exemplo o GET);</li><li>como o pedido é montado (primeiro o comando, depois o pedido);</li><li>qual a sintaxe usada;</li><li>que resposta dar para cada tipo de pedido;</li><li>que resposta dar para um pedido errado.</li></ul>
<h3>HTTP e HTTPS na prática</h3><ul><li><b>HTTP(S)</b> é o protocolo cliente-servidor da web. O S é de Secure (criptografado).</li><li>Ele é <b>sem estado (stateless)</b>: cada pedido é tratado de forma independente, e o servidor não guarda memória dos pedidos anteriores.</li><li>Mas então como um site lembra que você fez login? O site cria um <b>identificador de sessão</b>, normalmente guardado em um <b>cookie</b> ou token, que é enviado junto em cada pedido seguinte. Sem isso você teria que fazer login a cada clique.</li></ul>
<p>Os <b>9 métodos HTTP</b>: GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS, CONNECT e TRACE. Os dois mais comuns são o <b>GET</b> (pedir um recurso, como uma página) e o <b>POST</b> (enviar dados, como um formulário).</p>
<h3>O fluxo de um GET</h3><ol><li>O cliente envia: GET /index.html (pedido de uma página).</li><li>O servidor responde: <b>200 OK</b> com o conteúdo do arquivo.</li></ol>
<h3>Lendo um pedido no navegador (DevTools)</h3><p>No Firefox ou Chrome, F12 abre as ferramentas de desenvolvedor, na aba <b>Network</b> (Rede). Cada linha é um pedido GET (a página, o style.css, o script.js). No detalhe de um pedido você vê:</p><table><tr><th>Campo</th><th>O que diz</th></tr><tr><td><b>Scheme</b></td><td>O protocolo: HTTP ou HTTPS</td></tr><tr><td><b>Host</b></td><td>O nome do servidor que recebe o pedido</td></tr><tr><td><b>Filename</b></td><td>O arquivo pedido. A barra / significa o index.html (a página inicial)</td></tr><tr><td><b>Address</b></td><td>O IP do servidor (127.0.0.1 é a própria máquina)</td></tr><tr><td><b>Status</b></td><td>Se deu certo: 200 OK. Um 404 (como no favicon.ico do exemplo) é arquivo não encontrado</td></tr></table>
<p>A <b>resposta</b> tem duas partes: o <b>cabeçalho (header)</b>, com informações sobre a resposta, e o <b>corpo (body)</b>, com o conteúdo pedido, como o HTML da página.</p>
<p>Exemplo de URL: https://www.iamlearning.thm/contact. O <b>scheme</b> é https, o <b>host</b> é www.iamlearning.thm e o arquivo pedido é /contact.</p>
<h3>Cliente-servidor x ponto a ponto</h3><table><tr><th></th><th>Cliente-servidor</th><th>Ponto a ponto (P2P)</th></tr><tr><td>Como funciona</td><td>Um servidor central atende muitos clientes</td><td>Cada aparelho é cliente e servidor ao mesmo tempo</td></tr><tr><td>Exemplo</td><td>Site, e-mail</td><td>Torrent</td></tr><tr><td>Controle</td><td>Centralizado</td><td>Distribuído</td></tr></table>
<h3>Segurança</h3><ul><li>O servidor fica exposto na rede e é alvo de ataques de força bruta (como no SSH).</li><li><b>DDoS:</b> milhares de clientes falsos pedem ao mesmo tempo até o servidor não aguentar. Ataca a <b>disponibilidade</b>.</li><li>Por isso o servidor deve ter só as portas necessárias abertas, atualizações em dia e logs.</li></ul>
<h3>No dia a dia de um SOC</h3><p>A maioria dos logs vem de servidores: quem pediu o quê, de qual IP e com qual resultado. Um IP que faz milhares de pedidos por segundo é suspeito. Códigos de resposta ajudam a entender: 200 (ok), 404 (não achou), 403 (proibido), 500 (erro do servidor).</p>
<h3>Como explicar numa entrevista</h3><p>"No modelo cliente-servidor, o cliente faz um pedido e o servidor responde. Por exemplo, o navegador pede uma página a um servidor web. O servidor é um alvo, por isso monitoramos os logs e limitamos as portas abertas."</p>`},
{id:"virt",n:"Virtualização",ic:"🧩",tags:["Virtualizacao"],chk:["Explicar o que é virtualização e uma máquina virtual", "Diferenciar host, guest e hypervisor", "Dizer os benefícios da virtualização", "Explicar snapshots", "Diferenciar máquina virtual e container", "Explicar por que a virtualização é útil em segurança", "Acertar 8 de 10 no quiz de Virtualização", "Explicar por que um servidor para cada aplicação é ineficiente", "Explicar o exercício da AutoGalo (reiniciar VM em erro, criar VM, ler o uso dos hosts)", "Explicar container, imagem de container e Docker"],st:`<p class="mu">Virtualização é um computador físico agindo como vários computadores separados. É a base da nuvem e uma ferramenta diária de quem trabalha com segurança.</p>
<h3>O que é</h3>
<p>Várias aplicações dividem o mesmo servidor físico, cada uma isolada na sua <b>máquina virtual (VM)</b>. Quem organiza tudo é o <b>hypervisor</b>.</p>
<h3>Comparação do dia a dia: o prédio</h3>
<table><tr><th>Prédio</th><th>Virtualização</th></tr><tr><td>Prédio</td><td>Servidor físico (host)</td></tr><tr><td>Apartamentos</td><td>Máquinas virtuais (VMs, guests)</td></tr><tr><td>Moradores</td><td>Aplicações</td></tr><tr><td>Síndico</td><td>Hypervisor</td></tr></table>
<h3>Por que ela existe</h3>
<p><b>Antes:</b> um servidor para cada aplicação. Era ineficiente por quatro motivos:</p>
<ul><li><b>Caro:</b> hardware, energia, refrigeração e espaço.</li><li><b>Pouco usado:</b> muitos servidores usavam só 5% a 20%.</li><li><b>Lento:</b> montar um novo levava dias ou semanas.</li><li><b>Difícil de crescer:</b> para ter mais, comprava-se outro servidor.</li></ul>
<h3>Hypervisor: tipo 1 e tipo 2</h3>
<p>O hypervisor cria e gerencia as VMs: reparte CPU, memória e disco, mantém tudo isolado e controla o ciclo de vida (iniciar, parar, pausar, clonar, apagar).</p>
<table><tr><th>Tipo</th><th>Onde roda</th><th>Exemplos</th><th>Serve para</th></tr><tr><td><b>Tipo 1</b></td><td>Direto no hardware</td><td>VMware ESXi, Hyper-V</td><td>Produção, data center</td></tr><tr><td><b>Tipo 2</b></td><td>Dentro de um sistema operacional</td><td>VirtualBox, VMware Workstation</td><td>Estudo, testes, laboratório</td></tr></table>
<h3>A máquina virtual (VM)</h3>
<p>Um computador virtual com CPU, RAM, disco e rede próprios. Roda qualquer sistema e é isolada: se uma VM quebra, as outras seguem. O computador físico é o <b>host</b>; a VM é o <b>guest</b>. Usos: rodar o Kali sem comprar outro computador e testar um arquivo suspeito sem risco.</p>
<h3>Container</h3>
<p>Roda uma só aplicação com tudo o que ela precisa e usa o <b>kernel do host</b> (a parte do sistema que fala com o hardware). Por isso é leve e inicia quase na hora, mas precisa combinar com o host: não roda container Windows em Linux. A <b>imagem</b> é a receita usada para criar containers, e o <b>Docker</b> é a ferramenta que cria e roda.</p>
<table><tr><th></th><th>VM</th><th>Container</th></tr><tr><td>Sistema</td><td>Tem o seu</td><td>Usa o kernel do host</td></tr><tr><td>Peso</td><td>Pesada</td><td>Leve</td></tr><tr><td>Isolamento</td><td>Mais forte</td><td>Mais fraco</td></tr></table>
<p>Resumo: a VM é o apartamento completo, o container é um cômodo.</p>
<h3>Exemplo prático: cuidando das VMs de uma empresa</h3>
<p>Numa ferramenta de gerenciamento de VMs há 3 visões: <b>resumo</b>, <b>máquinas</b> (cada VM com botões de ação) e <b>hosts</b> (uso dos servidores físicos). Situações típicas:</p>
<ol><li><b>O e-mail parou:</b> a VM do servidor de e-mail está em <b>Error</b>. Reiniciar a VM costuma resolver.</li><li><b>Pedido de VM nova:</b> criar com nome, núcleos de CPU, memória e disco, por exemplo 4 núcleos, 8 GB e 100 GB.</li><li><b>Host no limite:</b> um servidor físico com 98% de CPU e 95% de disco não aguenta mais VMs. Avise o responsável antes que os serviços caiam.</li></ol>
<h3>Benefícios</h3>
<p>Economia, melhor uso dos recursos, testes seguros, implantação rápida, flexibilidade, portabilidade, escalabilidade e gerenciamento centralizado.</p>
<h3>No dia a dia de um SOC</h3>
<ul><li><b>Sandbox:</b> uma VM isolada para abrir arquivos suspeitos. O <b>snapshot</b> (foto do estado da VM) devolve o estado limpo em segundos.</li><li><b>Nuvem:</b> a AWS e a Azure rodam milhões de VMs. Contratar uma máquina na nuvem (IaaS) é receber uma VM.</li><li><b>Riscos:</b> VM escape (fugir da VM até o host) é raro, mas grave. Um hypervisor invadido atinge todas as VMs, e um host no limite derruba vários serviços de uma vez.</li><li>Ao testar malware, isole a VM da rede e do host.</li></ul>
<h3>Como explicar numa entrevista</h3>
<p><b>What is virtualization and what does a hypervisor do?</b><br><i>Virtualization runs several virtual machines on one physical server. The hypervisor creates and manages them, shares out CPU, memory and storage and keeps them isolated. Type 1 runs on the hardware, type 2 runs inside an operating system.</i></p>
<p><b>What is the difference between a VM and a container?</b><br><i>A VM has its own operating system and stronger isolation. A container shares the host's kernel, so it is lighter and starts faster. In security I use VMs as sandboxes and take snapshots to return to a clean state.</i></p>`},
{id:"encoding",n:"Codificação de Dados",ic:"🔤",tags:["Encoding"],chk:["Explicar o que é uma codificação (encoding) e por que um arquivo pode aparecer como texto estranho", "Explicar o ASCII (7 bits, 128 caracteres) e ler a tabela (A é 65, a é 97, 0 é 48)", "Explicar o que são caracteres de controle (código 10 é a nova linha)", "Explicar por que ISO-8859-1 e ISO-8859-2 causam confusão", "Explicar o Unicode e o que é um code point (U+0041)", "Diferenciar UTF-8, UTF-16 e UTF-32", "Explicar por que a codificação importa em segurança", "Acertar 8 de 10 no quiz de Data Encoding"],st:`<p class="mu">Todo texto no computador é guardado como números. A codificação é o combinado que diz qual número vira qual letra.</p>
<h3>O que é</h3>
<ul><li><b>Caractere é um número com significado combinado.</b> Esse combinado é a <b>codificação (encoding)</b>.</li><li>Quando quem salvou e quem abriu usam codificações diferentes, o texto vira símbolos estranhos (<b>mojibake</b>), como "AÃ§Ã£o" no lugar de "Ação".</li></ul>
<h3>Comparação do dia a dia</h3>
<p>É como um código combinado entre amigos: "1 = A, 2 = B". Se um usa uma tabela e o outro usa outra, a mensagem chega embaralhada, mesmo sem ninguém ter mexido nela.</p>
<h3>ASCII: o começo</h3>
<p><b>ASCII</b> (American Standard Code for Information Interchange) é de 1963, usa <b>7 bits</b> e tem <b>128 códigos</b> (0 a 127) para inglês, dígitos, pontuação e controle.</p>
<table><tr><th>Caractere</th><th>Decimal</th><th>Hex</th></tr><tr><td>0</td><td>48</td><td>30</td></tr><tr><td>9</td><td>57</td><td>39</td></tr><tr><td>A</td><td>65</td><td>41</td></tr><tr><td>Z</td><td>90</td><td>5A</td></tr><tr><td>a</td><td>97</td><td>61</td></tr><tr><td>z</td><td>122</td><td>7A</td></tr></table>
<ul><li>Letras e dígitos estão <b>em ordem</b>: se sabe o b, sabe o a e o c. A minúscula é a maiúscula mais 32.</li><li>O caractere "0" é o código 48, não o número 0.</li><li><b>Caracteres de controle:</b> códigos 0 a 31 e 127. Mandam o aparelho fazer algo, não desenham símbolo. O 10 é <b>LF</b> (nova linha) e o 127 é <b>DEL</b>.</li><li>Exemplo: o arquivo com a palavra "Hello" e um Enter, em hex: <b>48 65 6c 6c 6f 0a</b>. O 0a é a nova linha.</li></ul>
<h3>O limite do ASCII</h3>
<p>O ASCII não tem ñ, ß, é, ç. Com o oitavo bit surgiram padrões por região: <b>ISO-8859-1 (Latin-1)</b> para a Europa Ocidental (inclui português) e <b>ISO-8859-2 (Latin-2)</b> para a Central e Oriental (polonês, tcheco). O mesmo código vira letras diferentes em cada um: o ø do Latin-1 aparece como ř no Latin-2. Quem salva e quem abre precisam usar a mesma codificação.</p>
<h3>Unicode e UTF-8</h3>
<p><b>Unicode</b> dá um número único, o <b>code point</b>, a cada caractere de todos os idiomas, símbolos e emojis (quase 157 mil na versão 17.0). Formato U+ seguido de hex: U+0041 é o A, U+03A9 é o Ω, U+3042 é o あ. As codificações <b>UTF</b> dizem como esse número vira bytes:</p>
<table><tr><th></th><th>Tamanho</th><th>Para lembrar</th></tr><tr><td><b>UTF-8</b></td><td>1 a 4 bytes</td><td>ASCII ocupa 1 byte (compatível). O mais comum na web</td></tr><tr><td><b>UTF-16</b></td><td>2 ou 4 bytes</td><td>Os raros (emoji) usam um par substituto</td></tr><tr><td><b>UTF-32</b></td><td>sempre 4 bytes</td><td>Simples, mas gasta espaço</td></tr></table>
<p>O 🔥 (U+1F525) tem 17 bits, mais do que cabe em 16, por isso precisa de 4 bytes no UTF-16.</p>
<h3>No dia a dia de um SOC</h3>
<ul><li><b>Codificar não é criptografar:</b> a regra é pública e qualquer um desfaz. Criptografia exige uma chave. Base64 é codificação, e atacantes usam para esconder comandos (o -EncodedCommand do PowerShell).</li><li>Texto cheio de símbolos estranhos costuma ser problema de codificação: confira se é UTF-8.</li><li><b>Homógrafos:</b> um domínio com letra cirílica parecida com a latina (раураl.com) é truque de phishing.</li><li>Um filtro e um servidor podem ler o mesmo texto de jeitos diferentes e deixar um conteúdo malicioso passar.</li></ul>
<h3>Cuidado com estas confusões</h3>
<ul><li>Unicode é a tabela de números; UTF-8 é um jeito de gravar esses números em bytes.</li><li>Log "embaralhado" pode ser só codificado. Antes de achar que é criptografia, tente decodificar.</li></ul>
<h3>Como explicar numa entrevista</h3>
<p><b>What is the difference between ASCII, Unicode and UTF-8?</b><br><i>ASCII uses 7 bits and covers only basic English. Unicode gives every character in every language a unique number, and UTF-8 stores those numbers in one to four bytes while staying compatible with ASCII.</i></p>
<p><b>Is Base64 encryption?</b><br><i>No. It is an encoding with a public rule, so anyone can decode it. Attackers use it to hide commands, so I decode it during an investigation.</i></p>`},
{id:"cloud",n:"Cloud",ic:"☁️",tags:["Cloud"],chk:["Explicar nuvem pública, privada e híbrida","Explicar IaaS, PaaS e SaaS com exemplos","Explicar a responsabilidade compartilhada","Listar os benefícios da nuvem","Acertar 8 de 10 no quiz de Cloud"],st:`<h3>Duas perguntas diferentes</h3><p>1) <b>Onde</b> a nuvem fica e de quem é? 2) <b>Quanto</b> eu gerencio? Quem mistura as duas se confunde.</p><h3>Onde (implantação)</h3><ul><li><b>Pública:</b> infraestrutura de um provedor, compartilhada por muitos clientes (AWS, Azure, Google Cloud).</li><li><b>Privada:</b> de uma só empresa. Mais controle, mas a segurança depende de quem configura.</li><li><b>Híbrida:</b> mistura das duas, trocando dados.</li></ul><h3>Quanto (serviço)</h3><table><tr><th>Modelo</th><th>Analogia</th><th>Exemplo</th></tr><tr><td>IaaS</td><td>quarto vazio: você traz tudo</td><td>Amazon EC2</td></tr><tr><td>PaaS</td><td>apartamento mobiliado: você traz só suas coisas (app e dados)</td><td>Heroku</td></tr><tr><td>SaaS</td><td>hotel: tudo pronto</td><td>Gmail, Zoom</td></tr></table><p>Quanto você faz: IaaS &gt; PaaS &gt; SaaS.</p><table><tr><th>Quem cuida de...</th><th>IaaS</th><th>PaaS</th><th>SaaS</th></tr><tr><td>Datacenter e servidores</td><td>provedor</td><td>provedor</td><td>provedor</td></tr><tr><td>Sistema operacional</td><td>você</td><td>provedor</td><td>provedor</td></tr><tr><td>Aplicativo</td><td>você</td><td>você</td><td>provedor</td></tr><tr><td>Seus dados e acessos</td><td>você</td><td>você</td><td>você</td></tr></table><h3>Benefícios</h3><ul><li><b>Scalability:</b> cresce ou diminui conforme a necessidade.</li><li><b>On-demand self-service:</b> você cria sozinho, na hora.</li><li><b>Pay only for what you use:</b> paga só o que usar.</li><li><b>High availability:</b> continua no ar se uma parte falhar.</li><li><b>Global access:</b> acesso de qualquer lugar.</li><li><b>Security:</b> o provedor protege a infraestrutura, mas veja abaixo.</li></ul><h3>Responsabilidade compartilhada</h3><p>Provedor: prédios, servidores, rede física. Você: senhas, permissões, dados e configurações.</p><h3>No dia a dia de um SOC</h3><ul><li>Armazenamento deixado público por engano vaza dados.</li><li>Chaves de acesso esquecidas dentro de código são roubadas.</li><li>Permissão demais (IAM, o controle de quem pode fazer o quê) é causa comum de incidente.</li><li>Login vindo de outro país ou servidores criados sem ninguém saber são alertas.</li></ul><h3>Para completar</h3><ul><li><b>Segurança DA nuvem x NA nuvem:</b> o provedor protege a nuvem em si (prédios, servidores, rede). Você protege o que coloca nela (dados, contas, permissões e configurações).</li><li><b>O erro mais comum é de configuração:</b> armazenamento público por engano, chaves no código e permissão demais.</li><li><b>Boas práticas simples:</b> MFA em todas as contas, menor privilégio (só o acesso necessário) e revisar quem pode fazer o quê.</li></ul><h3>Não confunda</h3><p>Pública, privada e híbrida respondem <b>ONDE</b> a nuvem fica. IaaS, PaaS e SaaS respondem <b>QUANTO</b> você gerencia. São duas perguntas diferentes.</p><h3>Como explicar numa entrevista</h3><p><b>What is the difference between IaaS, PaaS and SaaS?</b><br><i>With IaaS the provider gives me the infrastructure, such as virtual machines, and I manage the operating system and the applications. With PaaS the provider also manages the platform, so I only manage my application and data. With SaaS I just use the software, like Microsoft 365, and I manage my data and access.</i></p><p><b>What is the shared responsibility model?</b><br><i>The provider secures the cloud itself, like the data centres and hardware. The customer secures what they put in it: data, accounts, permissions and configuration.</i></p>`},
{id:"so",n:"Sistemas Operacionais",ic:"💻",tags:["Sistemas"],chk:["Explicar o que é um sistema operacional","Explicar kernel space e user space","Explicar GUI e CLI","Acertar 8 de 10 no quiz de Sistemas"],st:`<h3>O que é</h3><p>O SO é a ponte entre você (e seus apps) e o hardware. Exemplos: Windows, Linux, macOS, Android.</p><h3>Kernel e user space (restaurante)</h3><ul><li><b>Kernel</b> = a cozinha. Acesso total ao hardware, só quem é autorizado.</li><li><b>User space</b> = o salão. Apps comuns, com permissões limitadas.</li><li>Os apps pedem ao kernel, como o cliente pede ao garçom. Se um app travar, o sistema continua de pé.</li></ul><p>Exemplo: ao salvar um arquivo no Word, o app pede ao kernel e o kernel grava no disco. O app nunca mexe no disco diretamente.</p><h3>GUI e CLI</h3><ul><li><b>GUI:</b> visual (janelas, ícones, cliques). É o cardápio com fotos.</li><li><b>CLI:</b> texto, você digita comandos. Mais rápida, precisa e automatizável.</li></ul><h3>O que mais você precisa saber</h3><ul><li><b>Processo:</b> um programa em execução.</li><li><b>Usuário comum x administrador</b> (Windows) ou <b>root</b> (Linux).</li><li><b>Driver:</b> tradutor entre o SO e um dispositivo, como a impressora.</li><li><b>Logs:</b> o diário do sistema. Windows: Event Viewer. Linux: /var/log.</li></ul><h3>No dia a dia de um SOC</h3><ul><li>Privilege escalation: o atacante tenta virar administrador ou chegar ao kernel.</li><li>Muitos logins falhos nos logs sugerem tentativa de adivinhar senha.</li><li>Processos desconhecidos podem ser malware.</li><li>Atualizações corrigem falhas que atacantes exploram.</li></ul><h3>Para completar</h3><ul><li>O SO gerencia o processador, a memória (RAM), o disco e os arquivos, os dispositivos e também os usuários e as permissões.</li><li>Quando um app pede algo ao kernel, isso se chama <b>chamada de sistema</b> (system call).</li><li><b>Kernel x sistema operacional:</b> o kernel é o núcleo. O sistema operacional inclui o kernel mais as ferramentas e a interface.</li></ul><h3>Como explicar numa entrevista</h3><p><b>What is an operating system?</b><br><i>It is the software between the hardware and the applications. It manages the processor, memory, storage and devices, and controls who can do what.</i></p><p><b>What is the difference between kernel space and user space?</b><br><i>The kernel runs with full privileges and talks to the hardware. Normal applications run in user space with limited permissions and ask the kernel for what they need. This protects the system if an app crashes or is compromised.</i></p>`},
{id:"win",n:"Windows Básico",ic:"🖥️",tags:["Windows"],chk:["Explicar Desktop, Taskbar, Start Menu e Search","Explicar File Explorer, Windows Update e Microsoft Store","Explicar Settings e Control Panel","Explicar Task Manager, Windows Security e Firewall","Dizer qual ferramenta usar em cada situação (sua tabela de memorizar)","Acertar 8 de 10 no quiz de Windows"],st:`<h3>A tela e a navegação</h3><ul><li><b>Desktop:</b> a tela principal, com arquivos, pastas e atalhos.</li><li><b>Taskbar:</b> a barra de baixo. Abre e alterna entre apps e mostra notificações.</li><li><b>Start Menu:</b> o menu do símbolo do Windows. Abre programas, configurações e desliga ou reinicia.</li><li><b>Search:</b> acha apps, arquivos, pastas e configurações digitando.</li></ul><h3>Arquivos e programas</h3><ul><li><b>File Explorer:</b> encontrar, abrir, organizar, copiar, mover e excluir arquivos.</li><li><b>Microsoft Store:</b> a loja oficial de apps.</li></ul><h3>Configurar e manter</h3><ul><li><b>Settings:</b> rede, dispositivos, contas, personalização e segurança.</li><li><b>Control Panel:</b> o painel antigo. Ainda altera algumas coisas, mas o Settings vem substituindo.</li><li><b>Windows Update:</b> corrige falhas e melhora a segurança.</li></ul><h3>Monitorar e proteger</h3><ul><li><b>Task Manager:</b> memória, processador, disco e programas em tempo real. Encerra app travado (Ctrl+Shift+Esc).</li><li><b>Windows Security:</b> painel central de proteção contra ameaças.</li><li><b>Windows Defender Firewall:</b> barreira que controla o tráfego de rede e bloqueia conexões não autorizadas.</li></ul><h3>Sua tabela de memorizar</h3><table><tr><th>Preciso de...</th><th>Uso</th></tr><tr><td>Encontrar algo</td><td>Search</td></tr><tr><td>Organizar arquivos</td><td>File Explorer</td></tr><tr><td>Abrir um programa</td><td>Start Menu</td></tr><tr><td>Configurar o computador</td><td>Settings</td></tr><tr><td>Resolver programa travado</td><td>Task Manager</td></tr><tr><td>Atualizar o sistema</td><td>Wi
