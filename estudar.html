 . . . . . . : 10.20.4.118(Preferred)\n   Subnet Mask . . . . . . . . . . . : 255.255.255.0\n   Default Gateway . . . . . . . . . : 10.20.4.1\n   DHCP Server . . . . . . . . . . . : 10.20.0.10\n   DNS Servers . . . . . . . . . . . : 8.8.8.8\n                                       8.8.4.4"}, {"c": "nslookup intranet.empresa.local", "a": ["nslookup intranet"], "out": "Server:  dns.google\nAddress:  8.8.8.8\n\n*** dns.google can't find intranet.empresa.local: Non-existent domain"}, {"c": "nslookup intranet.empresa.local 10.20.0.10", "out": "Server:  dc01.empresa.local\nAddress:  10.20.0.10\n\nName:    intranet.empresa.local\nAddress:  10.20.5.30"}, {"c": "ping 10.20.5.30", "out": "Pinging 10.20.5.30 with 32 bytes of data:\nReply from 10.20.5.30: bytes=32 time=1ms TTL=127\nReply from 10.20.5.30: bytes=32 time=1ms TTL=127\nReply from 10.20.5.30: bytes=32 time=1ms TTL=127\nReply from 10.20.5.30: bytes=32 time=1ms TTL=127"}], "dica": "Compare a resposta do DNS público (8.8.8.8) com a do DNS da empresa (10.20.0.10). Nomes .local só existem no DNS interno."}, "diag": {"p": "Qual é a causa?", "ops": ["O DNS foi trocado à mão para 8.8.8.8, que não conhece os nomes internos da empresa", "O servidor da intranet está fora do ar", "O cabo de rede está solto", "A conta da Carla foi bloqueada"], "porque": "O ping no IP da intranet responde e o DNS da empresa (10.20.0.10) acha o nome. Só o DNS público, configurado por ela, não conhece intranet.empresa.local."}, "acao": {"p": "O que fazer?", "ops": ["Voltar o DNS para automático (DHCP), rodar ipconfig /flushdns, testar a intranet com ela e explicar por que não mudar a configuração de rede", "Escalar para o time de Sistemas: a intranet caiu", "Colocar a intranet no arquivo hosts do computador dela", "Formatar o computador para limpar a configuração"], "porque": "Desfazer a mudança resolve a causa. O arquivo hosts seria uma gambiarra que quebra quando o IP mudar, e a intranet funciona para os outros."}, "nota": {"itens": [["A causa (DNS 8.8.8.8)", "8\\.8\\.8\\.8|dns"], ["A evidência (nslookup)", "nslookup|non-existent|não encontr|can't find"], ["A correção (DNS automático)", "autom|dhcp|obtain"], ["Teste com a usuária", "test|confirm|abriu|works|working|funcion"]], "modelo": "User could browse the internet but not intranet.empresa.local or the time system. Other HR users unaffected.\nipconfig /all: DNS manually set to 8.8.8.8 / 8.8.4.4 (user followed an online video).\nnslookup via 8.8.8.8: Non-existent domain. Via 10.20.0.10: resolves to 10.20.5.30.\nSet DNS back to automatic (DHCP), ran ipconfig /flushdns.\nTested: intranet and time system open. Advised user not to change network settings. Resolved."}}, {"id": "RITM0018832", "nivel": 1, "titulo": "Acesso à pasta do RH", "canal": "E-mail", "quem": "Diego Martins", "setor": "RH", "hora": "08:40", "topicos": ["contas", "sd"], "msg": "Olá, TI. Comecei hoje no RH (vim do Financeiro). Preciso acessar a pasta \\\\fs01\\RH, mas aparece \"Você não tem permissão para acessar\". Minha gestora agora é a Paula Reis. Obrigado!", "triagem": {"tipo": "Requisição de serviço", "cat": "Conta e acesso", "impacto": 1, "urgencia": 2, "porque": "Nada quebrou: é um pedido de acesso, que precisa de aprovação (requisição). Uma pessoa, e ele consegue fazer outras tarefas: P4."}, "perguntas": [{"p": "A Paula aprovou esse acesso? Pode pedir para ela responder neste chamado?", "r": "Pedi agora. (10 min depois, Paula Reis responde no chamado: \"Aprovado: leitura e escrita na pasta RH para o Diego.\")", "ok": true, "porque": "Acesso sempre precisa da aprovação do gestor ou do dono da pasta, registrada no chamado."}, {"p": "Você precisa só ler ou também editar os arquivos?", "r": "Editar. Vou atualizar as planilhas de férias.", "ok": true, "porque": "Menor privilégio: dê só o nível de acesso necessário (leitura ou leitura e escrita)."}, {"p": "Você ainda precisa dos acessos do Financeiro?", "r": "Não, saí de lá. A Paula pediu para eu cuidar só do RH agora.", "ok": true, "porque": "Quem muda de setor deve perder os acessos antigos."}, {"p": "Um colega do RH pode te passar a senha dele por hoje?", "r": "Acho que ninguém vai querer...", "ok": false, "porque": "Compartilhar senha é proibido e acaba com a rastreabilidade."}, {"p": "Quer que eu te dê acesso de administrador para não ter mais esse problema?", "r": "Se for mais fácil...", "ok": false, "porque": "Administrador \"para facilitar\" é um dos erros mais graves de segurança."}, {"p": "Você já reiniciou o computador?", "r": "Já, continua igual.", "ok": false, "porque": "\"Você não tem permissão\" mostra que a rede funciona e falta permissão. Reiniciar não dá permissão."}], "terminal": {"onde": "PowerShell no seu computador de suporte, com o módulo do Active Directory.", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "Get-ADPrincipalGroupMembership diego.martins | Select-Object Name", "a": ["get-adprincipalgroupmembership diego.martins"], "out": "Name\n----\nDomain Users\nGG-Financeiro-RW\nGG-Todos-Leitura"}, {"c": "(Get-Acl \\\\fs01\\RH).Access | Format-Table IdentityReference,FileSystemRights", "a": ["get-acl \\\\fs01\\rh"], "out": "IdentityReference         FileSystemRights\n-----------------         ----------------\nEMPRESA\\GG-RH-RW           Modify, Synchronize\nEMPRESA\\GG-RH-R            ReadAndExecute, Synchronize\nBUILTIN\\Administrators     FullControl"}, {"c": "net user diego.martins /domain", "out": "User name                    diego.martins\nFull Name                    Diego Martins\nAccount active               Yes\nGlobal Group memberships     *Domain Users  *GG-Financeiro-RW\n                             *GG-Todos-Leitura\nThe command completed successfully."}], "dica": "Compare os grupos do Diego com os grupos que têm permissão na pasta (Get-Acl)."}, "diag": {"p": "O que explica o acesso negado?", "ops": ["O Diego não está no GG-RH-RW, o grupo que tem permissão na pasta, e ainda está no grupo do Financeiro", "O servidor fs01 está fora do ar", "A conta do Diego está bloqueada", "A pasta do RH foi apagada"], "porque": "A pasta dá Modify ao GG-RH-RW e leitura ao GG-RH-R. O Diego não está em nenhum dos dois. Se o servidor estivesse fora, a mensagem seria outra, não 'sem permissão'."}, "acao": {"p": "Com a aprovação da Paula, o que fazer?", "ops": ["Adicionar ao GG-RH-RW, remover do GG-Financeiro-RW, pedir para ele sair e entrar no Windows e testar", "Dar permissão direta na pasta para a conta do Diego", "Adicionar ao GG-RH-RW e deixar o Financeiro, por garantia", "Colocar o Diego no grupo Domain Admins"], "porque": "Acesso por grupo, com aprovação, e tirando o acesso antigo (o Diego mesmo disse que não precisa mais). A pertença a grupos só vale depois de sair e entrar de novo."}, "nota": {"itens": [["A aprovação da gestora", "aprova|approv|paula"], ["O grupo adicionado", "gg-rh|grupo|group"], ["A remoção do acesso antigo", "financeiro|finance|remov"], ["Logoff e teste", "logoff|log off|sair|sign out|signed out|test|confirm"]], "modelo": "Access request: read/write to \\\\fs01\\RH for Diego Martins (moved from Finance to HR).\nApproved in ticket by HR manager Paula Reis.\nAdded diego.martins to GG-RH-RW. Removed from GG-Finance-RW (no longer required, confirmed by user and Paula).\nUser signed out and in again; tested opening and saving a file in \\\\fs01\\RH. Fulfilled."}}, {"id": "INC0041238", "nivel": 1, "titulo": "Celular novo e o MFA não funciona", "canal": "Telefone", "quem": "Marcos Teixeira", "setor": "Vendas (externo)", "hora": "07:52", "topicos": ["contas", "atend"], "msg": "Bom dia. Troquei de celular no fim de semana e agora o Teams e o e-mail pedem a aprovação no Authenticator, mas o app no celular novo não tem a minha conta. O celular antigo eu já entreguei na loja. Tenho reunião com cliente às 10h.", "triagem": {"tipo": "Incidente", "cat": "Conta e acesso", "impacto": 1, "urgencia": 3, "porque": "Ele não consegue entrar em nada e tem reunião daqui a pouco (urgência alta), mas é uma pessoa: P3."}, "perguntas": [{"p": "Para sua segurança, vou confirmar sua identidade: posso te ligar no número cadastrado?", "r": "Pode, o número é o mesmo, só troquei o aparelho. (Você liga no número cadastrado e é ele.)", "ok": true, "porque": "Reset de MFA sem verificar a identidade é exatamente o que golpistas pedem."}, {"p": "Você recebeu algum pedido de aprovação que não tenha feito?", "r": "Não, só quando eu mesmo tento entrar.", "ok": true, "porque": "Pedidos que a pessoa não fez indicariam que alguém tem a senha dela: aí seria caso de segurança."}, {"p": "Você consegue entrar em algum lugar agora, como o Outlook na web?", "r": "Não, tudo pede a aprovação no celular.", "ok": true, "porque": "Confirma o tamanho do problema: todo login com MFA está parado."}, {"p": "Me passa a sua senha que eu entro e configuro para você?", "r": "Pode ser... é Vendas2026!", "ok": false, "porque": "Nunca peça senha. Agora ela precisa ser trocada."}, {"p": "Vou desligar o MFA da sua conta de vez para não dar mais problema, ok?", "r": "Ótimo, menos uma coisa!", "ok": false, "porque": "Desligar o MFA deixa a conta protegida só pela senha. Não é solução."}, {"p": "Pode me mandar o código por WhatsApp no meu número pessoal?", "r": "Qual código? Eu não tenho código nenhum...", "ok": false, "porque": "Canais pessoais não são canal de suporte, e você ensinaria o usuário a passar códigos para qualquer um."}], "terminal": {"onde": "PowerShell com o módulo Microsoft Graph (Entra ID).", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "Get-MgUserAuthenticationMethod -UserId marcos.teixeira@empresa.com", "a": ["get-mguserauthenticationmethod marcos.teixeira@empresa.com"], "out": "Method                    Detail\n------                    ------\nPassword                  -\nMicrosoft Authenticator   iPhone 12 (registrado em 03/02/2025)"}, {"c": "Get-MgAuditLogSignIn -Filter \"userPrincipalName eq 'marcos.teixeira@empresa.com'\" -Top 4 | Format-Table CreatedDateTime,IpAddress,City,Status", "a": ["get-mgauditlogsignin"], "out": "CreatedDateTime      IpAddress      City        Status\n---------------      ---------      ----        ------\n11/11/2026 07:49:10  192.0.2.44     São Paulo   50074: Strong authentication required\n11/11/2026 07:48:31  192.0.2.44     São Paulo   50074: Strong authentication required\n10/11/2026 21:12:05  192.0.2.44     São Paulo   50074: Strong authentication required\n07/11/2026 18:30:44  192.0.2.44     São Paulo   Success"}], "dica": "Veja em qual aparelho o Authenticator está registrado e de onde vieram os logins."}, "diag": {"p": "O que os dados mostram?", "ops": ["O MFA está ligado ao celular antigo (iPhone 12); os logins que falharam são só dele, do lugar de sempre", "A conta foi invadida: há logins de outro país", "A senha dele expirou", "A licença do Microsoft 365 acabou"], "porque": "O único Authenticator registrado é o iPhone 12, que foi entregue na loja. Todos os logins vêm do mesmo IP e cidade, com o erro 50074 (precisa de MFA), não de senha errada."}, "acao": {"p": "Qual é a solução certa?", "ops": ["Com a identidade confirmada, redefinir os métodos de MFA (exigir novo registro), acompanhar o cadastro do Authenticator no celular novo e testar o login", "Desativar o MFA da conta por 30 dias", "Escalar para a Segurança como conta comprometida", "Criar uma conta nova para ele"], "porque": "Ao exigir novo registro, no próximo login ele cadastra o celular novo. Não há sinal de ataque, então não é caso de segurança, e desligar o MFA só aumentaria o risco."}, "nota": {"itens": [["Verificação de identidade", "identi|verific|callback|ligu|on file"], ["MFA redefinido / novo registro", "mfa|authenticator|re-?regist|redefin|reset"], ["Logins conferidos, sem sinal de ataque", "sign-?in|login|logs|sem sinal|no sign|legit|50074"], ["Teste", "test|confirm|funcion|works|signed in"]], "modelo": "User replaced his phone; old iPhone 12 (only Authenticator method) was traded in. Unable to complete MFA for Teams/Outlook.\nIdentity verified by callback to registered mobile number.\nSign-in logs: only failures 50074 from usual IP/location, no suspicious activity.\nRequired re-registration of MFA methods. Guided user to set up Microsoft Authenticator on the new phone.\nTested: user signed in to Outlook and Teams. Resolved."}}, {"id": "RITM0018850", "nivel": 1, "titulo": "Liberar um programa de PDF", "canal": "Portal", "quem": "Rodrigo Nunes", "setor": "Marketing", "hora": "14:20", "topicos": ["sd", "atend"], "msg": "Preciso juntar uns PDFs. Achei um programa grátis, o \"PDF Merge Pro Free\", num site. Podem liberar a instalação? Não tenho permissão de administrador.", "triagem": {"tipo": "Requisição de serviço", "cat": "Software e sistemas", "impacto": 1, "urgencia": 1, "porque": "É um pedido, nada quebrou (requisição). Uma pessoa, sem prazo: P4."}, "perguntas": [{"p": "O que exatamente você precisa fazer com os PDFs?", "r": "Só juntar 3 arquivos num só e às vezes girar uma página.", "ok": true, "porque": "Entender a necessidade real permite oferecer uma solução aprovada."}, {"p": "De onde é esse programa?", "r": "De um site que apareceu no Google, pdfmergepro-free.download.", "ok": true, "porque": "Origem desconhecida é um risco: programas \"grátis\" de sites aleatórios trazem adware ou coisa pior."}, {"p": "Você já procurou no Portal da Empresa (catálogo de software)?", "r": "Não sabia que existia isso.", "ok": true, "porque": "O catálogo tem os programas já aprovados, muitas vezes com instalação sem precisar de administrador."}, {"p": "Quer que eu te dê administrador para você instalar o que precisar?", "r": "Seria ótimo!", "ok": false, "porque": "Viola o menor privilégio e abre a porta para malware."}, {"p": "Por que você não faz isso no computador de casa?", "r": "Os arquivos são da empresa...", "ok": false, "porque": "Mandar dados da empresa para um computador pessoal é pior ainda."}, {"p": "Pode baixar o instalador e me mandar por e-mail?", "r": "Ok, mando já.", "ok": false, "porque": "Você estaria trazendo um arquivo desconhecido para dentro da empresa por e-mail."}], "terminal": {"onde": "Ferramentas do Service Desk: busca no catálogo de software e consulta de reputação de domínio.", "prompt": "suporte>", "cmds": [{"c": "catalogo pdf", "a": ["catalogo"], "out": "Catálogo de software aprovado: 'pdf'\n-------------------------------------\nAdobe Acrobat Reader   aprovado · gratuito · ler e assinar PDF (não junta arquivos)\nPDF24 Creator          aprovado · gratuito · juntar, dividir, girar e comprimir PDF\nAdobe Acrobat Pro      aprovado · licença paga · precisa da aprovação do gestor"}, {"c": "catalogo \"PDF Merge Pro Free\"", "a": ["catalogo pdf merge pro free"], "out": "Nenhum resultado. Software não homologado pela TI."}, {"c": "reputacao pdfmergepro-free.download", "a": ["reputacao"], "out": "Domínio: pdfmergepro-free.download\nCriado há: 9 dias\nVirusTotal: 6/94 fornecedores marcam como malicioso (adware / PUP)\nCategoria do proxy: Software potencialmente indesejado"}], "dica": "Procure o que já é aprovado antes de pensar em liberar algo novo."}, "diag": {"p": "O que você descobriu?", "ops": ["O programa pedido não é aprovado e vem de um site suspeito, mas o PDF24, aprovado, faz o que ele precisa", "O programa é seguro porque é grátis", "Não existe nenhuma opção aprovada para juntar PDFs", "O Adobe Reader junta PDFs e resolve"], "porque": "Site criado há 9 dias e marcado como adware por 6 fornecedores: não instale. O catálogo mostra o PDF24, aprovado e gratuito, que junta e gira páginas. O Reader não junta arquivos."}, "acao": {"p": "Como responder ao pedido?", "ops": ["Recusar o programa não aprovado explicando o motivo, oferecer o PDF24 pelo Portal da Empresa e confirmar que resolve", "Instalar o programa do site para ele", "Recusar sem oferecer alternativa", "Comprar o Acrobat Pro para ele sem aprovação"], "porque": "Bom atendimento resolve a necessidade com segurança: diga não ao risco e sim à alternativa aprovada. O Acrobat Pro precisaria de aprovação e nem é necessário."}, "nota": {"itens": [["Software não aprovado e o risco", "não aprovad|nao aprovad|not approved|unapproved|homolog|malicio|pup|adware"], ["A alternativa aprovada", "pdf24|portal|catálogo|catalogo|catalog"], ["Confirmação com o usuário", "confirm|test|resolv|funcion|works"]], "modelo": "Request to install 'PDF Merge Pro Free' from pdfmergepro-free.download.\nNot in the approved software catalogue. Domain created 9 days ago, flagged as adware/PUP by 6/94 vendors on VirusTotal. Request declined and reason explained to user.\nNeed: merge PDFs and rotate pages. Offered approved alternative PDF24 Creator via Company Portal; user installed it.\nConfirmed: user merged the files successfully. Closed."}}, {"id": "INC0041230", "nivel": 2, "titulo": "Financeiro inteiro sem imprimir", "canal": "Telefone", "quem": "Fernanda Alves", "setor": "Financeiro", "hora": "09:24", "topicos": ["trouble", "sd"], "msg": "Ninguém do Financeiro consegue imprimir! Tem um monte de documento na fila e nada sai. A gente precisa imprimir os boletos até as 11h!", "triagem": {"tipo": "Incidente", "cat": "Impressão", "impacto": 2, "urgencia": 3, "porque": "Um setor inteiro (impacto médio) com prazo em menos de 2 horas (urgência alta): P2."}, "perguntas": [{"p": "Aparece alguma mensagem na impressora ou na fila de impressão?", "r": "Na fila, o primeiro documento está com \"Erro - Imprimindo\". A impressora diz \"Pronta\".", "ok": true, "porque": "Impressora pronta + fila com erro aponta para o trabalho travado, não para o hardware."}, {"p": "Desde quando? Alguém imprimiu algo diferente antes de parar?", "r": "Parou umas 9h, logo depois que o Rafael mandou imprimir um PDF de 300 páginas.", "ok": true, "porque": "O que mudou: um trabalho enorme logo antes de parar."}, {"p": "Os outros setores estão imprimindo?", "r": "O RH está imprimindo normal, na impressora deles.", "ok": true, "porque": "Delimita o problema: é a fila desta impressora, não o servidor todo."}, {"p": "Vocês já trocaram o toner?", "r": "A impressora diz que está pronta...", "ok": false, "porque": "Leia o sintoma: a impressora está pronta, o problema é a fila."}, {"p": "Pode pedir para todo mundo reiniciar o computador?", "r": "São 6 pessoas no meio do fechamento...", "ok": false, "porque": "A fila fica no servidor de impressão; reiniciar os PCs não resolve e atrapalha todo mundo."}, {"p": "Por que vocês deixam para imprimir em cima da hora?", "r": "...", "ok": false, "porque": "Julgar o usuário não resolve nada e piora o atendimento."}], "terminal": {"onde": "PowerShell conectado ao servidor de impressão PRINT01.", "prompt": "PS C:\\Suporte> (PRINT01)", "cmds": [{"c": "Get-PrintJob -PrinterName FIN-MFP01", "a": ["get-printjob"], "out": "Id    ComputerName  PrinterName  DocumentName            SubmittedTime        JobStatus\n--    ------------  -----------  ------------            -------------        ---------\n112   PC-FIN-03     FIN-MFP01    relatorio_anual.pdf     11/11/2026 08:58:41  Error, Printing\n113   PC-FIN-01     FIN-MFP01    boletos_novembro.pdf    11/11/2026 09:02:10  \n114   PC-FIN-05     FIN-MFP01    nf_4471.pdf             11/11/2026 09:05:33  \n115   PC-FIN-01     FIN-MFP01    boletos_novembro.pdf    11/11/2026 09:12:57  \n(+9 trabalhos na fila)"}, {"c": "Get-Printer -Name FIN-MFP01 | Format-List Name,PrinterStatus,PortName", "a": ["get-printer", "get-printer -name fin-mfp01"], "out": "Name          : FIN-MFP01\nPrinterStatus : Normal\nPortName      : IP_10.20.6.40"}, {"c": "ping 10.20.6.40", "out": "Pinging 10.20.6.40 with 32 bytes of data:\nReply from 10.20.6.40: bytes=32 time<1ms TTL=64\nReply from 10.20.6.40: bytes=32 time<1ms TTL=64\nReply from 10.20.6.40: bytes=32 time<1ms TTL=64\nReply from 10.20.6.40: bytes=32 time<1ms TTL=64"}, {"c": "Get-Service Spooler", "out": "Status   Name     DisplayName\n------   ----     -----------\nRunning  Spooler  Print Spooler"}], "dica": "Quem está na frente da fila, e com qual estado?"}, "diag": {"p": "Qual é a causa?", "ops": ["O trabalho 112 (o PDF de 300 páginas) travou com erro e segura a fila; a impressora e a rede estão ok", "A impressora quebrou e precisa de conserto", "O cabo de rede da impressora está solto", "O serviço Spooler está parado"], "porque": "A impressora responde ao ping e está Normal, o Spooler está rodando, mas o primeiro trabalho está em 'Error, Printing' desde 08:58 e todos os outros esperam atrás dele."}, "acao": {"p": "O que fazer, com o prazo das 11h?", "ops": ["Remover o trabalho 112, reiniciar o Spooler no PRINT01 se a fila não andar, confirmar que os boletos saíram e combinar com o Rafael reenviar o PDF em partes", "Abrir chamado com o fornecedor para trocar a impressora", "Apagar as filas de todas as impressoras da empresa", "Pedir para cada pessoa reinstalar a impressora"], "porque": "Tirar o trabalho travado libera a fila. Reiniciar o Spooler do servidor é o passo seguinte se precisar (avise antes: afeta as filas do servidor). Os outros setores não têm nada a ver com isso."}, "nota": {"itens": [["O escopo (setor Financeiro)", "financeiro|finance|setor|department|team"], ["A causa (trabalho travado)", "travad|stuck|112|pdf|job"], ["A ação (remover / Spooler)", "spooler|remov|delet|restart|reinici"], ["Confirmação", "confirm|test|imprim|printing|printed|ok"]], "modelo": "Finance team (6 users) unable to print to FIN-MFP01 since ~09:00. Deadline 11:00 for payment slips.\nPrinter online (ping OK, status Normal), Spooler running on PRINT01.\nGet-PrintJob: job 112 (relatorio_anual.pdf, 300 pages, PC-FIN-03) in 'Error, Printing', blocking 12 jobs.\nRemoved job 112; queue resumed. Spooler restart not required.\nConfirmed with Fernanda: payment slips printed 09:41. Asked user to resend the large PDF in parts. Resolved."}}, {"id": "INC0041244", "nivel": 2, "titulo": "Notebook muito lento há 3 dias", "canal": "Portal", "quem": "Patrícia Gomes", "setor": "Jurídico", "hora": "11:05", "topicos": ["trouble"], "msg": "Meu notebook está muito lento há uns 3 dias. Demora uns 5 minutos para abrir o Word e às vezes trava salvando os contratos.", "triagem": {"tipo": "Incidente", "cat": "Computador e desempenho", "impacto": 1, "urgencia": 2, "porque": "Uma pessoa, que consegue trabalhar, só que devagar (urgência média): P4."}, "perguntas": [{"p": "Começou depois de alguma coisa? Instalou algo, baixou arquivos grandes?", "r": "Hmm... baixei as gravações das audiências para revisar. Uns vídeos bem grandes.", "ok": true, "porque": "\"O que mudou\" mais uma vez: arquivos grandes enchem o disco."}, {"p": "Fica lento o tempo todo ou só em alguns programas?", "r": "Tudo. Até abrir uma pasta demora.", "ok": true, "porque": "Lento em tudo aponta para recurso do sistema (disco, memória), não para um programa."}, {"p": "Aparece algum aviso de pouco espaço no disco?", "r": "Agora que você falou, o disco C: está com a barra vermelha.", "ok": true, "porque": "Barra vermelha = disco quase cheio. O Windows fica lento sem espaço livre."}, {"p": "Quer que eu peça um notebook novo?", "r": "Esse tem um ano só...", "ok": false, "porque": "Trocar equipamento sem diagnóstico é desperdício."}, {"p": "Você deixa o notebook ligado à noite? Isso estraga.", "r": "Às vezes deixo...", "ok": false, "porque": "Não é verdade e não ajuda no diagnóstico."}, {"p": "Me passa sua senha para eu entrar à noite e ver com calma?", "r": "Pode ser?", "ok": false, "porque": "Nunca peça senha. Acesso remoto é com a pessoa presente e autorizando."}], "terminal": {"onde": "Sessão remota (Quick Assist) no notebook da Patrícia, com o PowerShell aberto.", "prompt": "PS C:\\Users\\patricia.gomes>", "cmds": [{"c": "Get-PSDrive C", "out": "Name    Used (GB)    Free (GB) Provider      Root\n----    ---------    --------- --------      ----\nC          236,41         1,22 FileSystem    C:\\"}, {"c": "Get-ChildItem $HOME\\Downloads | Measure-Object Length -Sum", "a": ["get-childitem downloads", "get-childitem $home\\downloads"], "out": "Count    : 214\nSum      : 163208452096   (≈ 152 GB)\nProperty : Length"}, {"c": "Get-Process | Sort-Object CPU -Descending | Select-Object -First 5 Name,CPU", "a": ["get-process"], "out": "Name            CPU\n----            ---\nTeams        412,55\nWINWORD      198,02\nMsMpEng      120,77\nexplorer      88,13\nOUTLOOK       75,40"}], "dica": "Quanto espaço livre sobrou no C:? E o que está ocupando?"}, "diag": {"p": "Qual é a causa da lentidão?", "ops": ["O disco C: está quase cheio (1,2 GB livres), por causa de cerca de 152 GB de vídeos em Downloads", "Um vírus usando toda a CPU", "O Word está corrompido", "A memória RAM queimou"], "porque": "Só 1,2 GB livres de 237 GB. O Windows precisa de espaço para arquivos temporários e memória virtual. Os processos são os normais (Teams, Word, Defender), sem nada estranho."}, "acao": {"p": "O que fazer?", "ops": ["Com a usuária, mover os vídeos para o local aprovado (SharePoint ou pasta de rede do Jurídico), limpar os temporários e confirmar o desempenho", "Apagar a pasta Downloads dela sem perguntar", "Trocar o notebook", "Desinstalar o antivírus para liberar espaço"], "porque": "Os vídeos são material de trabalho: decida com ela onde guardar. Apagar sem perguntar pode perder provas de um processo."}, "nota": {"itens": [["A causa (disco cheio)", "disco|disk|espa|space|1[,.]2"], ["A origem (vídeos em Downloads)", "download|vídeo|video|grava|recording"], ["A ação feita com a usuária", "mov|onedrive|sharepoint|limp|clean|pasta de rede|network share"], ["O resultado", "livre|free|test|confirm|rápid|normal|performance"]], "modelo": "User reported slow laptop for 3 days (Word takes ~5 min to open).\nGet-PSDrive C: 1.2 GB free of 237 GB. Downloads folder: 214 files, ~152 GB (court hearing recordings).\nNo unusual processes (Teams, Word, Defender at top).\nWith user's agreement, moved recordings to the Legal SharePoint library and cleared temp files. Free space now 158 GB.\nTested: Word opens in seconds, saving works. Resolved."}}, {"id": "INC0041251", "nivel": 2, "titulo": "Cliquei num link e digitei a senha", "canal": "Telefone", "quem": "Lucas Prado", "setor": "Compras", "hora": "09:52", "topicos": ["atend", "contas", "phishing"], "msg": "Oi, acho que fiz besteira. Chegou um e-mail da \"Microsoft\" dizendo que minha caixa ia ser desativada. Cliquei, abriu uma página igualzinha à da Microsoft e eu coloquei minha senha. Depois ficou carregando e não aconteceu nada. Foi há uns 20 minutos.", "triagem": {"tipo": "Incidente", "cat": "Segurança", "impacto": 2, "urgencia": 3, "porque": "Incidente de segurança: uma conta comprometida dá acesso aos e-mails e dados da empresa e pode mandar golpes para outros (impacto maior que uma pessoa). Cada minuto conta: P2."}, "perguntas": [{"p": "Você ainda tem o e-mail? Não clique de novo: me diga só o remetente e o endereço do link.", "r": "De: \"Microsoft 365\" <no-reply@m365-mailbox-verify.com>. O link era login.m365-mailbox-verify.com/...", "ok": true, "porque": "Remetente e domínio do link são os IOCs que a Segurança vai usar para bloquear e procurar outras vítimas."}, {"p": "Depois de digitar a senha, você aprovou algum pedido no Authenticator?", "r": "Apareceu uma notificação e eu aprovei... achei que era da página.", "ok": true, "porque": "Com o MFA aprovado, o atacante provavelmente já entrou na conta."}, {"p": "Você usa essa mesma senha em outro sistema?", "r": "Uso a mesma no portal de fornecedores...", "ok": true, "porque": "Senha repetida = outro sistema em risco. Tem que trocar lá também."}, {"p": "Por que você clicou? Não fez o treinamento?", "r": "Fiz... me desculpa.", "ok": false, "porque": "Culpar o usuário faz as pessoas esconderem o próximo incidente. Ele fez o certo ao ligar rápido."}, {"p": "Pode encaminhar o e-mail para todo o setor como alerta?", "r": "Mando agora!", "ok": false, "porque": "Encaminhar espalha o link malicioso. O aviso é feito pela Segurança, do jeito certo."}, {"p": "Pode abrir o link de novo para eu ver a página?", "r": "Abro sim...", "ok": false, "porque": "Nunca peça para abrir de novo. A análise é feita pela Segurança, em ambiente isolado."}], "terminal": {"onde": "PowerShell com Microsoft Graph e Exchange Online (só leitura: quem age é a Segurança).", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "Get-MgAuditLogSignIn -Filter \"userPrincipalName eq 'lucas.prado@empresa.com'\" -Top 4 | Format-Table CreatedDateTime,IpAddress,City,Country,Status", "a": ["get-mgauditlogsignin"], "out": "CreatedDateTime      IpAddress       City        Country  Status\n---------------      ---------       ----        -------  ------\n11/11/2026 09:33:02  198.51.100.77   Amsterdam   NL       Success (MFA satisfied)\n11/11/2026 09:31:40  198.51.100.77   Amsterdam   NL       Success (MFA satisfied)\n11/11/2026 08:12:15  10.20.7.21      São Paulo   BR       Success\n10/11/2026 17:58:03  10.20.7.21      São Paulo   BR       Success"}, {"c": "Get-InboxRule -Mailbox lucas.prado | Format-List Name,Enabled,Description", "a": ["get-inboxrule", "get-inboxrule -mailbox lucas.prado"], "out": "Name        : .\nEnabled     : True\nDescription : If the message includes 'fatura' or 'pagamento' or 'boleto' in the subject\n              move the message to folder 'RSS Feeds' and mark the message as read"}], "dica": "Algum login fora do normal depois das 9h30? Alguma regra estranha na caixa de entrada?"}, "diag": {"p": "O que os dados mostram?", "ops": ["A conta foi comprometida: login de Amsterdam com MFA aprovado e uma regra escondendo e-mails de pagamento", "Nada aconteceu: a página só ficou carregando", "Só a senha vazou, mas o MFA protegeu a conta", "É um problema de licença do Exchange"], "porque": "Logins com sucesso de 198.51.100.77 (Holanda) às 09:31, minutos depois do clique, com o MFA que ele aprovou. A regra chamada '.' que move e-mails de fatura e pagamento para 'RSS Feeds' é um sinal clássico de golpe de pagamento (BEC)."}, "acao": {"p": "O que fazer?", "ops": ["Acionar a Segurança (SOC) na hora como incidente e seguir o processo: resetar a senha, revogar as sessões, preservar e remover a regra, e orientar a troca da senha repetida no portal de fornecedores", "Só trocar a senha e fechar o chamado", "Apagar o e-mail da caixa dele e fechar como resolvido", "Esperar o SOC perceber sozinho"], "porque": "Conta comprometida é incidente de segurança: o SOC precisa saber já (pode haver outras vítimas e golpes saindo dessa conta). Trocar só a senha não derruba as sessões abertas do atacante, e a regra continuaria escondendo e-mails."}, "nota": {"itens": [["Escalado para a Segurança / SOC", "soc|seguran|security|escal"], ["A evidência (login suspeito / IP)", "198\\.51\\.100\\.77|amsterdam|holanda|netherlands|\\bnl\\b|ip"], ["A regra da caixa de entrada", "regra|rule|inbox"], ["Contenção (senha e sessões)", "senha|password|sess|revog|revoke|reset"]], "modelo": "User entered credentials on phishing page (sender no-reply@m365-mailbox-verify.com, link login.m365-mailbox-verify.com) at ~09:30 and approved an MFA prompt.\nSign-in logs: successful sign-ins from 198.51.100.77 (Amsterdam, NL) at 09:31 and 09:33, MFA satisfied.\nSuspicious inbox rule '.' moving messages with 'fatura/pagamento/boleto' to RSS Feeds.\nEscalated immediately to SOC as security incident (P2). Per SOC: password reset, all sessions revoked, inbox rule exported and removed.\nUser advised to change the same password on the supplier portal. Ticket linked to SOC case."}}, {"id": "INC0041271", "nivel": 2, "titulo": "Caixa de e-mail cheia, não posso apagar nada", "canal": "E-mail", "quem": "Sandra Melo", "setor": "Diretoria", "hora": "13:10", "topicos": ["contas"], "msg": "Não estou conseguindo enviar e-mails, aparece que minha caixa está cheia. Eu guardo tudo, não posso apagar nada: tem o histórico de 10 anos da diretoria!", "triagem": {"tipo": "Incidente", "cat": "E-mail e Microsoft 365", "impacto": 1, "urgencia": 3, "porque": "Ela não consegue enviar e-mails (urgência alta), mas é uma pessoa: P3. (Algumas empresas sobem um nível para a Diretoria; siga a regra escrita.)"}, "perguntas": [{"p": "Que mensagem aparece exatamente quando você envia?", "r": "\"Sua caixa de correio está cheia. Talvez você não possa enviar ou receber itens.\"", "ok": true, "porque": "Confirma que é o limite da caixa, e não outro erro de envio."}, {"p": "Tem alguma pasta com muitos anexos que você só guarda, mas não usa no dia a dia?", "r": "A pasta \"Apresentações\", com tudo que a diretoria já mandou.", "ok": true, "porque": "Identifica o que pode ir para o arquivo sem atrapalhar o dia a dia."}, {"p": "Você precisa acessar os e-mails antigos com frequência ou só de vez em quando?", "r": "Só de vez em quando, para consultar algo.", "ok": true, "porque": "E-mail antigo e pouco usado é o candidato perfeito para o Arquivo Morto Online."}, {"p": "Posso apagar os e-mails de 2016 para trás?", "r": "Não! Eu disse que não pode apagar nada!", "ok": false, "porque": "Ela já disse que não pode apagar. E pode haver regra de retenção da empresa."}, {"p": "Por que você guarda tudo?", "r": "Porque a diretoria me pede.", "ok": false, "porque": "Julgamento não resolve. Existe solução sem apagar."}, {"p": "Quer que eu crie uma segunda conta de e-mail para você?", "r": "E eu vou ter que ver duas caixas?", "ok": false, "porque": "Duas contas para a mesma pessoa complicam e não seguem a política."}], "terminal": {"onde": "PowerShell conectado ao Exchange Online.", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "Get-EXOMailboxStatistics sandra.melo | Format-List DisplayName,TotalItemSize,ItemCount", "a": ["get-exomailboxstatistics sandra.melo", "get-exomailboxstatistics"], "out": "DisplayName   : Sandra Melo\nTotalItemSize : 49.82 GB (53,493,458,944 bytes)\nItemCount     : 187402"}, {"c": "Get-EXOMailbox sandra.melo -Properties ProhibitSendQuota,ArchiveStatus | Format-List ProhibitSendQuota,ArchiveStatus", "a": ["get-exomailbox sandra.melo", "get-exomailbox"], "out": "ProhibitSendQuota : 49.5 GB (53,150,220,288 bytes)\nArchiveStatus     : None"}, {"c": "Get-EXOMailboxFolderStatistics sandra.melo | Sort-Object FolderSize -Descending | Select-Object -First 3 Name,FolderSize", "a": ["get-exomailboxfolderstatistics sandra.melo", "get-exomailboxfolderstatistics"], "out": "Name              FolderSize\n----              ----------\nApresentações     21.3 GB\nItens Enviados    12.1 GB\nCaixa de Entrada   9.8 GB"}], "dica": "Compare o tamanho da caixa com o limite de envio. O arquivo online está ligado?"}, "diag": {"p": "O que os dados mostram?", "ops": ["A caixa passou do limite de envio (49,82 GB de 49,5 GB), o arquivo online não está ativo, e a pasta Apresentações tem 21,3 GB", "A licença dela venceu", "O servidor do Exchange está fora do ar", "A conta dela foi invadida"], "porque": "TotalItemSize passou do ProhibitSendQuota: o Exchange bloqueia o envio. ArchiveStatus None mostra que ela não tem arquivo online para onde mover os itens antigos."}, "acao": {"p": "Qual é a solução, sem apagar nada?", "ops": ["Ativar o Arquivo Morto Online (se a licença permitir), aplicar a política para mover itens antigos e ajudar a mover a pasta Apresentações, sem apagar nada", "Apagar os e-mails mais antigos para liberar espaço", "Aumentar o limite da caixa para 500 GB", "Criar uma segunda caixa de e-mail para ela"], "porque": "O Arquivo Morto Online é uma caixa extra, no mesmo Outlook, para itens antigos. Nada é apagado. O limite da caixa principal não pode ser aumentado à vontade: depende da licença."}, "nota": {"itens": [["A causa (limite de envio)", "49|limite|quota|cheia|full"], ["Arquivo online ativado", "archive|arquivo|arquivamento"], ["Nada apagado / combinado com ela", "sem apagar|nada apagado|nada foi apagado|no data deleted|nothing deleted|no items deleted|acordo|agreed|com a usu"], ["Teste de envio", "test|envio|enviou|send|sent|confirm"]], "modelo": "User unable to send email: 'mailbox full'.\nMailbox size 49.82 GB, ProhibitSendQuota 49.5 GB, ArchiveStatus None. Largest folder 'Apresentações' 21.3 GB.\nUser requires all mail to be kept (no deletion).\nEnabled In-Place Archive (licence includes archiving) and applied the default 2-year archive policy. With the user, moved 'Apresentações' to the archive. No items deleted.\nMailbox now 26.1 GB. Tested: user sent and received a test email. Resolved."}}, {"id": "RITM0018871", "nivel": 2, "titulo": "Funcionário novo começa segunda", "canal": "E-mail", "quem": "Larissa (RH)", "setor": "RH", "hora": "15:30", "topicos": ["contas", "sd"], "msg": "Olá, TI! O Gabriel Rocha começa na segunda (17/11) como Analista de Logística. Ele precisa de notebook, conta, e-mail, acesso ao ERP (perfil Logística) e à pasta da Logística. O gestor é o Sérgio Antunes. Obrigada!", "triagem": {"tipo": "Requisição de serviço", "cat": "Conta e acesso", "impacto": 1, "urgencia": 2, "porque": "Pedido padrão de entrada de funcionário (requisição), para uma pessoa, com data marcada: P4. O importante é cumprir o prazo de segunda."}, "perguntas": [{"p": "O Sérgio aprovou os acessos (ERP perfil Logística e pasta)? Pode responder neste chamado?", "r": "Sérgio Antunes responde no chamado: \"Aprovado.\"", "ok": true, "porque": "Acesso a sistemas e pastas precisa de aprovação do gestor, registrada."}, {"p": "O Gabriel substitui alguém? Existe um modelo de acessos para o cargo?", "r": "Ele entra no lugar da Tatiane, que saiu mês passado. Pode usar o mesmo perfil de Analista de Logística.", "ok": true, "porque": "Um modelo (o cargo anterior) ajuda a dar exatamente os acessos do cargo, nem mais nem menos."}, {"p": "Que horas ele chega na segunda e onde vai sentar?", "r": "Às 9h, no 2º andar, mesa 14.", "ok": true, "porque": "Planejar a entrega garante que ele trabalhe já no primeiro dia."}, {"p": "Posso reativar a conta da Tatiane e passar para ele?", "r": "Pode ser assim?", "ok": false, "porque": "Cada pessoa tem sua conta. Reusar a conta de outra pessoa mistura os históricos e quebra a auditoria."}, {"p": "Posso copiar todos os grupos do Sérgio para o Gabriel?", "r": "O Sérgio é o gestor, tem acesso a tudo...", "ok": false, "porque": "O gestor tem acessos de gestor. Copiar dá ao Gabriel mais do que o cargo precisa."}, {"p": "Dou administrador no notebook para ele instalar o que precisar?", "r": "Ele é da Logística, nem sei...", "ok": false, "porque": "Menor privilégio: o notebook vai com os programas padrão do cargo."}], "terminal": {"onde": "PowerShell com os módulos do Active Directory e do Microsoft Graph.", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "Get-ADUser -Filter \"Name -like 'Tatiane*'\" -Properties Enabled,MemberOf | Format-List Name,Enabled,MemberOf", "a": ["get-aduser tatiane", "get-aduser -filter"], "out": "Name     : Tatiane Borges\nEnabled  : False\nMemberOf : {CN=GG-Logistica-RW,OU=Grupos,DC=empresa,DC=local,\n            CN=GG-ERP-Logistica,OU=Grupos,DC=empresa,DC=local,\n            CN=GG-VPN-Usuarios,OU=Grupos,DC=empresa,DC=local}"}, {"c": "Get-MgSubscribedSku | Format-Table SkuPartNumber,ConsumedUnits,@{n='Total';e={$_.PrepaidUnits.Enabled}}", "a": ["get-mgsubscribedsku"], "out": "SkuPartNumber  ConsumedUnits  Total\n-------------  -------------  -----\nSPE_E3         248            250\nPOWER_BI_PRO   12             15"}, {"c": "Get-ADOrganizationalUnit -Filter \"Name -like 'Log*'\" | Select-Object DistinguishedName", "a": ["get-adorganizationalunit"], "out": "DistinguishedName\n-----------------\nOU=Logistica,OU=Usuarios,DC=empresa,DC=local"}], "dica": "Quais grupos o cargo usa? Há licença sobrando? Em qual OU a conta deve nascer?"}, "diag": {"p": "O que você precisa para criar o acesso?", "ops": ["Os grupos do cargo são GG-Logistica-RW, GG-ERP-Logistica e GG-VPN-Usuarios, há 2 licenças E3 livres, e a conta vai na OU Logistica", "Não há licenças disponíveis, é preciso comprar antes", "A conta da Tatiane ainda está ativa e pode ser usada", "Ele precisa estar no grupo Domain Admins para usar o ERP"], "porque": "A conta antiga (desativada) mostra os grupos do cargo. 248 de 250 licenças E3 usadas: sobram 2. A OU Logistica aplica as políticas certas."}, "acao": {"p": "Qual é lha na autenticação: usuário ou senha inválidos.\"", "ok": true, "porque": "A mensagem aponta para credencial, não para rede."}, {"p": "Quando você trocou a senha pela última vez? Recebeu algum aviso?", "r": "Faz tempo... recebi uns avisos de senha expirando semana passada, mas fui deixando.", "ok": true, "porque": "Avisos de expiração ignorados são a pista principal."}, {"p": "A internet da sua casa está funcionando?", "r": "Sim, estou no Teams pelo celular e o Outlook web abre no notebook.", "ok": true, "porque": "Descarta a internet dele."}, {"p": "Me fala a sua senha para eu testar daqui?", "r": "Hmm, é a mesma de sempre...", "ok": false, "porque": "Nunca peça senha."}, {"p": "Quer que eu libere o ERP direto na internet, sem VPN?", "r": "Seria ótimo!", "ok": false, "porque": "Expor um sistema interno para resolver o problema de uma pessoa é um risco enorme."}, {"p": "Você já reiniciou o roteador da empresa?", "r": "Mas eu estou em casa...", "ok": false, "porque": "Leia o chamado: ele está em home office e outros usam a VPN normalmente."}], "terminal": {"onde": "PowerShell no seu computador de suporte, com o módulo do Active Directory.", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "Get-ADUser thiago.ramos -Properties PasswordExpired,PasswordLastSet,LockedOut,Enabled | Format-List Name,Enabled,LockedOut,PasswordExpired,PasswordLastSet", "a": ["get-aduser thiago.ramos", "get-aduser thiago.ramos -properties *"], "out": "Name            : Thiago Ramos\nEnabled         : True\nLockedOut       : False\nPasswordExpired : True\nPasswordLastSet : 12/08/2026 08:01:44"}, {"c": "net user thiago.ramos /domain", "out": "User name                    thiago.ramos\nAccount active               Yes\nPassword last set            12/08/2026 08:01:44\nPassword expires             10/11/2026 08:01:44\nThe command completed successfully."}], "dica": "Olhe a data em que a senha expira."}, "diag": {"p": "Por que a VPN recusa e o Outlook web aceita?", "ops": ["A senha do AD expirou ontem; a VPN valida no AD e recusa, enquanto o login na nuvem ainda aceita a senha antiga", "O servidor de VPN caiu para todos", "A conta dele está bloqueada", "O notebook dele está com vírus"], "porque": "PasswordExpired True, expirou em 10/11. A VPN autentica no Active Directory, que recusa senha expirada. Em ambientes híbridos, a nuvem pode continuar aceitando a senha sincronizada por um tempo: por isso o Outlook web funciona."}, "acao": {"p": "O que fazer?", "ops": ["Confirmar a identidade, orientar a troca de senha pelo portal (SSPR) ou resetar exigindo troca no próximo login, testar a VPN e lembrar de atualizar a senha no celular", "Escalar para Redes: o servidor de VPN está com problema", "Marcar a senha dele para nunca expirar", "Reinstalar o cliente da VPN"], "porque": "Trocar a senha resolve a causa. 'Nunca expira' fere a política. E atualizar o celular evita o próximo chamado: conta bloqueada pela senha antiga."}, "nota": {"itens": [["A causa (senha expirada)", "expir"], ["Identidade verificada", "identi|verific|callback|on file"], ["A troca de senha", "sspr|troc|reset|change|changed|alter"], ["Teste da VPN", "test|confirm|conect|connect"]], "modelo": "User (home office) unable to connect to VPN: 'authentication failed'. Outlook on the web working.\nIdentity verified by callback to registered number.\nGet-ADUser: PasswordExpired=True, password expired 10/11/2026 (expiry warnings ignored).\nGuided user through password change via SSPR portal.\nTested: VPN connected, ERP accessible. Reminded user to update the password on his phone mail app. Resolved."}}, {"id": "INC0041260", "nivel": 3, "titulo": "Ninguém consegue usar o ERP", "canal": "Vários", "quem": "Vários usuários", "setor": "Vendas, Financeiro, Logística", "hora": "08:52", "topicos": ["sd", "trouble"], "msg": "08:52 Juliana (Vendas): \"O ERP não abre, dá erro de conexão.\"\n08:55 Rafael (Financeiro): \"ERP fora do ar?\"\n08:57 Sônia (Logística): \"Não consigo emitir nota fiscal no ERP!\"\n08:58 a 09:01: mais 5 chamados iguais.", "triagem": {"tipo": "Incidente", "cat": "Software e sistemas", "impacto": 3, "urgencia": 3, "porque": "O sistema principal da empresa está parado para vários setores, sem emitir nota fiscal: impacto alto e urgência alta, P1 (incidente grave)."}, "perguntas": [{"p": "Qual é o erro exato que aparece?", "r": "\"Não foi possível conectar ao servidor erp.empresa.local:443.\"", "ok": true, "porque": "O erro aponta o servidor e a porta: ajuda a dirigir os testes."}, {"p": "Os outros sistemas (e-mail, internet, pastas) funcionam?", "r": "Sim, tudo funciona, só o ERP não.", "ok": true, "porque": "Só o ERP = não é a rede em geral; foco no ERP."}, {"p": "Desde que horas? Funcionava antes?", "r": "Às 8h40 eu estava usando. Começou umas 8h50.", "ok": true, "porque": "O horário de início ajuda o time técnico a achar a causa (uma atualização? um backup?)."}, {"p": "Vocês podem tentar de novo amanhã?", "r": "Amanhã?! A gente precisa faturar hoje!", "ok": false, "porque": "Um P1 não espera."}, {"p": "Cada um pode reinstalar o ERP no computador?", "r": "São 8 pessoas...", "ok": false, "porque": "Quando todos param ao mesmo tempo, o problema é central. Reinstalar nos PCs não resolve."}, {"p": "Quem foi o último a usar? Pode ter sido ele que quebrou.", "r": "Como assim? Todo mundo usa o tempo todo.", "ok": false, "porque": "Procurar culpado não ajuda e gera conflito."}], "terminal": {"onde": "PowerShell no seu computador de suporte.", "prompt": "PS C:\\Suporte>", "cmds": [{"c": "nslookup erp.empresa.local", "out": "Server:  dc01.empresa.local\nAddress:  10.20.0.10\n\nName:    erp.empresa.local\nAddress:  10.20.8.15"}, {"c": "ping erp.empresa.local", "a": ["ping 10.20.8.15"], "out": "Pinging erp.empresa.local [10.20.8.15] with 32 bytes of data:\nReply from 10.20.8.15: bytes=32 time=1ms TTL=127\nReply from 10.20.8.15: bytes=32 time=1ms TTL=127\nReply from 10.20.8.15: bytes=32 time=1ms TTL=127\nReply from 10.20.8.15: bytes=32 time=1ms TTL=127"}, {"c": "Test-NetConnection erp.empresa.local -Port 443", "a": ["test-netconnection erp.empresa.local", "tnc erp.empresa.local -port 443"], "out": "WARNING: TCP connect to (10.20.8.15 : 443) failed\n\nComputerName     : erp.empresa.local\nRemoteAddress    : 10.20.8.15\nRemotePort       : 443\nPingSucceeded    : True\nTcpTestSucceeded : False"}, {"c": "Get-Service -ComputerName ERP01 -Name ErpAppService", "a": ["get-service -computername erp01", "get-service erpappservice"], "out": "Get-Service : Cannot open Service Control Manager on computer 'ERP01'.\nThis operation might require other privileges.\n    + CategoryInfo          : NotSpecified: (:) [Get-Service], InvalidOperationException"}], "dica": "Teste em camadas: o nome resolve? O servidor responde? E a porta do serviço?"}, "diag": {"p": "O que os testes mostram?", "ops": ["O servidor responde (DNS e ping ok), mas a porta 443 do ERP não: o serviço do ERP no servidor parou ou travou", "A rede da empresa caiu", "O DNS está errado em todos os computadores", "Os usuários estão digitando a senha errada"], "porque": "DNS e ping funcionam, então a rede e o servidor estão de pé. TcpTestSucceeded False na 443 = a aplicação não está escutando. E o N1 não tem permissão no servidor (acesso negado ao Service Control Manager), o que é normal."}, "acao": {"p": "O que fazer?", "ops": ["Abrir um incidente grave (P1), ligar os 8 chamados a ele, escalar para o time de Sistemas com os testes, avisar a coordenação e comunicar os usuários", "Atender cada chamado separado e pedir para reiniciarem o PC", "Pedir a senha de administrador do ERP01 a um colega e reiniciar o servidor", "Esperar mais chamados para ter certeza"], "porque": "Muitos afetados = incidente grave: um chamado principal, os outros ligados a ele, escalonamento funcional (Sistemas) e hierárquico (coordenação), e comunicação. Mexer num servidor sem acesso nem mudança aprovada pode piorar."}, "nota": {"itens": [["Incidente grave / P1", "p1|grave|major|crít|crit"], ["Chamados ligados", "liga function tkDiag(){const c=TKC,T=c.t.terminal;let h=`<div class="card"><div class="q">3. Diagnóstico</div><p class="mu">${esc(T.onde)} Clique num comando ou digite (help mostra a lista).</p><div class="tkchips">${T.cmds.map((x,k)=>`<button class="tkchip" data-run="${k}">${esc(x.c)}</button>`).join("")}</div>

if(!c.ran)return h+`<p class="mu">Rode pelo menos um comando para liberar a pergunta do diagnóstico.</p></div>`;
h+=tkMC("diag",3,"Diagnóstico",c.t.diag)+`</div>`;if(c.diag.pick!=null)h+=tkNext("Próximo: solução →");return h}
function tkAcao(){const c=TKC;let h=`<div class="card"><div class="q">4. Solução</div><p class="mu">Você já sabe a causa. Decida o que fazer: resolver no N1, escalar ou acionar a Segurança.</p>`+tkMC("acao",4,"Solução",c.t.acao)+`</div>`;if(c.acao.pick!=null)h+=tkNext("Próximo: nota do ticket →");return h}
function tkNota(){const c=TKC,N=c.t.nota;let h=`<div class="card"><div class="q">5. Nota do ticket</div><p class="mu">Escreva a nota de resolução, como no sistema de tickets: sintoma, o que verificou, a causa, o que fez e o resultado. Pode ser em português ou em inglês (em muitas empresas é em inglês).</p>`;
if(c.pts[4]==null)return h+`<textarea id="tknt" rows="8" placeholder="Sintoma:\nO que verifiquei:\nCausa:\nO que fiz:\nResultado:">${esc(c.nota.txt)}</textarea><p class="mu" id="tkntm" style="margin:6px 0 0">A correção procura ${N.itens.length} itens na sua nota.</p><div class="row"><button class="btn p" id="ntok">Registrar a nota</button></div></div>`;
h+=`<pre class="lg mine">${esc(c.nota.txt)}</pre><div class="sdchk">${N.itens.map((x,k)=>`<div class="${c.nota.hit[k]?"g":"r"}">${c.nota.hit[k]?"✅":"❌"} ${esc(x[0])}</div>`).join("")}</div><h3 style="margin:16px 0 6px;font-size:15px">Nota de referência</h3><pre class="lg">${esc(N.modelo)}</pre><div class="row"><button class="btn" id="ntcp">Copiar a nota de referência</button></div></div>`+tkNext("Ver o resultado →");return h}
function tkFim(){const c=TKC,t=c.t,tot=Math.round(c.pts.reduce((a,x)=>a+x,0)),ok=tot>=70;
if(!c.saved){c.saved=1;S.sd=S.sd||{};const o=S.sd[t.id]||{b:0,n:0};S.sd[t.id]={b:Math.max(o.b,tot),n:o.n+1,u:tot};markToday("sd");sdTick();save()}
const nx=TK.find(x=>x.id!=t.id&&!tkOk(x.id));
let h=`<div class="card ${ok?"win":"lose"}"><div class="q">${ok?"✅ Chamado resolvido":"↩️ Chamado reaberto"}: ${tot} de 100</div><p class="mu">${ok?"Bom atendimento. A nota fica salva no seu progresso.":"Abaixo de 70 o chamado volta para a fila. Releia as explicações e tente de novo."}</p><div class="sdbars">${TK_STEPS.map((s,k)=>`<div><span>${s}</span><span class="bar"><i style="width:${100*c.pts[k]/TK_W[k]}%"></i></span><b>${Math.round(c.pts[k])}/${TK_W[k]}</b></div>`).join("")}</div></div>`;
const tp=t.topicos.map(id=>TOP.find(x=>x.id==id)).filter(Boolean);if(tp.length)h+=`<div class="card"><div class="q">Para estudar este chamado</div><div class="tkchips">${tp.map(x=>`<a class="tkchip" href="#${x.id}">${x.ic} ${esc(x.n)}</a>`).join("")}</div></div>`;
h+=`<div class="row">${nx?`<button class="btn p" id="tkgo">Próximo chamado: ${esc(nx.id)} →</button>`:""}<button class="btn" id="tkre">Refazer este</button><button class="btn" id="tkq">Voltar à fila</button></div>`;
setTimeout(()=>{if($("tkgo"))$("tkgo").onclick=()=>tkStart(nx);$("tkre").onclick=()=>tkStart(t);$("tkq").onclick=()=>{TKC=null;rSd();window.scrollTo(0,0)}});return h}
function tkBind(){const c=TKC,el=$("v9"),t=c.t;
el.querySelectorAll(".pills[data-f] .pill").forEach(b=>b.onclick=()=>{c.tri[b.parentNode.dataset.f]=b.dataset.v;tkRender()});
if($("trok"))$("trok").onclick=()=>{const r=c.tri,T=t.triagem,n=(r.tipo==T.tipo)+[].concat(T.cat).includes(r.cat)+(+r.imp==T.impacto)+(+r.urg==T.urgencia);c.pts[0]=TK_W[0]*n/4;tkRender()};
el.querySelectorAll("input[data-q]").forEach(x=>x.onchange=()=>{const k=+x.dataset.q,A=c.ask;if(x.checked){if(A.sel.length<3)A.sel.push(k)}else A.sel=A.sel.filter(y=>y!=k);tkRender()});
if($("askok"))$("askok").onclick=()=>{const P=t.perguntas,good=Math.min(3,P.filter(q=>q.ok).length),g=c.ask.sel.filter(k=>P[k].ok).length;c.pts[1]=TK_W[1]*Math.min(1,g/good);tkRender()};
el.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{tkRun(t.terminal.cmds[+b.dataset.run].c);tkRender();tkFocus()});
if($("tcmd"))$("tcmd").onkeydown=e=>{if(e.key=="Enter"){tkRun(e.target.value);tkRender();tkFocus()}};
el.querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{const key=b.dataset.mc,X=c[key],k=+b.dataset.k;X.pick=k;c.pts[key=="diag"?2:3]=X.opts[k][1]?TK_W[key=="diag"?2:3]:0;tkRender()});
if($("tknt"))$("tknt").oninput=e=>{c.nota.txt=e.target.value};
if($("ntok"))$("ntok").onclick=()=>{const v=$("tknt").value.trim();if(v.length<30){$("tkntm").textContent="Escreva um pouco mais: pelo menos o que verificou, o que fez e o resultado.";return}
c.nota.txt=v;const low=v.toLowerCase();c.nota.hit=t.nota.itens.map(x=>new RegExp(x[1],"i").test(low));c.pts[4]=TK_W[4]*c.nota.hit.filter(Boolean).length/t.nota.itens.length;tkRender()};
if($("ntcp"))$("ntcp").onclick=async()=>{try{await navigator.clipboard.writeText(t.nota.modelo);$("ntcp").textContent="Copiada"}catch(e){}}}
function tkFocus(){const i=$("tcmd"),o=$("tout");if(o)o.scrollTop=o.scrollHeight;if(i)i.focus({preventScroll:true})}
sdTick();
/* <<< curso */
rC();rT();$("s2").textContent=MQ.length;$("s3").textContent=TOP.length;if(!openHash()){goTab(7);welcome()}window.addEventListener("hashchange",openHash);
/* de volta do lab (outra aba): relê o progresso */
loadLab().then(refreshViews);window.addEventListener("focus",()=>loadLab().then(refreshViews));
/* o progresso deste navegador mudou (veio da nuvem, ou a conta saiu): relê e redesenha */
/* onde a pessoa está (vai junto com o feedback) */
window.soclabWhere=()=>{const on=[...document.querySelectorAll("main>div")].find(x=>!x.classList.contains("hide"));const n=on?+on.id.slice(1):7;if(n==4&&TP)return"Curso · "+TP.n+" · aba "+TS;if(n==9&&TKC)return"Curso · Chamados · "+TKC.t.id;return"Curso · "+(PHT[n]?PHT[n][0]:"Hoje")};
window.soclabReload=()=>{let o={};try{o=JSON.parse(localStorage.getItem("soclab-curso")||"{}")||{}}catch(e){}Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{done:{},known:{},notes:[]},o);S.miss=S.miss||{};S.hist=S.hist||[];S.tdone=S.tdone||{};S.apps=S.apps||[];rC();loadLab().then(refreshViews)};
</script>
