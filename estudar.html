{id:"wcli",n:"Windows CLI",ic:"⌨️",tags:["WinCLI"],chk:["Explicar o que é o CMD","Saber onde estou (cd) e o que tem aqui (dir)","Ver ocultos (dir /a) e procurar com dir /s","Navegar com cd e cd ..","Ler um arquivo com type","Usar whoami, hostname, systeminfo e ipconfig","Comparar os comandos de Linux e de Windows","Acertar 8 de 10 no quiz de Windows CLI"],st:`<p class="mu">O CMD (Prompt de Comando) é a linha de comando do Windows. Para abrir: tecla Windows, digite cmd e Enter.</p><h3>Onde estou e o que tem aqui</h3><ul><li><b>cd</b> (sem nada depois): mostra <b>a pasta em que você está</b>. No Linux isso é o pwd.</li><li><b>dir</b>: lista <b>o que tem</b> na pasta.</li><li><b>dir /a</b>: inclui os arquivos ocultos.</li></ul><h3>Andar e procurar</h3><ul><li><b>cd Documents</b>: entra na pasta Documents.</li><li><b>cd ..</b>: sobe um nível, para a pasta de cima.</li><li><b>dir /s nome-do-arquivo</b>: procura na pasta atual e em todas as subpastas e mostra o caminho completo do arquivo.</li></ul><h3>Ler um arquivo</h3><ul><li><b>type arquivo.txt</b>: mostra o conteúdo do arquivo.</li></ul><h3>Informações do sistema</h3><ul><li><b>whoami:</b> o usuário logado.</li><li><b>hostname:</b> o nome do computador.</li><li><b>systeminfo:</b> a versão do Windows e muitos detalhes do sistema.</li><li><b>ipconfig:</b> a configuração de rede: IP, máscara e gateway. Com <b>ipconfig /all</b> aparecem também o MAC (Endereço Físico), o DNS e o DHCP.</li></ul><p>Ligação com Redes: IP, gateway, DHCP, DNS e MAC, que você estudou, aparecem na saída do ipconfig /all.</p><h3>Linux x Windows</h3><table><tr><th>Quero...</th><th>Linux</th><th>Windows</th></tr><tr><td>Saber onde estou</td><td>pwd</td><td>cd</td></tr><tr><td>Ver o que tem aqui</td><td>ls</td><td>dir</td></tr><tr><td>Ver ocultos</td><td>ls -al</td><td>dir /a</td></tr><tr><td>Procurar arquivo</td><td>find</td><td>dir /s</td></tr><tr><td>Ler arquivo</td><td>cat</td><td>type</td></tr><tr><td>Meu usuário</td><td>whoami</td><td>whoami</td></tr><tr><td>Sistema</td><td>uname -a</td><td>systeminfo</td></tr><tr><td>Nome da máquina</td><td>hostname</td><td>hostname</td></tr></table><h3>No dia a dia de um SOC</h3><ul><li>Em um incidente, whoami, hostname e systeminfo identificam quem e qual máquina.</li><li>O ipconfig mostra o IP da máquina, que você cruza com os logs.</li><li>O systeminfo mostra a versão e as atualizações: sem patches, mais risco.</li><li>dir /a e dir /s ajudam a achar arquivos ocultos ou suspeitos.</li></ul><h3>Para completar</h3><ul><li><b>cls</b> limpa a tela. A seta para cima repete o comando anterior e a tecla Tab completa nomes.</li><li>Se o caminho tiver espaços, use aspas: cd "Program Files".</li><li><b>CMD x PowerShell:</b> o CMD é o antigo e mais simples. O PowerShell é mais poderoso e muito usado por administradores. Os dois aparecem em vagas.</li><li>Próximos comandos de rede: <b>ping</b> (testa se há resposta) e <b>nslookup</b> (testa o DNS).</li></ul><h3>Como explicar numa entrevista</h3><p><b>How would you find a computer’s IP address on Windows?</b><br><i>I open Command Prompt and run ipconfig. With ipconfig /all I can also see the DNS servers, the DHCP server and the MAC address.</i></p><p><b>How do you find out which user is logged in and which machine it is?</b><br><i>I run whoami for the user and hostname for the computer name. systeminfo gives me the Windows version and more details.</i></p>`},
{id:"segso",n:"Segurança do SO",ic:"🛡️",tags:["SegSO"],chk:["Explicar hardware, software e o papel do sistema operacional", "Explicar os tipos de SO (computador, celular, servidor e os dois)", "Explicar a tríade CIA com um exemplo de cada", "Explicar os 3 fatores de autenticação", "Explicar por que senhas fracas são perigosas e o que é uma boa senha", "Explicar o princípio do menor privilégio e permissões fracas", "Explicar programas maliciosos (Trojan, ransomware) e qual pilar da CIA atingem", "Explicar o que é SSH, a porta 22 e como ele autentica", "Acertar 8 de 10 no quiz de Segurança do SO","Explicar o laboratório prático (senha fraca, ls, cat, history)"],st:`<p class="mu">Segurança de SO é proteger o computador e o celular contra quem quer ler, alterar ou derrubar o que está neles.</p>
<h3>Hardware, software e sistema operacional</h3><ul><li><b>Hardware:</b> a parte física que dá para tocar. Tela, teclado, impressora, pendrive e a <b>placa-mãe (motherboard)</b>, onde todo o resto se conecta.</li><li><b>Software:</b> os programas, como Firefox, Chrome, WhatsApp e Telegram.</li><li><b>Sistema operacional (SO):</b> a camada entre o hardware e os programas. Os programas não rodam direto no hardware. O SO libera o acesso segundo regras.</li><li>O hardware sozinho não serve para rodar programas. Ele precisa do SO para ser controlado.</li></ul>
<table><tr><th>Tipo</th><th>Exemplos</th></tr><tr><td>Computador</td><td>Windows 11, macOS</td></tr><tr><td>Celular</td><td>Android, iOS</td></tr><tr><td>Servidor</td><td>Windows Server 2022, IBM AIX, Oracle Solaris</td></tr><tr><td>Computador e servidor</td><td>Linux</td></tr></table>
<h3>Por que proteger o SO</h3><p>O celular e o computador guardam conversas, fotos, e-mails, senhas salvas no navegador, apps de banco e cópias de documentos como RG ou passaporte. Quem abre o aparelho sem permissão acessa tudo isso.</p>
<h3>A tríade CIA</h3><table><tr><th>Pilar</th><th>Pergunta</th><th>Exemplo de ataque</th></tr><tr><td><b>Confidencialidade</b></td><td>Só quem deve vê?</td><td>Alguém lê suas mensagens ou fotos sem permissão</td></tr><tr><td><b>Integridade</b></td><td>Ninguém alterou?</td><td>Um arquivo é modificado sem você saber, guardado ou durante o envio pela rede</td></tr><tr><td><b>Disponibilidade</b></td><td>Funciona quando preciso?</td><td>Ransomware tranca seus arquivos, ou um ataque derruba o sistema</td></tr></table>
<p>No SOC, todo incidente é classificado assim: qual dos três pilares foi afetado.</p>
<h3>Fraqueza 1: autenticação e senhas fracas</h3><p><b>Autenticação</b> é provar quem você é, em um sistema local ou remoto. Existem 3 jeitos:</p><table><tr><th>Fator</th><th>Exemplo</th></tr><tr><td>Algo que você <b>sabe</b></td><td>Senha, PIN</td></tr><tr><td>Algo que você <b>é</b></td><td>Impressão digital, rosto</td></tr><tr><td>Algo que você <b>tem</b></td><td>Celular, token, chave de segurança</td></tr></table>
<ul><li>Usar <b>dois ou mais</b> fatores juntos é a <b>autenticação multifator (MFA)</b>. É uma das defesas mais eficazes.</li><li>Receber código por SMS conta como "algo que você tem", mas é o mais fraco dos métodos desse tipo. Um app autenticador ou chave física é mais seguro.</li></ul>
<p>A senha é a forma mais usada, então é a mais atacada. Os erros mais comuns:</p><ul><li>Senhas fáceis de adivinhar (123456, password, qwerty, 111111).</li><li>Usar a mesma senha em vários sites. Se um site vaza, o atacante testa a senha nos outros.</li><li>Usar dados pessoais, como data de nascimento ou nome do pet.</li><li>Palavras do dicionário (iloveyou, monkey, dragon).</li><li>Padrões do teclado (qwertyuiop, 1q2w3e4r5t). Parecem complexas, mas seguem o layout do teclado e os atacantes conhecem.</li><li>Trocar letras por números (p4ssw0rd). Os atacantes testam essas trocas primeiro, então quebra rápido.</li></ul>
<p>O NCSC (centro nacional de cibersegurança do Reino Unido) publica a lista das senhas mais comuns vazadas em ataques.</p>
<p><b>Uma boa senha:</b> longa, única para cada conta, de preferência uma <b>frase com várias palavras sem relação</b> (passphrase), guardada em um <b>gerenciador de senhas</b>. Com MFA ligado, melhor ainda.</p>
<h3>Fraqueza 2: permissões de arquivo fracas</h3><ul><li><b>Princípio do menor privilégio (least privilege):</b> cada pessoa acessa só o que precisa para fazer o trabalho. Em resumo: quem pode acessar o quê.</li><li>Exemplo pessoal: o plano da viagem é compartilhado com quem vai viajar, não de forma pública.</li><li>Permissões fracas atingem a <b>confidencialidade</b> (acesso a arquivos que não deveria) e a <b>integridade</b> (alteração de arquivos que não deveria editar).</li><li>No Linux, o exemplo clássico é um arquivo com permissão 777 (todo mundo lê, escreve e executa). No Windows, as permissões ficam na aba Segurança do arquivo.</li></ul>
<h3>Fraqueza 3: programas maliciosos (malware)</h3><table><tr><th>Tipo</th><th>O que faz</th><th>Pilar atingido</th></tr><tr><td><b>Cavalo de Troia (Trojan)</b></td><td>Parece um programa útil, mas dá ao atacante acesso ao sistema. Ele lê e altera arquivos.</td><td>Confidencialidade e integridade</td></tr><tr><td><b>Ransomware</b></td><td>Criptografa os arquivos do usuário. Sem a senha de descriptografia, viram texto ilegível. O atacante cobra resgate.</td><td>Disponibilidade</td></tr></table>
<ul><li>Pagar o resgate não garante recuperar os arquivos. A defesa certa é ter <b>backup</b> separado da rede e não abrir anexos suspeitos.</li><li>Muitos ransomwares também roubam os dados antes de criptografar, então atingem a confidencialidade também.</li></ul>
<h3>SSH (Secure Shell)</h3><ul><li><b>O que é:</b> um protocolo de rede <b>criptografado</b> para acesso remoto seguro e administração de sistemas, mesmo por uma rede não segura (como a internet).</li><li><b>Como funciona:</b> abre um <b>túnel seguro</b> entre um cliente (você) e um servidor. A criptografia garante a <b>confidencialidade</b> (ninguém lê) e a <b>integridade</b> (ninguém altera) dos dados na transmissão.</li><li><b>Porta:</b> TCP/22.</li><li><b>Para que serve:</b> executar comandos em servidores Linux, transferir arquivos com segurança (<b>SCP</b> ou <b>SFTP</b>) e gerenciar infraestrutura de TI à distância.</li><li><b>Características:</b> criptografia, autenticação robusta, tunelamento e encaminhamento de portas (port forwarding) e versatilidade.</li></ul>
<p>Comando básico: ssh usuario@endereco-ip</p>
<p><b>Autenticação no SSH:</b> por <b>senha</b> (algo que você sabe) ou por <b>par de chaves</b>: a chave privada fica com você e a pública fica no servidor. Chave é bem mais segura do que senha.</p>
<p><b>Por que existe:</b> antes se usava o <b>Telnet</b> (porta 23), que manda tudo, inclusive a senha, em texto puro. Qualquer um na rede conseguia ler. O SSH substituiu o Telnet por isso.</p>
<p><b>No SOC:</b> muitas tentativas de login SSH falhando vindas do mesmo IP indicam ataque de força bruta. As defesas são desligar o login por senha, usar chaves, MFA e bloquear IPs suspeitos.</p>
<h3>Laboratório prático: auditoria de segurança no Linux</h3><p>Na sala, você foi contratado para checar a segurança de uma máquina Linux. É um teste <b>autorizado</b>: só se faz com permissão.</p><ol><li><b>Digitar a senha no Linux:</b> ela <b>não aparece</b> na tela, nem com pontinhos. Isso é normal. O Linux esconde para ninguém ver o tamanho da senha. Digite e aperte Enter.</li><li><b>pwd:</b> mostra em que pasta você está.</li><li><b>ls:</b> lista os arquivos da pasta, <b>menos os escondidos</b>. Para ver também os escondidos (nomes que começam com ponto), use ls -a.</li><li><b>cat nome-do-arquivo:</b> mostra o conteúdo de um arquivo de texto na tela.</li><li><b>Adivinhar a senha:</b> a sala dava uma lista de 20 senhas comuns. A certa era <b>abc123</b>. É o ataque de <b>dicionário</b>: testar as senhas mais comuns. Funcionou porque o usuário usou uma senha fraca, e o mesmo esquema abriu a conta do Johnny.</li><li><b>history:</b> mostra os comandos que o usuário digitou antes. Nesse histórico, o Johnny digitou a <b>senha por engano</b> como se fosse um comando, e ela ficou gravada.</li><li><b>Resultado:</b> com essa senha, foi possível ler o arquivo protegido em <b>/root/flag.txt</b> (cat /root/flag.txt). A pasta /root é a pasta do administrador, e a resposta da sala estava lá.</li></ol>
<p><b>Lições de segurança:</b></p><ul><li>Senha fraca (abc123) abre a conta em segundos.</li><li>Nunca digite a senha na linha de comando. Ela fica no histórico (history) e qualquer um que ler pode usar.</li><li>Quem entra com a senha certa lê os arquivos que o usuário pode ler, e por isso o menor privilégio e as permissões corretas importam.</li><li>Para o SOC: logins estranhos e consultas ao history de contas comprometidas são parte da investigação.</li></ul>
<h3>Cuidado com estas confusões</h3><ul><li>Princípio do <b>menor</b> privilégio (least), não "último".</li><li>Hardware sozinho não funciona. Precisa do SO.</li><li>Ransomware atinge a <b>disponibilidade</b> (e muitas vezes também a confidencialidade).</li></ul>`},
{id:"dados",n:"Representação de Dados",ic:"🔢",tags:["Dados"],chk:["Explicar decimal, binário, hexadecimal e octal", "Dizer que 4 bits formam 1 dígito hexadecimal e 3 bits formam 1 dígito octal", "Explicar bit, byte e octeto", "Explicar como uma cor é representada (RGB)", "Converter números pequenos entre binário, decimal e hexadecimal", "Acertar 8 de 10 no quiz de Representação de Dados"],st:`
<p class="mu">O computador só entende dois estados: ligado e desligado, escritos como 1 e 0. Tudo o que ele guarda, como números, textos, cores e imagens, vira uma sequência de 0 e 1.</p>
<h3>Os 4 sistemas numéricos</h3><table><tr><th>Sistema</th><th>Base</th><th>Dígitos</th><th>Onde aparece</th></tr><tr><td>Decimal</td><td>10</td><td>0 a 9</td><td>Vida diária</td></tr><tr><td>Binário</td><td>2</td><td>0 e 1</td><td>O que o computador entende</td></tr><tr><td>Hexadecimal</td><td>16</td><td>0 a 9 e A a F</td><td>Cores, MAC, hashes, memória</td></tr><tr><td>Octal</td><td>8</td><td>0 a 7</td><td>Pouco comum (permissões Linux)</td></tr></table>
<p>No hexadecimal as letras valem números: A = 10, B = 11, C = 12, D = 13, E = 14 e F = 15.</p>
<h3>Bit e byte</h3><ul><li><b>Bit</b> (binary digit): o menor pedaço de informação, 0 ou 1.</li><li><b>Byte:</b> nos sistemas modernos, 8 bits. Também é chamado de <b>octeto</b> (octet), nome muito usado em redes.</li><li>Um byte guarda 256 valores diferentes (2 elevado a 8), de 0 a 255.</li></ul>
<h3>Como ler um número binário</h3><p>Cada posição vale o dobro da anterior, da direita para a esquerda:</p><table><tr><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td></tr></table><p>Some só as posições com 1: 8 + 2 = <b>10</b>. Então 00001010 em decimal é 10. E 11111111 é 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = <b>255</b>, o maior valor de um byte.</p>
<h3>Por que o hexadecimal existe</h3><ul><li><b>4 bits viram 1 dígito hexadecimal.</b> Um byte (8 bits) fica com 2 dígitos hex. Exemplo: 1010 1111 é AF.</li><li><b>3 bits viram 1 dígito octal.</b> Atenção: são 3 <b>bits</b>, não 3 bytes. Exemplo: 111 é 7.</li><li>Escrever em hex é bem mais curto e mais fácil de ler do que uma sequência longa de 0 e 1.</li></ul>
<table><tr><th>Decimal</th><th>Binário</th><th>Hex</th></tr><tr><td>0</td><td>0000</td><td>0</td></tr><tr><td>1</td><td>0001</td><td>1</td></tr><tr><td>2</td><td>0010</td><td>2</td></tr><tr><td>3</td><td>0011</td><td>3</td></tr><tr><td>4</td><td>0100</td><td>4</td></tr><tr><td>5</td><td>0101</td><td>5</td></tr><tr><td>6</td><td>0110</td><td>6</td></tr><tr><td>7</td><td>0111</td><td>7</td></tr><tr><td>8</td><td>1000</td><td>8</td></tr><tr><td>9</td><td>1001</td><td>9</td></tr><tr><td>10</td><td>1010</td><td>A</td></tr><tr><td>11</td><td>1011</td><td>B</td></tr><tr><td>12</td><td>1100</td><td>C</td></tr><tr><td>13</td><td>1101</td><td>D</td></tr><tr><td>14</td><td>1110</td><td>E</td></tr><tr><td>15</td><td>1111</td><td>F</td></tr></table>
<p>Exemplo completo: o número 255 é 11111111 em binário, FF em hexadecimal e 377 em octal.</p>
<h3>Como uma cor é representada</h3><ul><li>Na tela, toda cor é uma mistura de <b>vermelho, verde e azul</b> (RGB: Red, Green, Blue).</li><li>Cada cor primária usa <b>1 byte</b> (0 a 255). Então uma cor usa 3 bytes, ou 24 bits.</li><li>Quantas cores? 256 x 256 x 256 = <b>16.777.216</b>, ou seja, mais de 16 milhões.</li><li>Em hexadecimal, cada cor vira 2 dígitos: <b>#RRGGBB</b>.</li></ul><table><tr><th>Cor</th><th>Hex</th><th>RGB</th></tr><tr><td>Vermelho</td><td>#FF0000</td><td>255, 0, 0</td></tr><tr><td>Verde</td><td>#00FF00</td><td>0, 255, 0</td></tr><tr><td>Azul</td><td>#0000FF</td><td>0, 0, 255</td></tr><tr><td>Preto</td><td>#000000</td><td>0, 0, 0</td></tr><tr><td>Branco</td><td>#FFFFFF</td><td>255, 255, 255</td></tr></table>
<h3>Onde isso aparece em TI e segurança</h3><ul><li><b>Endereço IPv4:</b> 4 octetos, cada um de 0 a 255 (por isso 192.168.0.25 existe, mas 192.168.0.256 não).</li><li><b>Endereço MAC:</b> 6 bytes escritos em hexadecimal (A4:5E:60:C1:22:9B).</li><li><b>Hash de um arquivo</b> (como SHA-256): 64 dígitos hexadecimais. É assim que o analista identifica um arquivo malicioso.</li><li><b>Códigos de erro do Windows</b> aparecem em hex (como 0x80070005, acesso negado).</li><li><b>URLs:</b> %20 é o espaço escrito em hexadecimal.</li><li><b>Permissões do Linux:</b> chmod 755 está em octal. Cada dígito é 3 bits: 7 = 111 = rwx e 5 = 101 = r-x.</li></ul>
<h3>Cuidado com estas confusões</h3><ul><li>Octal: 3 <b>bits</b> por dígito. Hexadecimal: 4 <b>bits</b> por dígito.</li><li>Bit (1 dígito binário) não é byte (8 bits).</li><li>O hexadecimal chega a F (15), não a 9.</li></ul>`},
{id:"ms",n:"Administração Microsoft",ic:"🪟",tags:["Admin"],chk:["Explicar o que é o Active Directory e o Domain Controller", "Usar o ADUC: criar usuário, resetar senha e desbloquear conta", "Diferenciar OU e grupo e saber por que dar permissão a grupos", "Explicar o que é uma GPO e usar gpupdate /force e gpresult /r", "Diferenciar conta bloqueada, desativada e senha expirada", "Explicar Entra ID, Microsoft 365 admin center e licenças", "Explicar MFA e o que fazer quando o usuário troca de celular", "Explicar o Intune (MDM) e o que é Wipe", "Explicar DHCP e DNS no Windows Server e por que o AD depende do DNS", "Descrever o processo de entrada e saída de funcionário (joiner/leaver)", "Saber os Event IDs 4624, 4625, 4740 e 4720", "Resolver os desafios de Admin Microsoft na aba Desafios", "Acertar 8 de 10 no quiz de Administração Microsoft"],st:`<p class="mu">Esse tópico é o que as vagas de IT Support e Service Desk mais pedem. Se faz tempo que você não mexe com isso, aqui é o lugar para lembrar. Treine também na aba Desafios, em Admin Microsoft.</p>
<h3>1. Active Directory (AD DS)</h3><ul><li><b>O que é:</b> o cadastro central da empresa. Guarda usuários, computadores e grupos e decide quem entra e o que pode acessar.</li><li><b>Domain Controller (DC):</b> o servidor que roda o AD e valida os logins.</li><li><b>Domínio:</b> o conjunto gerenciado pelo AD, por exemplo empresa.local. O PC "entra no domínio" (domain joined).</li><li><b>Workgroup:</b> o contrário. Cada PC tem só contas locais. Serve em casa ou em empresas muito pequenas.</li></ul>
<h3>2. Ferramentas do dia a dia</h3><table><tr><th>Ferramenta</th><th>Para quê</th><th>Atalho</th></tr><tr><td>Active Directory Users and Computers (ADUC)</td><td>Usuários, senhas, grupos, desbloquear</td><td>dsa.msc</td></tr><tr><td>Group Policy Management</td><td>Criar e ligar GPOs</td><td>gpmc.msc</td></tr><tr><td>DNS Manager</td><td>Registros DNS</td><td>dnsmgmt.msc</td></tr><tr><td>DHCP</td><td>Escopos e reservas de IP</td><td>dhcpmgmt.msc</td></tr><tr><td>Microsoft 365 admin center</td><td>Usuários, licenças e e-mail na nuvem</td><td>admin.microsoft.com</td></tr><tr><td>Intune</td><td>Dispositivos e apps</td><td>intune.microsoft.com</td></tr></table>
<p class="mu">As ferramentas gráficas do AD instalam-se em um Windows comum com o pacote RSAT (Remote Server Administration Tools).</p>
<h3>3. Tarefas que mais aparecem em chamados</h3><ul><li><b>Resetar senha:</b> ADUC → botão direito no usuário → Reset Password. Marque "User must change password at next logon".</li><li><b>Desbloquear conta:</b> ADUC → Propriedades → aba Account → Unlock account.</li><li><b>Ver grupos:</b> ADUC → aba Member Of.</li><li><b>Criar usuário:</b> ADUC → na OU certa → New → User. Depois coloque nos grupos do setor.</li><li><b>Desativar conta (saída):</b> botão direito → Disable Account.</li></ul>
<h3>4. OU x Grupo</h3><ul><li><b>OU</b> é uma pasta para organizar (Financeiro, Vendas) e receber GPOs.</li><li><b>Grupo de segurança</b> dá permissões (acesso a pasta, impressora, sistema).</li><li>Regra de bolso: <b>OU organiza, grupo dá acesso.</b></li><li>Boa prática: dar permissão a grupos, nunca a pessoas soltas. Menor privilégio: só o que a pessoa precisa.</li></ul>
<h3>5. GPO (Group Policy)</h3><ul><li>Regras aplicadas automaticamente a usuários ou computadores de uma OU.</li><li>Exemplos: política de senha, bloquear USB, papel de parede, mapear unidade de rede.</li><li><b>gpupdate /force:</b> atualiza as políticas na hora.</li><li><b>gpresult /r:</b> mostra quais GPOs estão valendo naquele PC.</li></ul>
<h3>6. Conta bloqueada, desativada ou senha expirada</h3><table><tr><th>Situação</th><th>Causa</th><th>Solução</th></tr><tr><td>Bloqueada</td><td>Muitas tentativas erradas</td><td>Unlock account e achar a causa</td></tr><tr><td>Desativada</td><td>O TI desligou</td><td>Reativar só se for legítimo</td></tr><tr><td>Senha expirada</td><td>Passou do prazo</td><td>Usuário cria nova senha</td></tr></table>
<p class="mu">Antes de qualquer reset: confirme a identidade de quem pediu. Nunca peça a senha do usuário.</p>
<h3>7. Nuvem: Entra ID e Microsoft 365</h3><ul><li><b>Entra ID</b> (antigo Azure AD): identidade na nuvem. Faz o login no Microsoft 365.</li><li><b>Híbrido:</b> AD local sincronizado com o Entra ID pelo Entra Connect.</li><li><b>Licença:</b> sem licença o usuário existe, mas não tem e-mail (Exchange Online), Teams ou Office.</li><li><b>Exchange Online:</b> e-mail, caixas compartilhadas (shared mailbox) e listas de distribuição.</li><li><b>MFA:</b> senha + segundo fator (app Authenticator). Troca de celular? Confirme a identidade e redefina os métodos de MFA.</li></ul>
<h3>8. Intune (gerenciar dispositivos)</h3><ul><li>Aplica políticas, instala apps e verifica se o aparelho está em conformidade.</li><li>Aparelho perdido: <b>Lock</b> (bloquear), <b>Wipe</b> (apagar tudo) ou <b>Retire</b> (remover só dados da empresa).</li><li><b>Autopilot:</b> o notebook novo se configura sozinho ao ligar.</li></ul>
<h3>9. DHCP e DNS no servidor</h3><ul><li><b>DHCP:</b> escopo (faixa de IPs), lease (tempo emprestado) e reserva (mesmo IP sempre, ligado ao MAC).</li><li><b>DNS:</b> registros A (nome → IP). O AD usa o DNS para achar o DC.</li><li>Erro de domínio com internet funcionando? Veja o DNS no <b>ipconfig /all</b>: deve ser o do servidor da empresa.</li></ul>
<h3>10. Entrada e saída de funcionário</h3><ul><li><b>Entrada (joiner):</b> criar conta, grupos, licença, MFA, equipamento e inventário.</li><li><b>Mudança (mover):</b> trocar os grupos e o acesso, remover o que não precisa mais.</li><li><b>Saída (leaver):</b> desativar a conta, tirar dos grupos, encerrar sessões, recolher equipamentos e guardar o e-mail conforme a política. Apagar só depois.</li></ul>
<h3>11. Permissões de pasta</h3><ul><li><b>Compartilhamento (Share)</b> e <b>NTFS (Security)</b> trabalham juntos. Vale a mais restritiva.</li><li>Acesso negado? Veja os grupos do usuário e as permissões da pasta.</li><li>Depois de entrar em um grupo novo, o usuário pode precisar sair e entrar de novo.</li></ul>
<h3>12. Comandos úteis</h3><table><tr><th>Comando</th><th>O que faz</th></tr><tr><td>whoami /groups</td><td>Grupos do usuário atual</td></tr><tr><td>net user nome /domain</td><td>Dados da conta no domínio</td></tr><tr><td>gpupdate /force</td><td>Atualiza GPOs</td></tr><tr><td>gpresult /r</td><td>Mostra GPOs aplicadas</td></tr><tr><td>ipconfig /all</td><td>IP, DNS, DHCP, MAC</td></tr><tr><td>ipconfig /release e /renew</td><td>Devolve e pede IP de novo</td></tr><tr><td>ipconfig /flushdns</td><td>Limpa o cache de DNS</td></tr><tr><td>nslookup nome</td><td>Testa a resolução de DNS</td></tr></table>
<h3>13. Visão de SOC: Event IDs do Windows</h3><table><tr><th>ID</th><th>Significa</th></tr><tr><td>4624</td><td>Login com sucesso</td></tr><tr><td>4625</td><td>Falha de login</td></tr><tr><td>4740</td><td>Conta bloqueada</td></tr><tr><td>4720</td><td>Conta criada</td></tr><tr><td>4728 / 4732</td><td>Usuário adicionado a um grupo</td></tr><tr><td>4672</td><td>Privilégios especiais no login</td></tr></table>
<p class="mu">Muitos 4625 seguidos de um 4624 podem ser força bruta que funcionou. Um 4720 inesperado ou alguém entrando no grupo de administradores (4728/4732) merece atenção.</p>
<h3>Como praticar de graça</h3><ul><li>Sala <b>Active Directory Basics</b> no TryHackMe.</li><li>Baixar o Windows Server em versão de avaliação e rodar no VirtualBox: criar um domínio, usuários, OUs e uma GPO.</li><li>Um tenant de teste do Microsoft 365 Developer, se disponível na sua conta, para treinar licenças e MFA.</li></ul>`},
{id:"soc",n:"SOC na Prática",ic:"🛡️",tags:["SOC"],chk:["Explicar o que é um SOC e os 3 níveis","Descrever o caminho de um alerta em 6 passos","Diferenciar falso e verdadeiro positivo","Citar SIEM, EDR e firewall e para que servem","Dizer as 4 fases da resposta a incidentes","Explicar o MITRE ATT&CK com um exemplo","Acertar 8 de 10 no quiz de SOC"],st:`<h3>O que é um SOC</h3><p>Security Operations Center: o time que vigia a segurança da empresa 24 horas por dia. É a sala de controle: vê os alertas, decide o que é ameaça real e age.</p><h3>Níveis (tiers)</h3><ul><li><b>Nível 1 (você começa aqui):</b> monitora alertas, faz a triagem, descarta falsos positivos e escala o que for sério.</li><li><b>Nível 2:</b> investiga a fundo os incidentes escalados.</li><li><b>Nível 3:</b> caça ameaças, melhora as detecções e lidera incidentes graves.</li></ul><h3>O caminho de um alerta</h3><ol><li>O SIEM dispara um alerta.</li><li>Você lê: qual regra, que IP, que usuário, que horário?</li><li>Checa o contexto: o IP é conhecido? É interno ou externo? O usuário costuma fazer isso?</li><li>Decide: <b>falso positivo</b> (fecha e anota) ou <b>verdadeiro positivo</b> (segue).</li><li>Se for verdadeiro: contém (ex.: bloqueia o IP) ou escala.</li><li>Registra tudo no ticket, em linguagem clara.</li></ol><h3>Falso e verdadeiro positivo</h3><ul><li><b>Falso positivo:</b> o alerta disparou, mas era atividade normal (ex.: um administrador fazendo vários logins para testar). Fecha e anota o motivo.</li><li><b>Verdadeiro positivo:</b> o alerta está certo e há ameaça real. Documenta, contém e escala.</li></ul><h3>Ferramentas</h3><ul><li><b>SIEM</b> (Splunk, Microsoft Sentinel): junta e correlaciona logs.</li><li><b>EDR</b> (Defender for Endpoint, CrowdStrike): vigia e isola computadores.</li><li><b>Firewall e IDS/IPS:</b> bloqueiam e detectam tráfego suspeito.</li><li><b>Ticket:</b> onde cada caso é documentado.</li></ul><h3>Ciclo de resposta a incidentes</h3><ol><li><b>Preparação:</b> ter ferramentas, regras e treino prontos antes do ataque.</li><li><b>Detecção e análise:</b> perceber o alerta e investigar o que aconteceu.</li><li><b>Contenção, erradicação e recuperação:</b> parar o ataque, remover a ameaça e voltar ao normal.</li><li><b>Lições aprendidas:</b> revisar o que deu certo e errado para melhorar.</li></ol><h3>MITRE ATT&amp;CK</h3><p>Catálogo de como os atacantes agem (táticas e técnicas). Serve para dar nome ao que você vê. Ex.: muitos logins errados seguidos = tentativa de força bruta.</p><h3>Exemplo prático</h3><p>Alerta: 300 logins falhos no SSH (porta 22) em 2 minutos, de um IP externo, e depois 1 login com sucesso. Isso preocupa: o atacante pode ter acertado a senha. Ação: tratar como verdadeiro positivo, escalar, bloquear o IP e ver o que a conta fez.</p><h3>Phishing: o que checar</h3><ul><li>O remetente e o domínio parecem certos?</li><li>Para onde o link leva? (passe o mouse, não clique)</li><li>Há urgência, ameaça ou anexo inesperado?</li><li>Mais pessoas receberam o mesmo e-mail?</li></ul><h3>Para completar</h3><ul><li><b>Falso negativo:</b> um ataque real que não gerou alerta. É o mais perigoso, porque ninguém olha. Por isso os analistas também ajustam e criam regras novas.</li><li><b>Tríade CIA:</b> Confidencialidade (só quem pode vê), Integridade (ninguém altera sem permissão) e Disponibilidade (o sistema está disponível). Todo incidente quebra pelo menos uma.</li><li><b>Ameaça, vulnerabilidade e risco:</b> a vulnerabilidade é a falha, a ameaça é quem pode explorá-la, e o risco é a chance de acontecer multiplicada pelo impacto.</li><li><b>IOC (indicador de comprometimento):</b> sinais que provam um ataque, como um IP malicioso ou o hash de um arquivo.</li><li><b>Prioridade:</b> casos críticos primeiro (conta administrativa, máquina isolada, dados de clientes).</li><li><b>Ciclo de incidentes:</b> as 4 fases são do guia do NIST.</li><li><b>MITRE:</b> força bruta é a técnica T1110 e phishing é a T1566.</li><li><b>Boa nota de ticket:</b> o que aconteceu, quando, em qual máquina ou usuário, o que você fez e o que falta.</li></ul><h3>Como explicar numa entrevista</h3><p><b>Walk me through how you handle an alert.</b><br><i>I read the alert: the rule, source, user and time. Then I check the context, whether the IP is known and whether this is normal for that user. If it is a false positive I close it and note why. If it is real I contain it, escalate and document everything in the ticket.</i></p><p><b>What is the CIA triad?</b><br><i>Confidentiality, integrity and availability. Confidentiality means only authorised people can see the data, integrity means it is not changed without permission, and availability means systems and data can be used when needed.</i></p><p><b>What is the difference between a false positive and a false negative?</b><br><i>A false positive is an alert for harmless activity. A false negative is a real attack that raised no alert, which is more dangerous.</i></p>`},

["Novo funcionário: conta e e-mail", "CHAMADO #4010\nO RH avisa: Carlos começa na segunda no setor de Vendas. Precisa de conta, e-mail e acesso às pastas do setor.", "Prioridade média", [["Onde criar a conta de rede?", ["No ADUC, na OU Vendas, com New → User", "No Bloco de Notas", "No site do fornecedor de internet", "Compartilhando a conta de outro colega"], "A conta fica na OU do setor para receber as políticas certas. Nunca compartilhe contas entre pessoas."], ["Como dar acesso às pastas de Vendas?", ["Adicionar o Carlos ao grupo de segurança de Vendas", "Dar permissão direta à conta dele em cada pasta", "Compartilhar tudo com Todos", "Dar acesso de administrador"], "Permissões vão para grupos. Assim o acesso é fácil de manter e de auditar."], ["Carlos faz login mas diz que não tem e-mail. O que está faltando?", ["A licença do Microsoft 365 que inclui o Exchange Online", "Trocar o mouse dele", "Reinstalar o Outlook três vezes", "Criar outra conta de rede"], "No Microsoft 365 admin center, em Users, atribua a licença. Sem licença não existe caixa de e-mail."]], "New starter set-up for Carlos (Sales).\nAction: created the AD account in the Sales OU, added him to the Sales security group, assigned a Microsoft 365 licence and set up MFA.\nResult: sign-in, mailbox and shared folders verified with the user. Ticket closed."],
["Acesso negado à pasta de rede", "CHAMADO #4022\nCarla mudou do Financeiro para o RH e não consegue abrir a pasta do RH: “Acesso negado”.", "Prioridade média", [["O que a mensagem de acesso negado indica?", ["A rede funciona, mas a conta dela não tem permissão", "A internet caiu", "O PC está sem energia", "O Windows está corrompido"], "Se ela vê a pasta e recebe acesso negado, a conexão está boa: é permissão."], ["O que você verifica?", ["Se Carla está no grupo do RH e se esse grupo tem permissão na pasta", "A cor do papel de parede", "A velocidade da internet", "A marca da impressora"], "Grupos do usuário (ADUC, aba Member Of) e permissões da pasta (aba Security) explicam quase todo acesso negado."], ["Ela não está no grupo do RH. Qual é a ação correta?", ["Pedir a aprovação do gestor do RH, adicionar ao grupo, pedir para sair e entrar de novo e documentar", "Dar a ela direito de administrador", "Copiar a pasta do RH para o Financeiro", "Adicionar o grupo do Financeiro no RH"], "O gestor autoriza o acesso (menor privilégio). Sair e entrar atualiza o token de grupos do login. Registre tudo no ticket."]], "User could not open the HR shared folder (access denied) after changing department.\nCause: not a member of the HR security group.\nAction: manager approval obtained, user added to the group, user logged off and on.\nResult: access confirmed. Ticket closed."],
["Funcionário saiu da empresa", "CHAMADO #4035\nO RH avisa: João (Vendas) foi desligado hoje às 17h.", "Prioridade alta", [["O que fazer primeiro com a conta dele?", ["Desativá-la (Disable Account) e encerrar as sessões", "Apagá-la na hora", "Deixá-la ativa para o gestor ver depois", "Mudar o nome da conta e continuar usando"], "Desativar corta o acesso imediatamente e mantém os dados caso a empresa precise. Apagar vem depois, pela política."], ["E o e-mail dele?", ["Seguir a política: guardar a caixa, dar acesso ao gestor ou encaminhar, sem apagar na hora", "Apagar imediatamente", "Dar a senha dele ao gestor", "Ignorar"], "O gestor pode precisar dos e-mails de trabalho. Nunca compartilhe a senha de ninguém."], ["O que completa o processo?", ["Remover dos grupos, recolher o notebook e o celular, atualizar o inventário e documentar", "Esperar que ele devolva quando quiser", "Apagar o ticket", "Manter os grupos para facilitar uma volta"], "Grupos antigos e aparelhos soltos são risco. O inventário e o ticket comprovam o que foi feito."]], "Leaver process for João (Sales).\nAction: disabled the account, removed group memberships, revoked sessions, retained the mailbox per policy, collected laptop and phone, updated the inventory.\nResult: access removed. Ticket closed."],
["GPO que não aplica", "CHAMADO #4048\nVocê criou uma GPO para bloquear pen drives no setor Financeiro. Um PC continua aceitando USB.", "Prioridade média", [["Primeiro teste no PC com problema?", ["Rodar gpupdate /force e depois gpresult /r", "Formatar o PC", "Mudar a GPO para todos os setores", "Desligar o firewall"], "gpupdate atualiza as políticas na hora. gpresult /r mostra quais GPOs estão aplicadas."], ["O gpresult não lista a GPO. O que verificar?", ["Se o computador está na OU em que a GPO está ligada (linked)", "A cor do monitor", "O tamanho do disco", "O papel de parede"], "GPO só vale para objetos dentro da OU onde está ligada. Um PC em outra OU não recebe."], ["O PC estava na OU errada. Qual é o fecho certo?", ["Mover o PC para a OU Financeiro, atualizar as políticas, testar com um pen drive e documentar", "Ligar a GPO a todo o domínio", "Desistir da GPO", "Dar o pen drive de volta e fechar"], "Corrigir a causa (OU errada), testar o resultado e documentar. Ligar a todos afetaria quem não deveria."]], "USB-blocking GPO was not applying to one Finance PC.\nCause: the computer account was in the wrong OU.\nAction: moved it to the Finance OU, ran gpupdate /force, verified with gpresult /r and a USB test.\nResult: policy applied. Ticket closed."],
["Notebook perdido (Intune)", "CHAMADO #4052\nPedro esqueceu o notebook da empresa em um táxi. Ele tem e-mails e arquivos de clientes.", "Prioridade alta", [["Primeira ação?", ["Registrar o incidente, avisar a segurança e agir rápido no dispositivo", "Esperar uma semana para ver se aparece", "Comprar outro e esquecer", "Só pedir para ele procurar"], "Dados de clientes em um aparelho perdido são um risco de vazamento. Aja rápido e avise a segurança."], ["No Intune, o que fazer com o aparelho?", ["Lock e, se necessário, Wipe", "Nada, o Windows protege sozinho", "Renomear o aparelho", "Atribuir uma licença nova"], "Lock bloqueia o aparelho. Wipe apaga os dados à distância. Retire remove só os dados da empresa."], ["O que mais deve ser feito?", ["Resetar a senha de Pedro, revogar as sessões e preparar um aparelho de reposição", "Não mexer na conta dele", "Dar a ele acesso de administrador", "Desativar o MFA"], "A conta também pode estar exposta. Reset de senha e fim das sessões reduzem o risco. MFA deve continuar ligado."]], "Company laptop lost in a taxi by user Pedro; it contained customer data.\nAction: reported to security, locked the device in Intune and issued a remote wipe, reset the password and revoked sessions, arranged a replacement.\nResult: risk contained. Ticket updated."],
["Trocou de celular e o MFA não funciona", "CHAMADO #4060\nMarta comprou um celular novo e agora não consegue passar do código do Authenticator para entrar no e-mail.", "Prioridade média", [["O que fazer antes de mexer no MFA?", ["Confirmar a identidade de Marta por um método seguro", "Desativar o MFA de todos", "Pedir o código do celular antigo por mensagem", "Dar a senha do gestor"], "Resetar MFA sem confirmar a identidade abre a porta para um golpista que roubou a senha."], ["Depois de confirmar, como resolver?", ["Redefinir os métodos de MFA da conta para ela registrar o novo celular", "Apagar a conta", "Desligar o MFA para sempre", "Trocar a licença"], "Ao redefinir os métodos, no próximo login ela configura o Authenticator no novo aparelho."], ["Como fechar?", ["Acompanhar o registro, confirmar que o e-mail abre e documentar", "Mandar um e-mail dizendo “resolvido” sem testar", "Pedir a ela para resolver sozinha", "Deixar o MFA desativado só por hoje"], "Sempre teste com o usuário. MFA desativado, mesmo por pouco tempo, é risco."]], "User replaced her phone and could not approve MFA prompts.\nAction: verified identity, reset MFA methods in Entra ID, user registered the new device in Authenticator.\nResult: sign-in confirmed. Ticket closed."]
]},
{k:"hd",n:"Helpdesk",ic:"🎧",c:"#38bdf8",d:"Suporte ao usuário: chamados do dia a dia",l:[
["Não consigo entrar no e-mail","CHAMADO #1042\nUsuária: Ana (Financeiro)\n“Não consigo entrar no e-mail desde cedo. Aparece senha incorreta.”","Prioridade média",[["Qual a primeira ação?",["Perguntar o que mudou, confirmar o erro exato e ver se outros apps funcionam","Resetar a senha na hora, sem confirmar quem é","Reinstalar o Windows","Pedir para tentar mais tarde"],"Entenda o problema antes de agir. Resetar sem confirmar a identidade abre uma brecha de segurança."],["Ana diz que trocou a senha ontem em outro aparelho. O que verificar?",["Se o celular ainda usa a senha antiga e está bloqueando a conta por tentativas","Trocar o teclado dela","Comprar um computador novo","Desligar o roteador"],"Apps com a senha antiga tentam entrar várias vezes e podem bloquear a conta."],["Qual é a solução correta?",["Confirmar a identidade, desbloquear a conta, orientar a atualizar a senha no celular e registrar no ticket","Pedir a senha dela para testar","Apagar a conta e criar outra","Fechar o chamado sem testar"],"Nunca peça a senha do usuário. Confirme a identidade, resolva, teste e documente."]],"User could not log in to email after changing the password yesterday.\nCause: phone still using the old password, causing repeated failed attempts and an account lock.\nAction: verified identity, unlocked the account, user updated the password on the phone.\nResult: login confirmed. Ticket closed."],
["Computador lento","CHAMADO #1057\nUsuário: João (Vendas)\n“O PC está muito lento há 2 dias.”","Prioridade média",[["O que checar primeiro?",["Task Manager: uso de CPU, memória e disco e programas na inicialização","Formatar o computador","Trocar o mouse","Pedir para ele esperar"],"O Task Manager mostra o que está consumindo recursos agora."],["O disco está em 100% e um programa desconhecido usa muito processador. Próximo passo?",["Investigar o programa (local, nome, editor), rodar o antivírus e escalar se parecer malware","Encerrar e ignorar","Apagar a pasta do Windows","Reinstalar o navegador"],"Programa desconhecido com uso alto pode ser malware: investigue e escale, não só encerre."],["Era um programa legítimo travado e há 3 GB livres. Como fechar?",["Reiniciar o app, liberar espaço, orientar o usuário e registrar a causa","Fechar sem falar com o João","Trocar o PC","Dizer que foi vírus sem provar"],"Resolva, explique ao usuário e documente a causa real."]],"User reported a slow PC for 2 days.\nCause: a legitimate application was frozen and using high CPU; disk space was low.\nAction: restarted the application, freed 3 GB, and advised the user.\nResult: performance back to normal. Ticket closed."],
["Impressora não imprime","CHAMADO #1063\nSetor: Financeiro (5 pessoas)\n“Só o nosso setor não imprime. Os outros imprimem.”","Prioridade alta",[["Qual a primeira pergunta útil?",["Quem é afetado, desde quando e o que aparece (erro, fila parada)","Quem derrubou a impressora?","Vamos comprar outra impressora","Reinicie o prédio"],"Delimite o problema: quem, quando e qual sintoma."],["Só o Financeiro é afetado e o PC mostra driver não disponível. Hipótese?",["Problema de driver ou de configuração naquele grupo de computadores","A internet do mundo caiu","O papel acabou em todas as impressoras","Erro de DNS"],"Se os outros imprimem, o problema é local desse grupo."],["Como validar a correção?",["Reinstalar o driver, imprimir uma página de teste com o usuário e documentar","Dizer que deve funcionar e fechar","Reiniciar sem testar","Pedir que o usuário resolva"],"Só feche o chamado depois de testar com o usuário."]],"Finance team (5 users) could not print; other teams were fine.\nCause: printer driver missing on those computers.\nAction: reinstalled the driver and printed a test page with the users.\nResult: printing restored. Ticket closed."]
]},
{k:"it",n:"Técnico de TI",ic:"🔧",c:"#34d399",d:"Equipamentos, rede e manutenção",l:[
["Preparar um notebook novo","CHAMADO #2011\nNovo colaborador começa na segunda e precisa de um notebook configurado.","Prioridade média",[["O que fazer antes de entregar?",["Seguir o checklist: atualizar o Windows, instalar os programas padrão, ativar antivírus e criptografia e criar a conta com as permissões certas","Entregar como veio da caixa","Dar acesso de administrador a tudo","Instalar programas piratas"],"Um checklist garante o mesmo padrão e a segurança em todos os equipamentos."],["O funcionário pede acesso de administrador local. Qual a resposta?",["Seguir o menor privilégio: dar só o necessário e pedir aprovação do gestor se precisar de mais","Dar na hora para evitar chamados","Recusar sem explicar","Dar a senha de administrador do domínio"],"Menos permissão reduz o estrago se a conta for comprometida."],["Como finalizar?",["Registrar o inventário (modelo, número de série, usuário) e entregar com um termo de recebimento","Deixar na mesa","Anotar no papel","Não registrar"],"Inventário permite saber o que existe, onde está e quem usa."]],"Prepared a new laptop for a new starter.\nAction: updated Windows, installed standard software, enabled antivirus and disk encryption, created the account with standard permissions.\nResult: laptop delivered, inventory updated (model, serial number, user) and receipt signed."],
["Sala sem rede","CHAMADO #2024\n“Sala 3: nenhum computador tem internet. O resto do prédio funciona.”","Prioridade alta",[["O que sugere o problema só nessa sala?",["Problema local: switch, cabo ou porta daquela sala","Queda do provedor","Falha global de DNS","Vírus no computador do diretor"],"Se o resto funciona, a internet está bem: foque no que é só dessa sala."],["Os computadores têm IP 169.254.x.x. O que isso indica?",["Não receberam IP do DHCP: verificar a conexão com a rede e o switch","Estão conectados normalmente","O Windows está desatualizado","O site está fora do ar"],"169.254 é um IP automático de emergência, sem DHCP."],["O switch estava sem energia. Próximo passo?",["Religar, confirmar IP e internet e documentar a causa e a correção","Religar e ir embora","Trocar todos os cabos","Reinstalar os computadores"],"Confirme com os usuários e registre a causa para prevenir."]],"Room 3 had no network access; the rest of the building was fine.\nCause: the room switch had lost power; computers showed 169.254.x.x addresses (no DHCP).\nAction: restored power to the switch and confirmed valid IP addresses and internet access.\nResult: network restored. Recommended a UPS."],
["Servidor com disco cheio","ALERTA #2040\nServidor de arquivos: 95% do disco usado.","Prioridade alta",[["Primeiro passo?",["Descobrir o que usa o espaço antes de apagar qualquer coisa","Apagar pastas aleatórias","Ignorar até chegar a 100%","Formatar o disco"],"Medir antes de agir evita perder dados importantes."],["A maior parte são backups antigos duplicados. O que fazer?",["Confirmar a política de retenção, remover só o que ela permite e conferir se o backup atual está íntegro","Apagar todos os backups","Mover para o desktop de alguém","Desligar o servidor"],"Siga a política e confirme que o backup atual funciona."],["Como evitar que volte a acontecer?",["Criar alerta de espaço, automatizar a limpeza pela política e documentar","Esperar o próximo alerta","Comprar disco sem analisar","Desativar o alerta"],"Prevenção e documentação evitam que o problema se repita."]],"File server disk at 95%.\nCause: duplicated old backups.\nAction: confirmed the retention policy, removed expired backups, verified the latest backup is intact, set up a space alert.\nResult: usage down to 60%."]
]},
{k:"soc",n:"Analista de SOC",ic:"🛡️",c:"#a78bfa",d:"Triagem de alertas e resposta a incidentes",l:[
["Login de administrador fora do horário","ALERTA SIEM #3001\n03:20 login da conta ops-admin vindo de outro país.","Prioridade alta",[["Primeira ação na triagem?",["Checar o contexto: IP, país, horário habitual, viagem ou VPN e outros eventos da conta","Fechar como falso positivo","Bloquear todos os usuários","Ignorar até de manhã"],"Triagem começa pelo contexto, antes de decidir."],["Não há viagem nem VPN e a conta baixou arquivos depois do login. O que indica?",["Verdadeiro positivo provável: possível conta comprometida","Comportamento normal","Erro do SIEM","Atualização do Windows"],"Login incomum seguido de ação suspeita eleva muito o risco."],["Quais as ações corretas?",["Contenção: encerrar sessões e forçar a troca de senha, escalar ao Nível 2 e preservar os logs","Apagar os logs","Mandar um e-mail depois","Deixar o acesso aberto para observar"],"Conter, escalar e preservar as evidências."]],"Alert: ops-admin logged in at 03:20 from an unusual country; files downloaded afterwards.\nAssessment: true positive, possible account compromise.\nAction: terminated sessions, forced a password reset, preserved logs, escalated to Tier 2."],
["EDR: executável em pasta temporária","ALERTA EDR #3014\nPC-12 executou update.exe da pasta Temp e abriu conexões externas.","Prioridade alta",[["O que olhar primeiro?",["Quem executou, o hash e a reputação do arquivo, o processo pai e para onde conectou","Só o nome do arquivo","A cor do ícone","Nada, é update"],"Um nome inocente não prova nada: veja origem, hash e conexões."],["O hash é conhecido como malicioso. Próximo passo?",["Isolar o PC pelo EDR, escalar e coletar evidências","Reiniciar o PC","Apagar o arquivo e seguir","Avisar só no fim do mês"],"Isolar impede que a ameaça se espalhe e preserva evidências."],["Como registrar o caso?",["O que aconteceu, quando, máquina e usuário, indicadores (hash, IP), ações e próximos passos","Só “resolvido”","Opinião sobre o usuário","Nada"],"Um bom registro permite que outra pessoa continue o caso."]],"EDR alert: update.exe ran from Temp on PC-12 and made external connections.\nAssessment: file hash known as malicious.\nAction: isolated the host, collected evidence, escalated to Tier 2.\nIOCs: file hash and destination IP recorded."],
["Phishing em massa","CASO #3027\n10 usuários reportaram um e-mail “Fatura em atraso” com anexo.","Prioridade alta",[["Como tratar vários relatos iguais?",["Tratar como campanha: analisar uma amostra, achar o padrão e ver quem abriu ou clicou","Responder um por um sem ligar os casos","Ignorar, são só 10","Abrir o anexo no seu PC"],"Vários relatos iguais indicam uma campanha, não casos isolados."],["3 usuários abriram o anexo. Qual a prioridade?",["Isolar e investigar esses 3 computadores, resetar as senhas e checar o que mais eles fizeram","Só apagar o e-mail","Punir os usuários","Esperar"],"Quem abriu o anexo pode estar comprometido: contenha primeiro."],["Para reduzir novos casos?",["Bloquear remetente, domínio e anexo, remover o e-mail das caixas e avisar os usuários","Nada, é raro","Desligar o e-mail da empresa","Só pedir cuidado"],"Bloquear, remover e comunicar reduz o impacto."]],"Phishing campaign: 10 reports of a fake invoice email with an attachment.\nImpact: 3 users opened the attachment.\nAction: isolated the 3 hosts, reset passwords, blocked the sender and domain, removed the email from mailboxes, notified users."],
["Muitos bloqueios de conta", "ALERTA SIEM #3040\n40 eventos 4625 (falha de login) em 2 min contra a conta ops-admin, seguidos de um 4740 (conta bloqueada). Origem: um único IP externo.", "Prioridade alta", [["O que esse padrão sugere?", ["Tentativa de força bruta contra a conta", "Uso normal", "Falha do monitor", "Atualização do Windows"], "Muitas falhas rápidas, seguidas de bloqueio e vindas de um IP externo, é o padrão clássico de força bruta."], ["O que você verifica?", ["Se houve um 4624 (sucesso) depois, de que IP e se a conta fez algo suspeito", "Só o nome do IP", "Nada, a conta já está bloqueada", "O papel de parede do PC"], "A conta bloqueada pode ter sido o fim do ataque, mas um 4624 antes do bloqueio ou de outro IP muda tudo."], ["Ações corretas?", ["Bloquear o IP, confirmar com o dono da conta, forçar troca de senha se houve sucesso, registrar os IOCs e escalar se preciso", "Desbloquear sem verificar", "Apagar os logs", "Ignorar"], "Contenha, confirme, registre os indicadores e escale. Nunca apague logs."]], "Alert: 40 failed logins (4625) against ops-admin followed by a lockout (4740) from one external IP.\nAssessment: brute-force attempt; no successful login (4624) found.\nAction: blocked the source IP, informed the account owner, recorded the IP as an IOC.\nResult: contained, monitoring continues."],
["Usuário adicionado a Domain Admins", "ALERTA SIEM #3052\nEvento 4728: o usuário temp-user foi adicionado ao grupo Domain Admins às 02:10 pela conta svc-backup.", "Prioridade crítica", [["Por que isso é grave?", ["Domain Admins controla todo o domínio. Um acesso indevido pode comprometer a empresa inteira", "É só um grupo qualquer", "É normal à noite", "É um alerta de impressora"], "Domain Admins é o grupo mais poderoso do AD. Mudanças nele devem ser raras, aprovadas e documentadas."], ["O que checar?", ["Se existe um chamado de mudança aprovado, quem fez, de qual máquina e o que mais a conta svc-backup fez", "Só a cor do alerta", "Nada, esperar de manhã", "Se o usuário gosta do TI"], "Sem mudança aprovada e com uma conta de serviço fazendo algo fora do normal, é muito suspeito."], ["Sem mudança aprovada, qual é a ação?", ["Escalar como incidente crítico, remover o usuário do grupo conforme o procedimento, isolar a origem e preservar evidências", "Deixar para depois do fim de semana", "Apagar o usuário e os logs", "Ignorar"], "Contenha rapidamente e escale. Preserve os logs para a investigação."]], "Alert: user temp-user added to Domain Admins (event 4728) at 02:10 by svc-backup. No approved change found.\nAssessment: probable privilege escalation.\nAction: escalated as critical, removed the user from the group per procedure, isolated the source host, preserved logs.\nResult: handed to Tier 2."]
]}

let CT=null,CC=null,CS=0,CP=0,CR=null;
function rCh(){const el=$("v6");S.ch=S.ch||{};
if(CT===null){el.innerHTML='<p class="mu">Situações reais de trabalho. Escolha uma carreira.</p>'+CH.map((t,i)=>{const done=t.l.filter((_,j)=>S.ch[t.k+j]).length;return `<button class="note tc" data-tr="${i}" style="--c:${t.c}"><span class="ic">${t.ic}</span><span class="tx"><b>${esc(t.n)}</b><span class="mu">${esc(t.d)}</span><span class="mu">${done} de ${t.l.length} desafios concluídos</span><span class="bar"><i style="width:${100*done/t.l.length}%"></i></span></span><span class="ch">›</span></button>`}).join("");el.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{CT=+b.dataset.tr;CC=null;rCh()});return}
const t=CH[CT];
if(CC===null){el.innerHTML=`<button class="btn" id="cb" style="width:100%;margin-bottom:8px">← Carreiras</button><h2>${t.ic} ${esc(t.n)}</h2>`+t.l.map((c,j)=>`<button class="note" data-j="${j}" style="padding:14px"><b>${esc(c[0])}</b><span class="mu" style="display:block;font-weight:400">${S.ch[t.k+j]?"✅ Melhor: "+S.ch[t.k+j].b+"/"+c[3].length:"Ainda não feito"} · ${esc(c[2])}</span></button>`).join("");$("cb").onclick=()=>{CT=null;rCh()};el.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{CC=+b.dataset.j;CS=0;CP=0;CR=null;rCh()});return}

const RC={offsec:["Segurança ofensiva = atacar com autorização para achar falhas antes dos criminosos.", "Sempre há contrato por escrito com escopo. Sem isso é crime.", "Hackers: white hat (ético), black hat (criminoso) e grey hat (sem permissão, sem má intenção, ainda ilegal).", "Fases: reconhecimento, enumeração, exploração, pós-exploração e relatório.", "Vulnerabilidade = falha. Ameaça = quem pode usar. Exploit = método. Risco = chance e estrago.", "Esconder uma página não é proteger. Foi a lição do banco falso.","Banco falso: dirb achou a página /bank-transfer, que permitia depositar dinheiro. A defesa mais eficaz é exigir login.","Sarah testa logins fracos (ofensiva). Mike cria regra de firewall (defensiva)."],defsec:["Defensiva = prevenir, detectar e responder. É o blue team.", "SOC: equipe que monitora alertas, investiga e responde.", "Threat Intelligence: estudar atacantes e indicadores (IPs, domínios).", "DFIR: forense digital e resposta a incidentes.", "Malware analysis: entender o que um programa malicioso faz.", "SIEM: reúne logs e gera alertas.","Exercício FakeBank: alerta de login suspeito, parar o ataque (desativar a conta), investigar (threat intelligence, grupo ShadowFigures) e relatório de incidente.","Ao detectar invasão, primeiro confirmar e entender, depois agir. Falso que a prioridade seja eliminar na hora."],careers:["Defesa: analista de SOC, engenheiro, respondedor de incidentes, perito forense, analista de malware, threat intelligence.", "Ofensiva: pentester e red teamer.", "GRC: governança, risco e conformidade (políticas e auditorias).", "Caminho comum: help desk, SOC nível 1, nível 2 ou 3 ou especialização."],insidepc:["CPU executa. RAM guarda o que está em uso e apaga ao desligar. Armazenamento guarda para sempre.", "Volátil = perde sem energia (RAM). Não volátil = SSD, HDD, pendrive.", "SSD (chips, rápido) x HDD (disco giratório, mais lento e barato).", "BIOS/UEFI testa o hardware e inicia o boot. O SO é carregado na RAM.", "Forense: captura a RAM antes de desligar. CPU em 100% sem motivo pode ser minerador.","Corpo humano (sala): CPU cérebro, RAM memória curta, HDD e SSD memória longa, placa-mãe esqueleto e nervos, PSU coração e pulmões, GPU córtex visual.","Boot: botão, firmware UEFI (substituiu o BIOS), POST, dispositivo de boot, bootloader (leva o SO para a RAM)."],ctypes:["Tipos: PC, servidor, celular e tablet, embarcado, IoT, mainframe, supercomputador.", "Servidor: fornece serviços, fica ligado o tempo todo, atende muitos clientes.", "Embarcado: chip pequeno com função fixa. IoT: aparelho conectado à internet.", "IoT é risco: senha padrão e poucas atualizações. Pode virar botnet.", "Inventário de ativos: não se protege o que não se conhece.","Exercício da empresa atacada: tudo que tem chip e rede é computador, até a cafeteira. Desligue e isole todos."],clientserver:["Cliente faz o pedido, servidor responde. Exemplo: navegador e servidor web.", "Pedido, processamento, resposta.", "IP diz onde está o servidor, a porta diz qual serviço, o DNS traduz nomes em IP.", "Cliente-servidor: servidor central. P2P: cada aparelho é cliente e servidor.", "DDoS: muitos pedidos falsos derrubam o servidor (disponibilidade).", "Códigos: 200 ok, 403 proibido, 404 não encontrado, 500 erro do servidor.","Pizzaria: cliente pede (request), servidor responde (response), protocolo são as regras, porta é a porta de cada serviço, DNS é o GPS.","HTTP não tem estado: o site usa cookie ou token de sessão. Métodos: GET pede, POST envia. URL: scheme, host e arquivo."],encoding:["Caractere = número com significado combinado. Esse combinado é a codificação (encoding).","Símbolos estranhos no texto: quem salvou e quem abriu usaram codificações diferentes (mojibake).","ASCII: 1963, 7 bits, 128 códigos (0 a 127). A é 65, a é 97, 0 é 48. Letras e dígitos em ordem.","Códigos 0 a 31 e 127 são de controle. 10 é LF (nova linha), 127 é DEL.","TryHackMe em hex: 54 72 79 48 61 63 6b 4d 65 0a.","ISO-8859-1 (Europa Ocidental) e ISO-8859-2 (Europa Central) usam os códigos acima de 127 de formas diferentes. Daí a confusão.","Unicode: um número único (code point, como U+0041) para cada caractere do mundo, quase 157 mil na versão 17.0.","UTF-8: 1 a 4 bytes, compatível com o ASCII, muito comum na web. UTF-16: 2 ou 4 bytes (par substituto). UTF-32: sempre 4 bytes.","Segurança: filtro e servidor podem decodificar de formas diferentes, e letras parecidas de outros alfabetos disfarçam endereços. Codificar não é criptografar."],virt:["VM = computador feito de software dentro de outro. Host = físico. Guest = VM. Hypervisor = gerencia.", "Tipo 1 roda direto no hardware (servidores). Tipo 2 roda em um SO (VirtualBox).", "Benefícios: economia, isolamento, snapshots, flexibilidade.", "Container compartilha o SO do host: mais leve e menos isolado.", "Segurança: sandbox para testar arquivos suspeitos. Riscos: VM escape e hypervisor invadido.","Antes: um servidor para cada aplicação. Custo alto, uso de 5% a 20%, implantação lenta, difícil de crescer.","Prédio: servidor físico, apartamentos são as VMs, moradores são as aplicações, síndico é o hypervisor.","Tipo 1: produção, banco de dados, data center. Tipo 2: estudo, malware, Kali, testes. Ao testar malware, isole a VM.","Container usa o kernel do host (por isso não roda container Windows em Linux). Imagem de container = receita. Docker cria e roda containers.","AutoGalo: reiniciar Mail-SERVER em Error, criar Marketing-VM (4 núcleos, 8 GB, 100 GB), HV-PROD-02 quase cheio (98% CPU), HV-BACKUP-01 desconectado."],segso:["Hardware = parte física. Software = programas. SO = camada entre os dois.", "Tipos de SO: computador (Windows 11, macOS), celular (Android, iOS), servidor (Windows Server, IBM AIX) e Linux (os dois).", "CIA: Confidencialidade (só quem deve vê), Integridade (ninguém altera), Disponibilidade (funciona quando preciso).", "Autenticação: algo que você sabe, é e tem. Dois ou mais juntos = MFA.", "Boa senha: longa, única, frase de palavras sem relação, em um gerenciador. Evite padrões de teclado e trocas como p4ssw0rd.", "Menor privilégio: cada um acessa só o que precisa. Permissões fracas atingem confidencialidade e integridade.", "Trojan dá acesso ao atacante. Ransomware criptografa os arquivos e atinge a disponibilidade.","SSH: acesso remoto criptografado, porta TCP/22, também transfere arquivos (SCP e SFTP). Autentica por senha ou por par de chaves. Substituiu o Telnet, que era em texto puro.","Lab: senha digitada no Linux não aparece (normal). ls não mostra escondidos (use ls -a). cat mostra arquivo. history mostra comandos antigos, e senha digitada por engano fica lá."],dados:["O computador só entende 2 estados, escritos como 0 e 1 (binário, base 2).", "Decimal: base 10 (0 a 9). Hexadecimal: base 16 (0 a 9 e A a F). Octal: base 8 (0 a 7).", "4 bits viram 1 dígito hex. 3 bits viram 1 dígito octal.", "Bit = 0 ou 1. Byte = 8 bits = octeto. Um byte vai de 0 a 255.", "Cor = vermelho, verde e azul (RGB), 1 byte cada: 256 x 256 x 256 = 16.777.216 cores. Hex: #RRGGBB.", "Onde aparece: IPv4 (4 octetos), MAC (hex), hashes de arquivos (hex) e permissões do Linux (octal)."],redes:["Abrir um site: o DNS descobre o IP, o TCP conecta (SYN, SYN-ACK, ACK), o TLS protege e o HTTP pede a página.","IP = onde estou agora (muda por rede). MAC = número de série da placa de rede.","DNS traduz nome em IP (porta 53). DHCP entrega IP, máscara, gateway e DNS.","TCP = carta registrada (confirma a entrega). UDP = panfleto (rápido, sem garantia).","Switch liga aparelhos da mesma rede. Roteador liga redes diferentes. Firewall filtra por regras.","Portas: 22 SSH, 23 Telnet (inseguro), 25 SMTP, 53 DNS, 80 HTTP, 443 HTTPS, 445 SMB, 3389 RDP.","OSI: IP na camada 3, TCP e UDP na 4, HTTP e DNS na 7. Frase: Please Do Not Throw Sausage Pizza Away.","Códigos HTTP: 200 OK, 301 movido, 401 sem login, 403 proibido, 404 não encontrado, 500 erro no servidor."],
cloud:["Duas perguntas: ONDE a nuvem fica (pública, privada, híbrida) e QUANTO você gerencia (IaaS, PaaS, SaaS).","IaaS: quarto vazio (EC2). PaaS: apartamento mobiliado. SaaS: hotel, tudo pronto (Gmail, Zoom).","Responsabilidade compartilhada: o provedor protege a infraestrutura; você protege contas, permissões, dados e configurações.","Benefícios: escalabilidade, autosserviço, pagar pelo que usa, alta disponibilidade e acesso global.","Erros comuns: armazenamento público, chaves no código e permissão demais."],
so:["O sistema operacional é a ponte entre os apps e o hardware (Windows, Linux, macOS, Android).","Kernel = cozinha (acesso total ao hardware). User space = salão (apps com permissão limitada).","GUI = visual, com janelas e cliques. CLI = texto, mais rápida e automatizável.","Processo = programa em execução. Driver = tradutor entre o SO e um dispositivo.","Logs: Event Viewer no Windows e /var/log no Linux."],
win:["Desktop, Taskbar, Start Menu e Search: para navegar e achar coisas.","File Explorer = arquivos. Microsoft Store = apps. Windows Update = correções e segurança.","Settings (moderno) e Control Panel (antigo) configuram o computador.","Task Manager (Ctrl+Shift+Esc): vê CPU, memória e disco e encerra app travado.","Windows Security = proteção contra ameaças. Firewall = controla o tráfego de rede.","Programa desconhecido usando muito processador? Task Manager primeiro."],
linux:["pwd = onde estou. ls = o que tem aqui. ls -l = detalhes. ls -al = com arquivos ocultos.","cd entra na pasta, cd .. sobe um nível, cd - volta ao lugar anterior.","cat lê um arquivo. find procura arquivos.","whoami = meu usuário. uname -a = sistema e kernel. df -h = espaço em disco.","/etc guarda configurações. cat /etc/os-release mostra a versão do Linux.","No Linux, maiúsculas e minúsculas fazem diferença."],
wcli:["cd (sozinho) = onde estou. dir = o que tem. dir /a = com ocultos. dir /s = procura nas subpastas.","cd .. sobe um nível. type lê um arquivo.","whoami = usuário. hostname = nome do PC. systeminfo = versão do Windows. ipconfig = rede (com /all: MAC, DNS, DHCP).","Linux para Windows: pwd é cd, ls é dir, cat é type, find é dir /s, uname -a é systeminfo."],
ms:["AD DS = cadastro central de usuários, computadores e grupos. O Domain Controller (DC) valida os logins.","ADUC (dsa.msc): criar usuário, resetar senha, Unlock account e ver grupos (Member Of).","OU organiza e recebe GPO. Grupo dá permissão. A permissão vai para o grupo, não para a pessoa.","GPO = regras para muitos PCs. gpupdate /force atualiza e gpresult /r mostra o que está aplicado.","Bloqueada = tentativas erradas. Desativada = o TI desligou. Expirada = senha velha.","Entra ID = identidade na nuvem. Sem licença do Microsoft 365 não existe e-mail.","MFA = senha mais um segundo fator. Celular novo: confirme a identidade e redefina os métodos.","Intune gerencia dispositivos. Perdeu o aparelho? Lock, Wipe ou Retire.","O AD precisa do DNS. Sem DHCP aparece o IP 169.254.x.x.","Saída de funcionário: desativar, tirar dos grupos, recolher aparelhos e só depois apagar, pela política.","Event IDs: 4624 login ok, 4625 falha, 4740 bloqueio, 4720 conta criada."],
soc:["SOC = time que vigia a segurança 24h. Nível 1 faz triagem, Nível 2 investiga, Nível 3 caça ameaças e lidera.","Alerta: ler, checar o contexto, decidir falso ou verdadeiro positivo, conter ou escalar e registrar no ticket.","Falso positivo = alerta à toa. Falso negativo = ataque real sem alerta (o pior).","SIEM junta logs. EDR vigia e isola computadores. Firewall e IDS/IPS filtram e detectam tráfego.","Incidente (NIST): preparação; detecção e análise; contenção, erradicação e recuperação; lições aprendidas.","MITRE ATT&CK = catálogo de táticas e técnicas. Força bruta: T1110. Phishing: T1566.","CIA = Confidencialidade, Integridade e Disponibilidade.","Phishing: veja o remetente, o link sem clicar, o anexo e quem mais recebeu."],
vagas:["Mais pedidos: Redes, Windows, Linux, logs, SIEM (Splunk, Sentinel), EDR e MITRE.","Security+ é a certificação de entrada mais comum. SC-200 vem depois.","Vaga júnior que pede 2 anos: mostre provas práticas, como write-ups e home lab.","Leia os requisitos de SC/BPSS e de turnos antes de se candidatar.","Nunca invente experiência."],
ent:["Fale em voz alta e em inglês. Use STAR: Situação, Tarefa, Ação e Resultado.","Prepare 2 histórias reais do seu trabalho em TI.","Não sabe a resposta? Diga o que sabe, como investigaria e admita o que não sabe.","Leve 3 perguntas para fazer ao entrevistador.","Sobre turnos: responda com sinceridade."]};
function dkey(d){d=d||new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}

function hCount(o){return o?Object.keys(o.t||{}).filter(k=>o.t[k]).length:0}
function hStreak(){const H=S.hoje||{};let n=0,d=new Date();if(hCount(H[dkey(d)])<3)d.setDate(d.getDate()-1);while(hCount(H[dkey(d)])>=3){n++;d.setDate(d.getDate()-1)}return n}
