{id:"powershell",n:"PowerShell para Análise",ic:"⚡",tags:["PowerShell"],st:"<p class=\"mu\">O PowerShell é a linha de comando moderna do Windows (também roda no Linux e no Mac). Para abrir: tecla Windows, digite <b>powershell</b> e Enter. Já existe no Windows, não precisa instalar.</p>\n<h3>O que é, em uma frase</h3>\n<p>No CMD tudo é <b>texto</b>. No PowerShell tudo é <b>objeto</b>: cada linha de um log vira uma ficha com campos (usuário, IP, horário), e você filtra pelos campos em vez de procurar palavras no texto.</p>\n<h3>Comparação do dia a dia</h3>\n<p>Pense numa planilha. O CMD te entrega a planilha impressa em papel: para achar algo, você lê linha por linha. O PowerShell te entrega a planilha no Excel: você filtra a coluna \"IP\", ordena a coluna \"horário\" e conta quantas linhas sobraram.</p>\n<h3>Como os comandos funcionam</h3>\n<ul>\n<li>Os comandos se chamam <b>cmdlets</b> e têm o formato <b>Verbo-Substantivo</b>: Get-ChildItem (pegar os itens da pasta), Get-Content (pegar o conteúdo), Import-Csv (importar um CSV).</li>\n<li>O <b>pipeline</b> <code>|</code> passa os objetos de um comando para o próximo, como uma esteira de fábrica.</li>\n<li>Muitos comandos do Linux e do CMD funcionam como apelido: <b>ls</b>, <b>dir</b>, <b>cat</b>, <b>cd</b>.</li>\n<li>Perdido? <b>Get-Help</b> Nome-Do-Comando explica o comando. <b>Get-Command</b> *event* procura comandos. <b>Get-Member</b> mostra os campos de um objeto.</li>\n</ul>\n<h3>Os 8 comandos que mais aparecem numa investigação</h3>\n<table><tr><th>Comando</th><th>Para que serve</th></tr>\n<tr><td>Get-Content arquivo.log</td><td>Ler um arquivo de texto (como o cat)</td></tr>\n<tr><td>Select-String \"Failed\"</td><td>Procurar texto (como o grep)</td></tr>\n<tr><td>Import-Csv logins.csv</td><td>Transformar cada linha do CSV em objeto</td></tr>\n<tr><td>Where-Object</td><td>Filtrar: fica só o que bate com a condição</td></tr>\n<tr><td>Select-Object</td><td>Escolher colunas, ou as primeiras linhas (-First 5)</td></tr>\n<tr><td>Sort-Object</td><td>Ordenar (com -Descending, do maior para o menor)</td></tr>\n<tr><td>Group-Object</td><td>Agrupar e contar: quantas vezes cada IP aparece</td></tr>\n<tr><td>Measure-Object</td><td>Contar o total de linhas</td></tr>\n</table>\n<h3>Comparar valores</h3>\n<p>No PowerShell não se usa = nem &gt; para comparar. Usa-se: <b>-eq</b> (igual), <b>-ne</b> (diferente), <b>-gt</b> (maior que), <b>-lt</b> (menor que), <b>-like</b> (parecido, com *) e <b>-match</b> (expressão regular).</p>\n<h3>Exemplo prático: quem errou mais a senha?</h3>\n<pre>Import-Csv logins.csv |\n  Where-Object event_code -eq 4625 |\n  Group-Object source_ip |\n  Sort-Object Count -Descending |\n  Select-Object -First 5 Name, Count</pre>\n<p>Lendo em português: abra o CSV, fique só com os logins que falharam (4625), agrupe por IP, ordene do que mais falhou para o que menos falhou e mostre os 5 primeiros. Isso responde em segundos a pergunta mais comum de um ataque de força bruta.</p>\n<h3>Logs do Windows direto no PowerShell</h3>\n<ul>\n<li><b>Get-WinEvent</b> lê o Visualizador de Eventos. Exemplo: <code>Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} -MaxEvents 20</code> traz os 20 últimos logins com falha.</li>\n<li>Ler o log Security exige abrir o PowerShell <b>como administrador</b>.</li>\n<li><b>ConvertFrom-Json</b> transforma JSON (logs de nuvem, como o Entra ID) em objetos.</li>\n</ul>\n<h3>No dia a dia de um SOC</h3>\n<ul>\n<li>Responder rápido: quantas falhas, de qual IP, contra quais contas, a que horas.</li>\n<li>Coletar evidências de uma máquina: processos (Get-Process), conexões (Get-NetTCPConnection), serviços (Get-Service).</li>\n<li><b>Os atacantes também usam PowerShell</b> (técnica T1059.001 do MITRE). Sinais suspeitos: <code>-EncodedCommand</code> (comando escondido em Base64), <code>-WindowStyle Hidden</code>, <code>IEX</code> baixando algo da internet.</li>\n<li>O evento <b>4104</b> (log Microsoft-Windows-PowerShell/Operational) grava o código dos scripts que rodaram, quando o registro de script block está ligado. É ouro numa investigação.</li>\n</ul>\n<h3>Erros comuns</h3>\n<ul>\n<li>Usar = em vez de -eq dentro do Where-Object.</li>\n<li>Esquecer as aspas em texto com espaço: \"Failed password\".</li>\n<li>Achar que a \"política de execução\" (Execution Policy) é uma proteção de segurança. Ela só evita rodar scripts sem querer; um atacante desvia dela facilmente.</li>\n</ul>\n<h3>Pratique no lab</h3>\n<p>No lab, aba <b>Terminal → PowerShell</b>, os desafios começam contando arquivos e terminam investigando um ataque com Get-WinEvent. Faça na ordem: cada um usa um comando novo.</p>\n<h3>Como explicar numa entrevista</h3>\n<p><b>Why is PowerShell useful for a SOC analyst?</b><br><i>It works with objects, so I can filter, group and count log events by field. For example, I can import a CSV of sign-ins, keep only event 4625 and group by source IP to find a brute-force source in a few seconds.</i></p>\n<p><b>How can attackers abuse PowerShell, and how would you spot it?</b><br><i>They run encoded or hidden commands and download payloads into memory. I look for -EncodedCommand, hidden windows and downloads in process command lines, and I check event 4104 for the script content.</i></p>",chk:["Explicar a diferença entre texto (CMD) e objetos (PowerShell)", "Usar o pipeline com Where-Object, Sort-Object e Select-Object", "Contar com Group-Object e Measure-Object", "Comparar com -eq, -ne, -gt, -like e -match", "Ler logs do Windows com Get-WinEvent e -FilterHashtable", "Achar ajuda com Get-Help, Get-Command e Get-Member", "Citar 3 sinais de PowerShell malicioso", "Acertar 8 de 10 no quiz de PowerShell"]},
{id:"logs",n:"Logs e Eventos",ic:"📜",tags:["Logs"],st:"<h3>O que é um log</h3>\n<p>Log é o <b>diário</b> de um sistema: cada linha diz o que aconteceu, quando, onde e com quem. Um login, um erro de senha, um programa que abriu, um arquivo apagado. Sem logs, o SOC fica cego: é neles que você descobre o que um atacante fez.</p>\n<h3>Comparação do dia a dia</h3>\n<p>É a câmera de segurança de um prédio, só que em texto. Ela não impede ninguém de entrar, mas mostra quem entrou, por qual porta e a que horas. O seu trabalho é assistir às gravações certas.</p>\n<h3>As 5 perguntas que todo log responde</h3>\n<ul><li><b>Quando?</b> data e hora (atenção ao fuso horário, normalmente UTC).</li><li><b>Onde?</b> qual máquina ou serviço.</li><li><b>Quem?</b> qual usuário ou conta.</li><li><b>De onde?</b> qual IP de origem.</li><li><b>O quê e o resultado?</b> login, falha, criação de conta, sucesso ou erro.</li></ul>\n<h3>Windows: o Visualizador de Eventos</h3>\n<p>Fica em Event Viewer (tecla Windows → \"Visualizador de Eventos\"). Os mais importantes estão em <b>Logs do Windows → Segurança</b>. Cada evento tem um número, o <b>Event ID</b>. Os que mais aparecem no SOC:</p>\n<table><tr><th>Event ID</th><th>O que significa</th></tr>\n<tr><td>4624</td><td>Login com sucesso</td></tr>\n<tr><td>4625</td><td>Login com falha (senha errada ou usuário que não existe)</td></tr>\n<tr><td>4634</td><td>Logoff (a pessoa saiu)</td></tr>\n<tr><td>4672</td><td>Login de uma conta com privilégios de administrador</td></tr>\n<tr><td>4688</td><td>Um programa (processo) foi iniciado</td></tr>\n<tr><td>4720</td><td>Uma conta de usuário foi criada</td></tr>\n<tr><td>4728 / 4732</td><td>Alguém foi colocado num grupo (por exemplo, administradores)</td></tr>\n<tr><td>4740</td><td>Conta bloqueada por muitas senhas erradas</td></tr>\n<tr><td>4767</td><td>Conta desbloqueada</td></tr>\n<tr><td>1102</td><td>O log de segurança foi apagado (muito suspeito!)</td></tr>\n</table>\n<h3>Tipo de login (Logon Type)</h3>\n<p>Os eventos 4624 e 4625 dizem <b>como</b> a pessoa tentou entrar: <b>2</b> = no teclado da máquina, <b>3</b> = pela rede (pasta compartilhada), <b>10</b> = Área de Trabalho Remota (RDP), <b>5</b> = serviço. Um tipo 10 vindo da internet às 3 da manhã chama atenção.</p>\n<h3>Sysmon: o log com mais detalhes</h3>\n<p>O Sysmon é uma ferramenta gratuita da Microsoft que registra muito mais coisa: <b>1</b> = processo criado (com a linha de comando completa), <b>3</b> = conexão de rede, <b>11</b> = arquivo criado, <b>22</b> = consulta DNS. Muitas empresas usam porque o log padrão do Windows não mostra tudo.</p>\n<h3>Linux</h3>\n<ul><li>Logins e sudo ficam em <b>/var/log/auth.log</b> (Ubuntu, Debian) ou <b>/var/log/secure</b> (Red Hat, CentOS).</li><li>Frases que importam: <b>Failed password</b> (senha errada), <b>Invalid user</b> (usuário que não existe), <b>Accepted password</b> (entrou), <b>sudo</b> (virou administrador para um comando).</li></ul>\n<h3>Nuvem</h3>\n<p>No Microsoft Entra ID (antigo Azure AD), os <b>sign-in logs</b> mostram cada login na nuvem, com país, aplicativo e um código de resultado (0 = sucesso; 50126 = usuário ou senha errados). Vêm em JSON.</p>\n<h3>No dia a dia de um SOC</h3>\n<ul><li><b>Força bruta:</b> muitos 4625 seguidos do mesmo IP.</li><li><b>Password spray:</b> poucas tentativas em muitas contas diferentes, do mesmo IP, para não bloquear ninguém.</li><li><b>Sucesso depois de muitas falhas:</b> um 4624 logo após vários 4625 = o atacante pode ter acertado.</li><li><b>Persistência:</b> conta nova (4720) colocada no grupo de administradores (4732) fora do horário.</li><li><b>Apagar rastros:</b> evento 1102 quase nunca é normal.</li></ul>\n<h3>Erros comuns</h3>\n<ul><li>Esquecer o fuso horário e montar a linha do tempo errada.</li><li>Olhar só as falhas e não ver o sucesso que veio depois.</li><li>Achar que \"não tem log\" significa \"não aconteceu\": às vezes o registro estava desligado.</li></ul>\n<h3>Pratique no lab</h3>\n<p>Os desafios da aba Praticar usam logs de verdade do lab: auth.log do Linux, um export do Visualizador de Eventos e o CSV de logins. Você vai contar 4625, achar o atacante e descobrir quem desbloqueou uma conta.</p>\n<h3>Como explicar numa entrevista</h3>\n<p><b>Which Windows event IDs do you know?</b><br><i>4624 is a successful logon and 4625 a failed one. 4740 means an account was locked out, 4720 a user was created, 4688 a process started and 1102 means the security log was cleared, which is very suspicious.</i></p>\n<p><b>What is the difference between brute force and password spraying?</b><br><i>Brute force tries many passwords against one account. Password spraying tries a few common passwords against many accounts, so no single account gets locked.</i></p>",chk:["Explicar o que é um log e as 5 perguntas que ele responde", "Saber de cor 4624, 4625, 4740 e 4720", "Explicar os tipos de login 2, 3 e 10", "Dizer para que serve o Sysmon", "Achar logins no Linux (auth.log ou secure)", "Diferenciar força bruta de password spray", "Acertar 8 de 10 no quiz de Logs"]},
{id:"siem",n:"SIEM e Consultas (SPL e KQL)",ic:"🔎",tags:["SIEM"],st:"<h3>O que é um SIEM</h3>\n<p>SIEM (Security Information and Event Management) é o sistema que <b>junta os logs de todas as máquinas num lugar só</b>, deixa você pesquisar neles e dispara alertas quando algo bate com uma regra. É a ferramenta principal do analista de SOC: é a primeira coisa que as vagas pedem.</p>\n<h3>Comparação do dia a dia</h3>\n<p>Imagine os logs de 5 mil computadores espalhados como cadernos em 5 mil gavetas. O SIEM recolhe todos os cadernos para uma biblioteca, organiza por data e cria um índice. Aí você pergunta \"quem errou a senha mais de 20 vezes hoje?\" e recebe a resposta em segundos.</p>\n<h3>O que o SIEM faz</h3>\n<ol><li><b>Coleta</b> os logs (Windows, Linux, firewall, nuvem, e-mail).</li><li><b>Normaliza</b>: dá o mesmo nome para o mesmo campo, venha de onde vier (ex.: o IP de origem sempre como src_ip).</li><li><b>Correlaciona</b>: liga eventos de fontes diferentes (falhas no VPN + login com sucesso + acesso a arquivos).</li><li><b>Alerta</b> quando uma regra é atendida.</li><li><b>Guarda</b> o histórico para investigar depois.</li></ol>\n<h3>Os mais pedidos nas vagas</h3>\n<ul><li><b>Splunk</b>, com a linguagem <b>SPL</b>.</li><li><b>Microsoft Sentinel</b>, com a linguagem <b>KQL</b> (a mesma do Defender XDR).</li><li>Também aparecem: IBM QRadar, Elastic (ELK) e Google SecOps.</li></ul>\n<p>Aprenda bem um dos dois primeiros. A lógica é a mesma, só muda a escrita.</p>\n<h3>A mesma pergunta nas duas linguagens</h3>\n<p><b>\"Quais IPs mais erraram a senha nas últimas 24 horas?\"</b></p>\n<p>Splunk (SPL):</p>\n<pre>index=wineventlog EventCode=4625 earliest=-24h\n| stats count by src_ip\n| sort - count\n| head 10</pre>\n<p>Microsoft Sentinel (KQL):</p>\n<pre>SecurityEvent\n| where TimeGenerated &gt; ago(24h)\n| where EventID == 4625\n| summarize count() by IpAddress\n| top 10 by count_</pre>\n<p>Repare: as duas fazem <b>filtrar → agrupar e contar → ordenar → mostrar os primeiros</b>. É a mesma ideia do pipeline do PowerShell e do grep | sort | uniq -c do Linux. Quem entende um entende os outros.</p>\n<h3>Dicionário rápido</h3>\n<table><tr><th>Quero...</th><th>SPL</th><th>KQL</th></tr>\n<tr><td>Filtrar</td><td>campo=valor ou | where</td><td>| where campo == valor</td></tr>\n<tr><td>Contar por campo</td><td>| stats count by campo</td><td>| summarize count() by campo</td></tr>\n<tr><td>Ordenar</td><td>| sort - count</td><td>| sort by count_ desc</td></tr>\n<tr><td>Escolher colunas</td><td>| table a, b</td><td>| project a, b</td></tr>\n<tr><td>Primeiros N</td><td>| head 10</td><td>| take 10 ou | top 10 by</td></tr>\n<tr><td>Período</td><td>earliest=-24h</td><td>where TimeGenerated &gt; ago(24h)</td></tr>\n</table>\n<h3>Regras de detecção</h3>\n<p>Um alerta nasce de uma <b>regra</b>: uma consulta que roda sozinha de tempos em tempos. Exemplo: \"mais de 20 falhas do mesmo IP em 5 minutos\". Regras boas pegam ataques sem gerar alertas demais. <b>Sigma</b> é um formato aberto para escrever regras uma vez e convertê-las para Splunk, Sentinel e outros.</p>\n<h3>No dia a dia de um SOC</h3>\n<ul><li>Chega um alerta: você abre no SIEM e pesquisa o que mais aquele IP ou usuário fez antes e depois.</li><li>Monta a <b>linha do tempo</b>: primeira falha, primeiro sucesso, o que fez depois de entrar.</li><li>Ajusta regras que geram falso positivo demais (ex.: ignorar o scanner de vulnerabilidades da própria empresa).</li></ul>\n<h3>Erros comuns</h3>\n<ul><li>Pesquisar sem limitar o período: a busca demora e traz lixo.</li><li>Confiar só no alerta e não olhar o contexto em volta.</li><li>Em KQL, usar = em vez de == para comparar.</li></ul>\n<h3>Pratique no lab</h3>\n<p>Os desafios desta aba fazem com grep, awk e PowerShell exatamente o que uma consulta de SIEM faz: filtrar, agrupar e contar no dataset de logins. No painel do lab, cada regra de detecção pode ser exportada como consulta SPL, KQL e Sigma: compare com o que você escreveu.</p>\n<h3>Como explicar numa entrevista</h3>\n<p><b>What is a SIEM and why does a SOC need one?</b><br><i>A SIEM collects and normalises logs from across the company, correlates them and raises alerts based on detection rules. Without it, analysts would have to search every system separately.</i></p>\n<p><b>How would you find the top sources of failed logons?</b><br><i>In Splunk: filter EventCode 4625, then stats count by src_ip and sort descending. In Sentinel: SecurityEvent, where EventID == 4625, summarize count() by IpAddress and take the top 10.</i></p>",chk:["Explicar o que é um SIEM e as 5 coisas que ele faz", "Citar Splunk (SPL) e Sentinel (KQL)", "Escrever a consulta de falhas por IP em SPL", "Escrever a mesma consulta em KQL", "Explicar como uma regra vira alerta", "Montar uma linha do tempo a partir dos logs", "Acertar 8 de 10 no quiz de SIEM"]},
{id:"phishing",n:"Análise de Phishing",ic:"🎣",tags:["Phishing"],st:"<h3>O que é phishing</h3>\n<p>Phishing é um e-mail (ou SMS, ou mensagem) que <b>finge ser de alguém confiável</b> para fazer a pessoa clicar num link, abrir um anexo ou passar a senha. É a forma mais comum de ataque começar, e analisar e-mails suspeitos é tarefa diária do SOC Nível 1.</p>\n<h3>Comparação do dia a dia</h3>\n<p>É o golpista que liga dizendo ser do banco. A voz é educada e o assunto parece real, mas o número de telefone é estranho e ele tem pressa. No e-mail, o \"número estranho\" está nos <b>cabeçalhos</b>, e a pressa está no texto.</p>\n<h3>Os tipos</h3>\n<ul><li><b>Phishing comum:</b> enviado para muita gente (\"sua conta será bloqueada\").</li><li><b>Spear phishing:</b> feito sob medida para uma pessoa ou empresa.</li><li><b>BEC (Business Email Compromise):</b> finge ser o chefe ou um fornecedor pedindo pagamento ou troca de conta bancária. Muitas vezes nem tem link.</li><li><b>Smishing e vishing:</b> por SMS e por telefone.</li></ul>\n<h3>Passo a passo da análise</h3>\n<ol><li><b>Remetente:</b> o endereço do From bate com o nome? Domínio parecido é golpe: micros0ft.com, paypa1.com, empresa-suporte.com.</li><li><b>Reply-To e Return-Path:</b> se a resposta vai para outro endereço, desconfie.</li><li><b>Autenticação</b> (no cabeçalho Authentication-Results): <b>SPF</b> diz se o servidor que enviou pode mandar e-mail por aquele domínio; <b>DKIM</b> é uma assinatura que prova que o e-mail não foi alterado; <b>DMARC</b> diz o que fazer quando os dois falham. Falha em SPF ou DMARC num e-mail \"do banco\" é sinal forte de falsificação.</li><li><b>Received:</b> o caminho do e-mail, servidor por servidor. Lê-se <b>de baixo para cima</b>: o de baixo é a origem.</li><li><b>Links:</b> passe o mouse (sem clicar) e veja o endereço real. Analise em sites como urlscan.io ou VirusTotal.</li><li><b>Anexos:</b> nunca abra na sua máquina. Pegue o <b>hash</b> do arquivo e pesquise no VirusTotal, ou use uma sandbox (ex.: ANY.RUN).</li><li><b>Texto:</b> urgência, ameaça, prêmio, pedido de senha ou de pagamento.</li></ol>\n<h3>Compartilhar com segurança (defang)</h3>\n<p>Ao colocar um link perigoso num ticket, \"desarme\" para ninguém clicar sem querer: <code>hxxps://golpe[.]com/login</code>.</p>\n<h3>O que fazer quando é phishing de verdade</h3>\n<ul><li>Ver <b>quem mais recebeu</b> o mesmo e-mail e remover de todas as caixas.</li><li>Bloquear o remetente, o domínio e os links.</li><li>Descobrir se alguém <b>clicou ou digitou a senha</b>. Se sim: trocar a senha, encerrar as sessões e verificar o MFA e as regras de caixa de entrada criadas pelo atacante.</li><li>Registrar os IOCs (domínio, IP, hash, assunto) no ticket.</li></ul>\n<h3>No dia a dia de um SOC</h3>\n<p>Muitas empresas têm um botão \"Reportar phishing\" no Outlook. Cada e-mail reportado vira um caso para você decidir: <b>phishing</b>, <b>spam</b> (incômodo, mas não perigoso) ou <b>legítimo</b>. No MITRE ATT&amp;CK, phishing é a técnica <b>T1566</b>.</p>\n<h3>Erros comuns</h3>\n<ul><li>Clicar no link \"só para ver\".</li><li>Confiar no nome que aparece e não olhar o endereço real.</li><li>Achar que e-mail com SPF \"pass\" é seguro: o golpista pode ter o próprio domínio parecido, com SPF configurado.</li></ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>How do you analyse a reported phishing email?</b><br><i>I check the sender, reply-to and return-path, then the SPF, DKIM and DMARC results and the received headers. I inspect links and attachments safely with urlscan, VirusTotal or a sandbox. If it is malicious I find everyone who received it, remove it, block the indicators and check whether anyone clicked or entered credentials.</i></p>\n<p><b>What are SPF, DKIM and DMARC?</b><br><i>SPF lists which servers may send mail for a domain, DKIM signs the message so changes can be detected, and DMARC tells receivers what to do when those checks fail.</i></p>",chk:["Explicar phishing, spear phishing e BEC", "Checar From, Reply-To e Return-Path", "Explicar SPF, DKIM e DMARC em uma frase cada", "Analisar link e anexo sem clicar nem abrir", "Escrever um link no formato defang", "Dizer o que fazer se alguém digitou a senha", "Acertar 8 de 10 no quiz de Phishing"]},
{id:"ir",n:"Triagem e Resposta a Incidentes",ic:"🚨",tags:["IR"],st:"<h3>O que é</h3>\n<p><b>Triagem</b> é decidir, para cada alerta, se é real, quão grave é e o que fazer. <b>Resposta a incidentes</b> é o que vem depois, quando o alerta é real: parar o ataque, limpar e voltar ao normal. É o coração do trabalho do SOC.</p>\n<h3>Comparação do dia a dia</h3>\n<p>É a triagem de um pronto-socorro. Nem todo mundo que chega está grave: a enfermeira pergunta, mede a pressão e decide quem é atendido primeiro. O analista faz o mesmo com os alertas: confere, classifica e prioriza.</p>\n<h3>Triagem em 5 perguntas</h3>\n<ol><li><b>O que disparou?</b> Qual regra, qual máquina, qual usuário, que horário.</li><li><b>É normal para essa pessoa ou máquina?</b> Ela costuma logar daquele país? Aquele programa costuma rodar?</li><li><b>O que diz a inteligência de ameaças?</b> O IP, o domínio ou o hash já são conhecidos como maliciosos (VirusTotal, AbuseIPDB)?</li><li><b>Deu certo?</b> Houve login com sucesso, arquivo executado, dados enviados?</li><li><b>Qual o tamanho?</b> Uma máquina ou várias? Conta comum ou de administrador?</li></ol>\n<h3>As classificações</h3>\n<ul><li><b>Verdadeiro positivo:</b> ataque real. Responde e escala.</li><li><b>Falso positivo:</b> a regra errou, era atividade normal. Fecha e anota o porquê.</li><li><b>Verdadeiro positivo benigno:</b> aconteceu de verdade, mas é autorizado (ex.: um teste de invasão combinado).</li></ul>\n<h3>Prioridade</h3>\n<p>Mais urgente: conta de administrador, servidor importante, dados de clientes, ataque que <b>já funcionou</b> e ataque que está se espalhando. Menos urgente: tentativa bloqueada numa máquina isolada.</p>\n<h3>As fases da resposta (NIST)</h3>\n<ol><li><b>Preparação:</b> ferramentas, regras, contatos e treino prontos antes do ataque.</li><li><b>Detecção e análise:</b> o alerta e a investigação.</li><li><b>Contenção:</b> impedir que piore. Isolar a máquina na rede, desativar a conta, bloquear o IP.</li><li><b>Erradicação:</b> remover a ameaça (malware, contas criadas pelo atacante).</li><li><b>Recuperação:</b> voltar ao normal com segurança e vigiar.</li><li><b>Lições aprendidas:</b> o que melhorar para não acontecer de novo.</li></ol>\n<h3>EDR: a ferramenta da máquina</h3>\n<p>O EDR (Microsoft Defender for Endpoint, CrowdStrike, SentinelOne) vigia cada computador. Ele mostra a <b>árvore de processos</b> (que programa abriu qual), e com um clique <b>isola a máquina</b> da rede, mata um processo ou apaga um arquivo. Exemplo de árvore suspeita: o Word abrindo o PowerShell, que baixa algo da internet.</p>\n<h3>MITRE ATT&amp;CK: dando nome ao ataque</h3>\n<p>É um catálogo público de como os atacantes agem. <b>Táticas</b> são o objetivo (o \"porquê\": entrar, se manter, subir privilégio, roubar dados). <b>Técnicas</b> são o jeito (o \"como\"). Exemplos: T1566 Phishing, T1110 Força bruta, T1078 Uso de contas válidas, T1059.001 PowerShell, T1021.001 Área de Trabalho Remota. Citar a técnica no ticket ajuda todo mundo a entender rápido.</p>\n<h3>IOCs e a pirâmide da dor</h3>\n<p><b>IOC</b> (indicador de comprometimento) é uma pista concreta: hash de arquivo, IP, domínio. Bloquear um hash é fácil, mas o atacante troca o arquivo em segundos. Bloquear o <b>comportamento</b> (as técnicas) dói muito mais para ele. Essa é a ideia da \"pirâmide da dor\".</p>\n<h3>Como escrever o ticket</h3>\n<p>Um bom registro responde: <b>o que</b> aconteceu, <b>quando</b>, <b>onde</b> (máquina, usuário, IP), <b>o que você verificou</b>, <b>o que você fez</b> e <b>o que falta</b>. Escreva para alguém que vai ler às 3 da manhã sem contexto. Comunicação clara é a habilidade que mais aparece nas vagas.</p>\n<h3>No dia a dia de um SOC</h3>\n<ul><li>Os alertas chegam numa <b>fila</b>. Cada um tem um prazo de atendimento (SLA) conforme a gravidade.</li><li>O Nível 1 faz a triagem e resolve o simples. O que é grave ou complexo é <b>escalado</b> para o Nível 2 com tudo documentado.</li><li>Muitos SOCs trabalham em <b>turnos</b> (24 horas por dia). Na troca de turno, os casos abertos são passados com uma nota clara.</li><li>Para casos repetidos existem <b>playbooks</b>: o passo a passo combinado para cada tipo de alerta (phishing, força bruta, malware).</li></ul>\n<h3>Erros comuns</h3>\n<ul><li>Fechar um alerta como falso positivo sem anotar o motivo.</li><li>Agir antes de confirmar: bloquear a conta do diretor por um alerta que era viagem legítima.</li><li>Não olhar se o ataque <b>deu certo</b> (o sucesso depois das falhas).</li><li>Escalar sem contexto: \"deu alerta, olhem aí\" não ajuda ninguém.</li></ul>\n<h3>Exemplo prático</h3>\n<p>Alerta: login com sucesso na conta j.silva vindo de outro país, 2 minutos depois de 40 falhas do mesmo IP. Triagem: não é normal (ela trabalha em São Paulo), o IP está no AbuseIPDB, e o ataque deu certo. Classificação: verdadeiro positivo, prioridade alta, MITRE T1110 e T1078. Ação: desativar a sessão e a conta, bloquear o IP, verificar o que a conta acessou e escalar para o Nível 2 com tudo documentado.</p>\n<h3>Pratique no lab</h3>\n<p>Os desafios desta aba contam uma história: um password spray, o momento em que o atacante entrou e uma conta comprometida na nuvem. Depois, no <b>modo treinamento</b> do lab, você triagem alertas de verdade e recebe nota.</p>\n<h3>Como explicar numa entrevista</h3>\n<p><b>Walk me through how you triage an alert.</b><br><i>I check what triggered it and whether the activity is normal for that user or host. I enrich the indicators with threat intelligence, check whether the attack succeeded and how far it spread, then classify it, set the priority and either close it with a note or contain and escalate it.</i></p>\n<p><b>What is MITRE ATT&amp;CK?</b><br><i>A public knowledge base of attacker tactics and techniques. Tactics are the goals, techniques are how they achieve them, for example T1110 brute force. I use it to describe what I see and to check detection coverage.</i></p>",chk:["Fazer a triagem com as 5 perguntas", "Diferenciar verdadeiro positivo, falso positivo e benigno", "Dizer as fases da resposta a incidentes", "Explicar o que um EDR faz (árvore de processos e isolar)", "Explicar tática e técnica do MITRE ATT&CK com exemplos", "Explicar o que é um IOC e a pirâmide da dor", "Escrever um ticket com o quê, quando, onde e o que foi feito", "Acertar 8 de 10 no quiz de Resposta a Incidentes"]},
{id:"sd",n:"O que é Service Desk",ic:"🎧",tags:["ServiceDesk"],st:"<p class=\"mu\">Service Desk (ou IT Support, Help Desk) é a porta de entrada da maioria das pessoas que trabalham com TI. É também uma ótima base para o SOC: lá você aprende contas, redes, Windows, usuários e, principalmente, a registrar tudo num ticket.</p>\n<h3>O que é, em uma frase</h3>\n<p>O Service Desk é o <b>ponto único de contato</b> entre as pessoas da empresa e a TI. Quem tem um problema ou precisa de algo liga, manda um chat, um e-mail ou abre um chamado no portal, e o Service Desk registra, resolve ou encaminha.</p>\n<h3>Comparação do dia a dia</h3>\n<p>Pense no pronto-socorro de um hospital. Quem chega passa pela <b>triagem</b> (o quão grave é?), recebe uma <b>pulseira de prioridade</b>, e o caso simples é resolvido ali mesmo. O caso complicado vai para o especialista. Tudo fica no <b>prontuário</b>. No Service Desk, o prontuário é o ticket.</p>\n<h3>Os níveis de suporte</h3>\n<table><tr><th>Nível</th><th>Quem é</th><th>Exemplos</th></tr>\n<tr><td>N0</td><td>Autoatendimento</td><td>Portal, base de conhecimento, troca de senha sozinho (SSPR)</td></tr>\n<tr><td>N1</td><td>Primeiro atendimento: é aqui que você começa</td><td>Senha, conta bloqueada, Outlook, impressora, acesso, VPN</td></tr>\n<tr><td>N2</td><td>Especialistas e suporte em campo</td><td>Redes, servidores, sistemas, troca de peça</td></tr>\n<tr><td>N3</td><td>Engenharia ou fornecedor</td><td>Bug no sistema, mudança na arquitetura, suporte da Microsoft</td></tr></table>\n<h3>Os 4 tipos de registro (ITIL)</h3>\n<p>O ITIL é o conjunto de boas práticas que quase toda empresa usa para organizar a TI. Você não precisa decorar o livro, mas precisa saber estes 4:</p>\n<ul>\n<li><b>Incidente:</b> algo que funcionava parou ou piorou. Objetivo: <b>restaurar o serviço rápido</b>. Ex.: \"o Outlook não abre\".</li>\n<li><b>Requisição de serviço:</b> um pedido de algo padrão, que não está quebrado. Normalmente precisa de <b>aprovação</b>. Ex.: \"preciso de acesso à pasta do RH\", \"quero instalar o Visio\".</li>\n<li><b>Problema:</b> a <b>causa raiz</b> por trás de incidentes repetidos. Ex.: 30 chamados de VPN caindo toda segunda-feira.</li>\n<li><b>Mudança:</b> uma alteração planejada no ambiente, com aprovação e janela de horário. Ex.: atualizar o firewall no sábado à noite.</li>\n</ul>\n<h3>O ciclo de vida de um ticket</h3>\n<p><b>Novo</b> → <b>Atribuído</b> → <b>Em andamento</b> → <b>Aguardando</b> (o usuário ou um fornecedor; o relógio do SLA costuma pausar) → <b>Resolvido</b> → <b>Fechado</b> (depois que o usuário confirma, ou depois de alguns dias sem resposta).</p>\n<h3>Prioridade = impacto × urgência</h3>\n<p><b>Impacto</b> é quantas pessoas ou quanto do negócio é afetado. <b>Urgência</b> é quanto tempo dá para esperar. Juntando os dois:</p>\n<table><tr><th></th><th>Urgência alta (parou)</th><th>Urgência média</th><th>Urgência baixa (dá para esperar)</th></tr>\n<tr><td><b>Impacto alto</b> (empresa ou serviço crítico)</td><td>P1 Crítica</td><td>P2 Alta</td><td>P3 Média</td></tr>\n<tr><td><b>Impacto médio</b> (um setor, um grupo)</td><td>P2 Alta</td><td>P3 Média</td><td>P4 Baixa</td></tr>\n<tr><td><b>Impacto baixo</b> (uma pessoa)</td><td>P3 Média</td><td>P4 Baixa</td><td>P4 Baixa</td></tr></table>\n<p>Cada empresa tem a sua tabela, mas a lógica é sempre essa. Uma pessoa sem conseguir trabalhar é P3. O sistema de vendas fora do ar para todos é P1.</p>\n<h3>SLA: o prazo combinado</h3>\n<p>SLA (Service Level Agreement) é o acordo de tempo de <b>primeira resposta</b> e de <b>solução</b> para cada prioridade. Exemplo comum: P1 = resposta em 15 min e solução em 4 h; P4 = resposta em 1 dia útil e solução em 5 dias. Estourar o SLA aparece nos relatórios, por isso você acompanha a fila o tempo todo.</p>\n<h3>Escalar: quando e como</h3>\n<ul>\n<li><b>Escalonamento funcional:</b> passar para quem sabe ou tem acesso (N2 de Redes, time de Sistemas). Faça quando a solução está fora do seu conhecimento, do seu acesso ou do tempo do SLA.</li>\n<li><b>Escalonamento hierárquico:</b> avisar o coordenador. Faça quando o impacto é grande, o SLA vai estourar ou o usuário é crítico para o negócio.</li>\n<li><b>Segurança:</b> phishing com senha digitada, malware, notebook perdido, pedido suspeito de reset. <b>Sempre</b> avise a Segurança (o SOC), mesmo que pareça pequeno.</li>\n<li>Escalar bem é deixar o ticket pronto: o que acontece, desde quando, quem é afetado, o que você já testou e o resultado. Ninguém deve precisar ligar para o usuário de novo para perguntar o básico.</li>\n</ul>\n<h3>Métricas que você vai ouvir</h3>\n<ul>\n<li><b>FCR</b> (First Contact Resolution): resolvido no primeiro contato, sem escalar.</li>\n<li><b>MTTR</b>: tempo médio até resolver.</li>\n<li><b>CSAT</b>: nota de satisfação que o usuário dá depois.</li>\n<li><b>Backlog</b>: quantos chamados abertos estão parados na fila.</li>\n</ul>\n<h3>Ferramentas</h3>\n<p>Sistemas de ticket: <b>ServiceNow</b>, <b>Jira Service Management</b>, Freshservice, Zendesk, TOPdesk. Acesso remoto: Quick Assist, TeamViewer, AnyDesk, ScreenConnect (sempre com a permissão do usuário). Administração: Active Directory, Microsoft 365 admin center, Entra ID, Intune. A <b>base de conhecimento</b> (KB) é sua melhor amiga: procure antes de resolver e escreva um artigo depois de resolver algo novo.</p>\n<h3>No dia a dia de um Service Desk</h3>\n<ul>\n<li>Você começa o turno olhando a fila: o que está perto de estourar o SLA, o que voltou do usuário, o que é P1.</li>\n<li>Atende telefone, chat e e-mail, e registra <b>tudo</b> como ticket, até o que resolveu em 2 minutos.</li>\n<li>Os campeões de volume: senha e conta bloqueada, MFA, Outlook e Teams, impressora, VPN, acesso a pastas e sistemas, computador lento, novo funcionário.</li>\n<li>Muita coisa de segurança chega primeiro no Service Desk: \"recebi um e-mail estranho\", \"meu computador abriu uma janela pedindo resgate\", \"alguém ligou dizendo que era da TI\".</li>\n</ul>\n<h3>Do Service Desk ao SOC</h3>\n<p>O analista de SOC lê eventos de conta bloqueada, reset de senha e login fora do normal. No Service Desk você vê o outro lado: <b>por que</b> a conta bloqueou (um celular com a senha antiga), como funciona o MFA, como um usuário cai num phishing. Quem passou pelo suporte entende os alertas muito mais rápido. Por isso esta fase vem primeiro.</p>\n<h3>Pratique</h3>\n<p>Na <b>Fila de chamados</b> (menu Chamados) você atende chamados completos: triagem, perguntas ao usuário, diagnóstico com comandos, solução e nota no ticket.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Resolver por telefone e não registrar o ticket: o trabalho some das métricas e ninguém aprende com ele.</li>\n<li>Tratar requisição como incidente (ou o contrário). Pedido de acesso não é algo quebrado: precisa de aprovação.</li>\n<li>Dar prioridade pelo tom do usuário, e não pelo impacto e pela urgência.</li>\n<li>Fechar o ticket sem confirmar com o usuário que funcionou.</li>\n<li>Escalar com \"não funciona\" e nada mais.</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>What is the difference between an incident and a service request?</b><br><i>An incident is something that stopped working or got worse, and the goal is to restore the service quickly. A service request is a standard request for something new, like access or software, and it usually needs approval.</i></p>\n<p><b>How do you prioritise your tickets?</b><br><i>By impact and urgency, not by who shouts loudest. A whole department unable to work comes before one user with a cosmetic issue. Then I keep an eye on SLA times, so nothing sits in the queue until it breaches.</i></p>",chk:["Explicar o que é o Service Desk e os níveis N0 a N3", "Diferenciar incidente, requisição, problema e mudança", "Calcular a prioridade com impacto e urgência", "Explicar o que é SLA e o ciclo de vida de um ticket", "Dizer quando e como escalar um chamado", "Acertar 8 de 10 no quiz de Service Desk"]},
{id:"atend",n:"Atendimento ao Usuário",ic:"💬",tags:["Atendimento"],st:"<p class=\"mu\">No Service Desk, saber tecnologia é metade do trabalho. A outra metade é falar com pessoas: entender o que elas querem dizer, acalmar quem está nervoso, confirmar quem é quem e escrever de forma que outra pessoa entenda.</p>\n<h3>O que é, em uma frase</h3>\n<p>Bom atendimento é <b>entender o problema certo, com a pessoa certa, e deixar claro o que vai acontecer</b>, sem jargão e sem prometer o que não depende de você.</p>\n<h3>Comparação do dia a dia</h3>\n<p>Pense num bom médico de família. Ele deixa você falar, faz perguntas para entender (\"dói quando?\", \"desde quando?\"), explica em palavras simples, diz o que vai fazer e quando volta a falar com você. E anota tudo no prontuário.</p>\n<h3>O roteiro de um atendimento</h3>\n<ol>\n<li><b>Abertura:</b> cumprimente, diga seu nome e o setor. \"Bom dia, Service Desk, aqui é a Júlia.\"</li>\n<li><b>Identificação:</b> nome, setor, ramal ou e-mail. Antes de mexer em senha ou MFA, <b>confirme a identidade</b> pelo processo da empresa.</li>\n<li><b>Entender:</b> deixe a pessoa explicar, depois pergunte: o que aparece na tela, desde quando, o que mudou, só com você ou com outros.</li>\n<li><b>Registrar:</b> abra o ticket enquanto conversa.</li>\n<li><b>Resolver ou encaminhar:</b> e diga qual é o próximo passo e o prazo.</li>\n<li><b>Confirmar e encerrar:</b> peça para a pessoa testar, passe o número do chamado e pergunte se há mais alguma coisa.</li>\n</ol>\n<h3>Perguntas abertas e fechadas</h3>\n<ul>\n<li><b>Abertas</b> fazem a pessoa contar: \"O que acontece quando você tenta entrar?\" Use no começo.</li>\n<li><b>Fechadas</b> confirmam um detalhe: \"Aparece a palavra bloqueada?\" (sim ou não). Use para fechar o diagnóstico.</li>\n<li><b>Parafrasear</b> evita mal-entendidos: \"Então, desde ontem o Outlook abre mas não chegam e-mails novos, certo?\"</li>\n</ul>\n<h3>Verificar a identidade (e não cair em golpe)</h3>\n<p>Golpistas ligam para o Service Desk fingindo ser um funcionário (ou o diretor!) para pedir reset de senha ou de MFA. Isso se chama <b>engenharia social</b> por telefone (vishing). Sinais: muita <b>urgência</b>, uso de <b>autoridade</b> (\"sou o diretor, resolve agora\"), pedido para mandar o código para <b>outro número</b> ou e-mail pessoal.</p>\n<ul>\n<li>Siga o processo: ligar de volta no número <b>cadastrado</b>, confirmar com o gestor, perguntas de verificação, ou verificação pelo Teams com vídeo.</li>\n<li><b>Nunca peça a senha</b> do usuário. Ninguém da TI precisa dela.</li>\n<li>Pedido suspeito? Recuse com educação, registre e avise a Segurança.</li>\n</ul>\n<h3>Usuário irritado</h3>\n<ul>\n<li><b>Ouça</b> até o fim, sem interromper.</li>\n<li><b>Reconheça</b> o impacto: \"Entendo, você tem uma apresentação daqui a pouco e isso atrapalha muito.\"</li>\n<li><b>Peça desculpas pela situação</b> (não precisa assumir culpa) e <b>foque na solução</b>: \"Vamos resolver juntos. Primeiro, me diga...\"</li>\n<li>Dê um prazo realista e cumpra. Se não sabe, diga quando vai dar notícia.</li>\n<li>Nunca discuta, nunca culpe o usuário (\"você deve ter feito algo errado\").</li>\n</ul>\n<h3>Escrever no ticket</h3>\n<p>Quase todo sistema tem dois campos: a <b>nota interna</b> (work notes: só a TI vê) e o <b>comentário para o usuário</b> (ele recebe por e-mail). Uma boa nota diz:</p>\n<ul><li>O sintoma, com a mensagem de erro exata.</li><li>O que você verificou e o que encontrou.</li><li>O que você fez.</li><li>O resultado (testado com o usuário?).</li><li>O próximo passo, se houver.</li></ul>\n<pre>User reported: \"account locked\" when signing in to PC-FIN-07.\nVerified identity via callback to registered number.\nGet-ADUser: LockedOut=True, BadLogonCount=5. Unlocked account.\nCause: old password saved on phone mail app; user updated it.\nTested: user signed in successfully. Resolved.</pre>\n<p>Em muitas vagas (e em empresas internacionais) a nota é em inglês. Frases curtas e no passado bastam.</p>\n<h3>Frases úteis em inglês</h3>\n<ul>\n<li>\"Could you tell me exactly what error message you see?\"</li>\n<li>\"Has anything changed since it last worked?\"</li>\n<li>\"I'm going to connect to your computer remotely. Is that OK?\"</li>\n<li>\"I'll escalate this to our network team. You'll get an update within four hours.\"</li>\n<li>\"Could you try it now and let me know if it works?\"</li>\n</ul>\n<h3>Acesso remoto com respeito</h3>\n<p>Peça permissão antes de conectar, diga o que vai fazer, não abra arquivos pessoais e avise quando terminar. Se precisar ver algo sensível (e-mail, planilha de salário), peça para a pessoa mostrar.</p>\n<h3>No dia a dia de um Service Desk</h3>\n<ul>\n<li>Você atende dezenas de pessoas por dia, com níveis de conhecimento muito diferentes: adapte a linguagem.</li>\n<li>Chat e e-mail exigem texto claro, com passos numerados.</li>\n<li>Muitos tickets voltam porque o usuário não entendeu a resposta. Confirmar antes de fechar evita reabertura.</li>\n<li>Um usuário bem atendido reporta mais rápido o e-mail estranho, e isso ajuda a Segurança.</li>\n</ul>\n<h3>Pratique</h3>\n<p>Na <b>Fila de chamados</b>, a etapa \"Perguntas ao usuário\" treina exatamente isso: escolher as perguntas que resolvem o caso. A etapa final pede a nota do ticket.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Usar jargão: \"seu DHCP não está entregando lease\" em vez de \"seu computador não recebeu endereço da rede\".</li>\n<li>Prometer prazo que depende de outro time.</li>\n<li>Resetar senha ou MFA sem confirmar a identidade.</li>\n<li>Escrever opinião no ticket (\"usuário difícil\"). O ticket é um documento da empresa.</li>\n<li>Fechar sem testar com o usuário.</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>How would you handle an angry user?</b><br><i>I let them explain without interrupting, acknowledge the impact on their work and apologise for the situation. Then I focus on what I can do now, give a realistic timeframe and keep them updated, even if the fix depends on another team.</i></p>\n<p><b>A caller says he is a director and needs his password reset right now. What do you do?</b><br><i>I follow the identity verification process anyway, for example a callback to the number on file or confirmation from his manager. Urgency and authority are classic social engineering tricks. If anything looks wrong, I refuse politely, log it and inform the security team.</i></p>",chk:["Seguir o roteiro: abertura, identificação, entender, registrar, resolver, confirmar", "Usar perguntas abertas, fechadas e parafrasear", "Verificar a identidade antes de resetar senha ou MFA", "Reconhecer sinais de engenharia social por telefone", "Lidar com um usuário irritado sem discutir", "Escrever uma nota de ticket clara (de preferência em inglês)", "Acertar 8 de 10 no quiz de Atendimento"]},
{id:"trouble",n:"Troubleshooting na Prática",ic:"🔍",tags:["Troubleshooting"],st:"<p class=\"mu\">Troubleshooting é o jeito organizado de achar a causa de um problema. É o que separa o técnico que \"tenta coisas\" do que resolve. E é a mesma lógica que o analista de SOC usa numa investigação.</p>\n<h3>O que é, em uma frase</h3>\n<p>É <b>investigar antes de mexer</b>: entender o sintoma, levantar hipóteses da mais simples para a mais complexa, testar uma de cada vez e registrar o que funcionou.</p>\n<h3>Comparação do dia a dia</h3>\n<p>A luz da sala não acende. Você não chama um eletricista para trocar a fiação. Primeiro olha: a lâmpada queimou? Só essa sala está sem luz ou a casa toda? O disjuntor caiu? Do mais simples para o mais complexo, uma coisa de cada vez.</p>\n<h3>O método em 7 passos (CompTIA A+)</h3>\n<ol>\n<li><b>Identificar o problema:</b> perguntar, ver o erro, descobrir o que mudou, reproduzir.</li>\n<li><b>Criar uma teoria</b> da causa provável, começando pelo óbvio.</li>\n<li><b>Testar a teoria.</b> Errou? Volte ao passo 2 ou escale.</li>\n<li><b>Planejar a solução</b> e pensar no efeito dela (vai afetar outras pessoas?).</li>\n<li><b>Aplicar a solução</b> ou escalar.</li>\n<li><b>Verificar</b> que tudo funciona e, se der, prevenir que volte.</li>\n<li><b>Documentar</b> causa, solução e resultado.</li>\n</ol>\n<h3>As perguntas que dividem o problema</h3>\n<ul>\n<li><b>Quem?</b> Só uma pessoa, um setor ou todo mundo? Só uma pessoa = olhe a máquina ou a conta dela. Todos = olhe o servidor, a rede ou o serviço.</li>\n<li><b>O quê?</b> Um aplicativo ou tudo? Um site ou toda a internet?</li>\n<li><b>Quando?</b> Desde quando? Sempre ou às vezes? Depois de uma atualização, de trocar a senha, de mudar de sala?</li>\n<li><b>Onde?</b> No escritório e em casa? No Wi-Fi e no cabo?</li>\n</ul>\n<h3>Rede: de baixo para cima</h3>\n<ol>\n<li><b>Físico:</b> cabo conectado? Luz da placa acesa? Wi-Fi ligado, modo avião desligado?</li>\n<li><b>Endereço IP:</b> <code>ipconfig</code>. IP <b>169.254.x.x</b> significa que o computador não recebeu endereço do DHCP (problema de cabo, porta, switch ou DHCP).</li>\n<li><b>Gateway:</b> <code>ping</code> no gateway (o roteador). Respondeu? A rede local está ok.</li>\n<li><b>Internet:</b> <code>ping 8.8.8.8</code>. Respondeu? A saída para a internet funciona.</li>\n<li><b>DNS:</b> <code>nslookup site</code>. O ping no IP funciona, mas o nome não abre? É DNS.</li>\n<li><b>Aplicação:</b> <code>Test-NetConnection servidor -Port 443</code> testa a porta do serviço.</li>\n</ol>\n<h3>Comandos que você vai usar toda semana</h3>\n<table><tr><th>Comando</th><th>Para que serve</th></tr>\n<tr><td>ipconfig /all</td><td>IP, gateway, DNS, DHCP, endereço MAC</td></tr>\n<tr><td>ipconfig /release e /renew</td><td>Devolver e pedir um IP novo ao DHCP</td></tr>\n<tr><td>ipconfig /flushdns</td><td>Limpar o cache de DNS do computador</td></tr>\n<tr><td>ping e tracert</td><td>Testar se um destino responde e ver o caminho até ele</td></tr>\n<tr><td>nslookup nome</td><td>Perguntar ao DNS qual o IP de um nome</td></tr>\n<tr><td>gpupdate /force e gpresult /r</td><td>Atualizar as políticas (GPO) e ver quais estão aplicadas</td></tr>\n<tr><td>whoami /groups</td><td>Ver os grupos da conta logada</td></tr>\n<tr><td>sfc /scannow</td><td>Verificar e corrigir arquivos do Windows</td></tr>\n<tr><td>Get-Service e Restart-Service</td><td>Ver e reiniciar serviços (ex.: Spooler, da impressão)</td></tr>\n<tr><td>taskmgr, resmon, eventvwr</td><td>Gerenciador de Tarefas, Monitor de Recursos, Visualizador de Eventos</td></tr>\n</table>\n<h3>Casos clássicos e o primeiro teste</h3>\n<ul>\n<li><b>Sem internet:</b> ipconfig. 169.254? Cabo, porta ou DHCP. IP normal? ping no gateway e depois nslookup.</li>\n<li><b>Computador lento:</b> Gerenciador de Tarefas (CPU, memória, disco) e espaço livre no disco C:.</li>\n<li><b>Impressora:</b> fila travada? Limpar a fila e reiniciar o serviço Spooler. Só um setor? Olhe o driver ou a impressora.</li>\n<li><b>Outlook:</b> funciona no navegador (Outlook na web)? Sim = problema no computador (perfil, cache). Não = conta, licença ou serviço.</li>\n<li><b>Site interno não abre:</b> nslookup do nome. DNS errado (ex.: 8.8.8.8 configurado à mão) não conhece os nomes internos.</li>\n<li><b>VPN:</b> internet funciona? Senha e MFA ok? A hora do computador está certa? Outras pessoas conseguem?</li>\n</ul>\n<h3>No dia a dia de um Service Desk</h3>\n<ul>\n<li>Reiniciar resolve muita coisa, mas se o problema volta, a causa continua lá: registre e procure o porquê.</li>\n<li>Antes de mudar algo, anote como estava. Se piorar, você sabe voltar.</li>\n<li>Se o mesmo problema aparece em vários tickets, avise o coordenador: pode ser um <b>Problema</b> (causa raiz) ou um incidente grave começando.</li>\n<li>Muitos sintomas de segurança aparecem como \"lentidão\" ou \"janela estranha\": processo desconhecido usando CPU, programa novo que ninguém instalou. Na dúvida, escale para a Segurança.</li>\n</ul>\n<h3>Pratique</h3>\n<p>Na <b>Fila de chamados</b>, cada chamado tem um terminal de diagnóstico: rode ipconfig, ping, nslookup, Get-ADUser e outros, e descubra a causa pela saída dos comandos.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Mudar três coisas ao mesmo tempo: se funcionar, você não sabe qual resolveu.</li>\n<li>Pular a pergunta \"o que mudou?\". Quase sempre algo mudou.</li>\n<li>Reinstalar ou formatar logo de cara.</li>\n<li>Não confirmar com o usuário que voltou a funcionar.</li>\n<li>Não documentar a solução, e alguém perder uma hora com o mesmo problema amanhã.</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>A user says they can't access the internet. Walk me through it.</b><br><i>First I check if it's only them or others too. Then I go bottom-up: cable or Wi-Fi, then ipconfig. A 169.254 address means no DHCP lease. If the IP is fine, I ping the gateway, then an external IP, then use nslookup to test DNS. That tells me which layer is broken before I change anything.</i></p>\n<p><b>What do you do if you can't fix an issue?</b><br><i>I escalate it to the right team with everything I found: symptoms, what I tested and the results, so they don't have to start again. And I tell the user who has it now and when they'll hear back.</i></p>",chk:["Seguir os 7 passos do método de troubleshooting", "Dividir o problema com quem, o quê, quando e onde", "Diagnosticar rede de baixo para cima (cabo, IP, gateway, internet, DNS)", "Explicar o que significa um IP 169.254.x.x", "Usar ipconfig, ping, nslookup, gpupdate e gpresult", "Resolver os casos clássicos: lento, impressora, Outlook, VPN", "Acertar 8 de 10 no quiz de Troubleshooting"]},
{id:"contas",n:"Contas, Acessos e Microsoft 365",ic:"🔑",tags:["Contas"],st:"<p class=\"mu\">Contas e acessos são o tipo de chamado mais comum no Service Desk e, ao mesmo tempo, o maior alvo dos atacantes. Este tópico mostra o trabalho do dia a dia. O tópico Administração Microsoft (no módulo Sistemas operacionais) explica o Active Directory por dentro.</p>\n<h3>O que é, em uma frase</h3>\n<p>Cuidar de contas é garantir que <b>cada pessoa tenha o acesso que precisa, e só ele</b>: criar, desbloquear, resetar, dar e tirar acessos, sempre com aprovação e registro.</p>\n<h3>Comparação do dia a dia</h3>\n<p>Pense na portaria de um prédio comercial. Cada funcionário recebe um crachá que abre só os andares do setor dele. Quem muda de setor troca de crachá (e devolve o antigo). Quem sai devolve o crachá no último dia. E ninguém empresta o crachá.</p>\n<h3>Onde as contas moram</h3>\n<ul>\n<li><b>Active Directory (AD):</b> as contas da rede local da empresa (login no Windows, pastas, impressoras). Ferramenta: <b>ADUC</b> (dsa.msc) ou PowerShell.</li>\n<li><b>Entra ID</b> (antigo Azure AD): as contas na nuvem da Microsoft (e-mail, Teams, OneDrive). Ferramenta: <b>Microsoft 365 admin center</b> e portal do Entra.</li>\n<li>Na maioria das empresas é <b>híbrido</b>: a conta nasce no AD e é copiada para o Entra ID pelo Entra Connect. Por isso, às vezes a mudança \"demora\" uns minutos para aparecer na nuvem.</li>\n</ul>\n<h3>Bloqueada, desativada, expirada: não confunda</h3>\n<table><tr><th>Estado</th><th>O que é</th><th>O que fazer</th></tr>\n<tr><td>Bloqueada (locked out)</td><td>Errou a senha várias vezes; trava por segurança</td><td>Desbloquear (Unlock) e achar a causa</td></tr>\n<tr><td>Senha expirada</td><td>A senha passou do prazo da política</td><td>Usuário troca a senha (ou reset com troca no próximo login)</td></tr>\n<tr><td>Desativada (disabled)</td><td>Alguém desligou a conta de propósito (desligamento, afastamento)</td><td>Não reative sem pedido aprovado do RH ou do gestor</td></tr>\n<tr><td>Conta expirada</td><td>Conta com data de fim (estagiário, terceiro)</td><td>Só estende com aprovação</td></tr></table>\n<h3>Conta que bloqueia toda hora</h3>\n<p>A pessoa trocou a senha, mas algum aparelho ou programa continua tentando a senha <b>antiga</b>: o e-mail no celular, um drive de rede mapeado com senha salva, uma sessão de Área de Trabalho Remota esquecida. A cada tentativa, um erro, até bloquear. No controlador de domínio, o evento <b>4740</b> mostra o <b>Caller Computer Name</b>: de onde vieram as tentativas. (É o mesmo evento que o SOC usa para detectar força bruta.)</p>\n<h3>Comandos do dia a dia</h3>\n<pre>Get-ADUser ana.souza -Properties LockedOut,BadLogonCount,PasswordLastSet,PasswordExpired,Enabled\nUnlock-ADAccount ana.souza\nSet-ADAccountPassword ana.souza -Reset          # e marcar \"trocar no próximo login\"\nGet-ADPrincipalGroupMembership ana.souza | Select-Object Name\nAdd-ADGroupMember \"GG-RH-Leitura\" -Members carla.lima\nnet user ana.souza /domain                      # a versão do CMD</pre>\n<h3>MFA e troca de senha</h3>\n<ul>\n<li><b>MFA</b> (autenticação em vários fatores): senha + algo que você tem (app Authenticator, chave de segurança) ou é.</li>\n<li>Celular novo, app apagado: o Service Desk <b>confirma a identidade</b> e redefine os métodos de MFA (\"require re-register MFA\"). No próximo login a pessoa cadastra o celular novo.</li>\n<li>Recebeu notificação de MFA que não pediu? Alguém tem a senha dela. <b>Não é chamado comum: é caso de segurança</b> (fadiga de MFA). Troca de senha, revogar sessões e avisar o SOC.</li>\n<li><b>SSPR</b> (Self-Service Password Reset): o próprio usuário troca a senha pelo portal, com MFA. Menos chamados e menos risco.</li>\n</ul>\n<h3>Microsoft 365 no Service Desk</h3>\n<ul>\n<li><b>Licença:</b> sem licença com Exchange, não há caixa de e-mail. Conta nova que \"não tem e-mail\" quase sempre é licença.</li>\n<li><b>Caixa compartilhada</b> (financeiro@, suporte@): várias pessoas leem a mesma caixa. Permissões: <b>Full Access</b> (abrir), <b>Send As</b> (enviar como a caixa), <b>Send on Behalf</b> (enviar \"em nome de\").</li>\n<li><b>Caixa cheia:</b> o limite depende da licença (50 GB ou 100 GB é comum). Arquivamento online e limpeza resolvem.</li>\n<li><b>Grupos:</b> lista de distribuição (só e-mail), grupo do Microsoft 365 (e-mail + Teams + SharePoint) e grupo de segurança (dá permissão).</li>\n<li><b>OneDrive, SharePoint e Teams:</b> pedidos de acesso a sites vão para o <b>dono do site</b> aprovar.</li>\n<li><b>Intune:</b> gerencia notebooks e celulares da empresa: instalar apps, aplicar regras, bloquear e apagar à distância um aparelho perdido.</li>\n</ul>\n<h3>Entrou, mudou, saiu (Joiners, Movers, Leavers)</h3>\n<ul>\n<li><b>Entrou:</b> conta na OU certa, grupos do cargo, licença, equipamento, tudo pedido pelo RH ou gestor.</li>\n<li><b>Mudou de setor:</b> dar os acessos novos <b>e tirar os antigos</b>. Quem acumula acessos de todos os setores por onde passou é um risco enorme.</li>\n<li><b>Saiu:</b> desativar a conta na hora combinada, revogar sessões, tirar dos grupos, tratar o e-mail conforme a política, recolher equipamentos.</li>\n</ul>\n<h3>Regras de ouro</h3>\n<ul>\n<li><b>Menor privilégio:</b> só o acesso que o trabalho exige.</li>\n<li>Acesso é dado por <b>grupo</b>, não direto na conta.</li>\n<li>Toda permissão tem <b>aprovação</b> do gestor ou do dono do recurso, registrada no ticket.</li>\n<li>Nunca compartilhe contas, nunca peça senha, nunca crie \"conta genérica\" para facilitar.</li>\n</ul>\n<h3>No dia a dia de um Service Desk</h3>\n<ul>\n<li>Desbloquear, resetar senha e MFA vão estar na sua fila todos os dias. Faça rápido, mas sempre com verificação de identidade.</li>\n<li>Pedido de acesso sem aprovação fica em \"Aguardando aprovação\", não \"dá um jeitinho\".</li>\n<li>No SOC, cada uma dessas ações vira evento: 4740 (bloqueio), 4724 (reset de senha por um admin), 4728 (adicionado a grupo de segurança). Um reset de senha fora de um chamado é um alerta.</li>\n</ul>\n<h3>Pratique</h3>\n<p>Na <b>Fila de chamados</b> há chamados de conta bloqueada, MFA, acesso a pasta, caixa cheia e novo funcionário, com Get-ADUser e net user para investigar.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Desbloquear a conta e não procurar a causa: ela bloqueia de novo em 10 minutos.</li>\n<li>Reativar uma conta desativada porque \"o usuário pediu\".</li>\n<li>Dar permissão direto na conta, ou acesso de administrador \"para resolver logo\".</li>\n<li>No \"mudou de setor\", só adicionar acessos novos e esquecer de tirar os antigos.</li>\n<li>Resetar MFA de alguém só porque a pessoa disse o nome e o setor.</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>A user's account keeps locking out. How do you troubleshoot it?</b><br><i>I unlock it after verifying the user, then look for the source: usually a device or app still using an old password, like a phone mail app or a mapped drive. Event 4740 on the domain controller shows the caller computer name, which points to the device.</i></p>\n<p><b>Someone asks for access to a shared folder. What do you do?</b><br><i>It's a service request, so I check who owns the folder and get approval from the owner or the manager. Then I add the user to the right security group, not directly to the folder, ask them to sign out and in again, and record the approval in the ticket.</i></p>",chk:["Explicar a diferença entre Active Directory e Entra ID", "Diferenciar conta bloqueada, desativada e com senha expirada", "Descobrir por que uma conta bloqueia toda hora (evento 4740)", "Redefinir MFA com verificação de identidade", "Explicar licença, caixa compartilhada e tipos de grupo no Microsoft 365", "Aplicar o menor privilégio em entrou, mudou e saiu", "Acertar 8 de 10 no quiz de Contas e Acessos"]},
{id:"sysmon",n:"Sysmon e EDR",ic:"🔬",tags:["Sysmon"],st:"<p class=\"mu\">Os logs de login mostram <b>quem entrou</b>. O Sysmon e o EDR mostram <b>o que a pessoa (ou o malware) fez depois</b>: que programa rodou, com que comando, quem abriu quem e para onde conectou.</p>\n<h3>O que é, em uma frase</h3>\n<p>O <b>Sysmon</b> (System Monitor) é uma ferramenta gratuita da Microsoft (Sysinternals) que grava em detalhe a atividade do Windows. O <b>EDR</b> (Endpoint Detection and Response) é um produto de segurança que coleta isso, detecta comportamento suspeito e deixa você <b>responder</b>, como isolar a máquina.</p>\n<h3>Comparação do dia a dia</h3>\n<p>O log de login é o registro da portaria: quem entrou e a que horas. O Sysmon é a câmera dentro do prédio: mostra cada sala que a pessoa abriu, o que levou e com quem falou. O EDR é a câmera mais o segurança que pode trancar a porta.</p>\n<h3>Os eventos do Sysmon que mais aparecem</h3>\n<table><tr><th>ID</th><th>O que grava</th><th>Por que importa</th></tr>\n<tr><td>1</td><td>Processo criado: programa, <b>linha de comando</b>, processo pai, usuário, hash</td><td>O mais usado: mostra exatamente o que rodou</td></tr>\n<tr><td>3</td><td>Conexão de rede: processo, IP e porta de destino</td><td>Malware falando com o servidor do atacante (C2)</td></tr>\n<tr><td>7</td><td>DLL carregada</td><td>DLLs maliciosas carregadas por programas legítimos</td></tr>\n<tr><td>8</td><td>CreateRemoteThread</td><td>Injeção de código em outro processo</td></tr>\n<tr><td>10</td><td>Acesso a outro processo</td><td>Acesso ao <b>lsass.exe</b> = roubo de senhas (Mimikatz)</td></tr>\n<tr><td>11</td><td>Arquivo criado</td><td>O que foi baixado ou deixado no disco</td></tr>\n<tr><td>12, 13, 14</td><td>Registro alterado</td><td>Persistência nas chaves Run</td></tr>\n<tr><td>22</td><td>Consulta DNS: qual processo pediu qual nome</td><td>Domínio do atacante ligado ao processo que o chamou</td></tr></table>\n<p>O Sysmon grava no log <b>Microsoft-Windows-Sysmon/Operational</b>. O que ele registra é definido num arquivo de configuração XML (os mais usados são o da SwiftOnSecurity e o sysmon-modular). Comparado com o evento <b>4688</b> do Windows, o Sysmon traz hash, processo pai completo e o <b>ProcessGuid</b>, que liga todos os eventos de um mesmo processo.</p>\n<h3>A árvore de processos: quem abriu quem</h3>\n<p>Todo programa é aberto por outro (o pai). Algumas relações pai → filho são normais, outras são alarme:</p>\n<ul>\n<li><b>WINWORD.EXE → powershell.exe</b>: um documento do Word abrindo PowerShell. Clássico de anexo malicioso com macro.</li>\n<li><b>OUTLOOK.EXE → wscript.exe</b> ou <b>mshta.exe</b>: script vindo de e-mail.</li>\n<li><b>excel.exe → cmd.exe → certutil.exe -urlcache -f http://...</b>: baixando arquivo com uma ferramenta do próprio Windows.</li>\n<li><b>svchost.exe</b> cujo pai não é <b>services.exe</b>: provável impostor.</li>\n</ul>\n<h3>LOLBins: ferramentas do Windows usadas para atacar</h3>\n<p>\"Living off the land\": em vez de trazer um vírus, o atacante usa programas que já existem no Windows e são confiáveis: <b>powershell</b>, <b>certutil</b> (baixar arquivos), <b>mshta</b>, <b>rundll32</b>, <b>regsvr32</b>, <b>bitsadmin</b>, <b>wmic</b>. O nome do programa é inocente: o que denuncia é a <b>linha de comando</b> e o <b>pai</b>.</p>\n<h3>Sinais na linha de comando</h3>\n<ul>\n<li><code>-EncodedCommand</code> ou <code>-enc</code>: comando escondido em Base64 (em UTF-16LE; o CyberChef decodifica).</li>\n<li><code>-WindowStyle Hidden</code>, <code>-nop</code>, <code>-ep bypass</code>: rodar escondido e sem restrições.</li>\n<li><code>IEX</code>, <code>DownloadString</code>, <code>Invoke-WebRequest</code>: baixar e executar da internet.</li>\n<li>Reconhecimento logo depois do login: <code>whoami</code>, <code>net group \"domain admins\" /domain</code>, <code>nltest /dclist</code>, <code>ipconfig /all</code>.</li>\n</ul>\n<h3>O que o EDR acrescenta</h3>\n<ul>\n<li>Exemplos: Microsoft Defender for Endpoint, CrowdStrike Falcon, SentinelOne.</li>\n<li><b>Antivírus</b> compara arquivos com assinaturas conhecidas. <b>EDR</b> olha o <b>comportamento</b> e guarda o histórico para investigar.</li>\n<li>Resposta: <b>isolar a máquina</b> da rede (só o EDR continua falando), matar o processo, colocar o arquivo em quarentena, coletar evidências.</li>\n<li>XDR junta o EDR com e-mail, identidade e nuvem num lugar só.</li>\n</ul>\n<h3>Investigando um alerta de endpoint, passo a passo</h3>\n<ol>\n<li>Qual processo disparou, em qual máquina e com qual usuário?</li>\n<li>Árvore: quem é o pai e quais filhos ele criou?</li>\n<li>Linha de comando: o que exatamente rodou? (decodifique o Base64)</li>\n<li>Rede e DNS (eventos 3 e 22): para onde conectou?</li>\n<li>Arquivos e registro (11, 13): deixou algo para voltar depois (persistência)?</li>\n<li>Escopo: o mesmo hash ou domínio aparece em outras máquinas?</li>\n</ol>\n<h3>No dia a dia de um SOC</h3>\n<ul>\n<li>A maioria dos alertas de endpoint chega pelo EDR, com a árvore de processos pronta. Saber ler essa árvore é o principal.</li>\n<li>Muitos falsos positivos vêm de ferramentas de TI legítimas (scripts de inventário, SCCM, ferramentas de acesso remoto): confirme com o time de TI.</li>\n<li>Isolar a máquina é rápido e reversível. Na dúvida com um verdadeiro positivo provável, isole e escale.</li>\n</ul>\n<h3>Pratique no lab</h3>\n<p>No lab, aba <b>Terminal</b>, o arquivo <code>logs/sysmon.json</code> tem os eventos Sysmon do computador de uma conta comprometida. Os desafios mostram o que o atacante fez depois do login: o processo pai, o comando escondido e o reconhecimento.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Confiar no nome do processo. svch0st.exe, scvhost.exe e svchost.exe numa pasta errada não são o Windows.</li>\n<li>Olhar o processo sozinho, sem o pai e a linha de comando.</li>\n<li>Apagar o arquivo malicioso e fechar: e a persistência? E as outras máquinas?</li>\n<li>Reiniciar a máquina antes de coletar evidências da memória.</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>What is Sysmon and why is it useful?</b><br><i>It's a free Sysinternals tool that logs detailed endpoint activity: process creation with full command line, parent process and hashes, network connections and DNS queries. It lets me see what happened after a login, not just who logged in.</i></p>\n<p><b>You see WINWORD.EXE spawning powershell.exe with -EncodedCommand. What do you do?</b><br><i>That's a classic malicious macro pattern. I decode the command, check network and DNS events for where it connected, look for files or persistence it created, and check the scope across other hosts. If it looks malicious, I isolate the host with the EDR and escalate.</i></p>",chk:["Dizer o que o Sysmon grava e onde fica o log", "Explicar os eventos 1, 3, 10, 11 e 22 do Sysmon", "Ler uma árvore de processos e achar pai → filho suspeito", "Explicar o que são LOLBins, com exemplos", "Diferenciar antivírus e EDR, e dizer o que é isolar uma máquina", "Investigar um alerta de endpoint nos 6 passos", "Acertar 8 de 10 no quiz de Sysmon e EDR"]},
{id:"deteccao",n:"Regras de Detecção",ic:"🎯",tags:["Deteccao"],st:"<p class=\"mu\">Todo alerta que chega para o analista nasceu de uma regra que alguém escreveu. Entender como as regras funcionam ajuda a investigar melhor, a reconhecer um falso positivo e, mais tarde, a escrever as suas.</p>\n<h3>O que é, em uma frase</h3>\n<p>Uma regra de detecção é uma <b>lógica que roda sozinha sobre os logs e gera um alerta</b> quando encontra algo suspeito: um padrão, um limite ultrapassado ou um comportamento fora do normal.</p>\n<h3>Comparação do dia a dia</h3>\n<p>Pense no alarme de um carro. Sensível demais, dispara com o vento e ninguém liga mais (falso positivo). Pouco sensível, não dispara quando quebram o vidro (falso negativo). Ajustar a regra é achar o ponto certo.</p>\n<h3>Tipos de detecção</h3>\n<ul>\n<li><b>Por indicador (IOC):</b> um hash, IP ou domínio conhecido como malicioso. Simples e preciso, mas o atacante troca fácil.</li>\n<li><b>Por comportamento (TTP):</b> o jeito de atacar. Ex.: Word abrindo PowerShell. Mais difícil de o atacante evitar.</li>\n<li><b>Por limite (threshold):</b> \"mais de 20 falhas de login em 5 minutos do mesmo IP\".</li>\n<li><b>Por anomalia (baseline):</b> o que foge do normal daquela conta: horário, país, volume.</li>\n<li><b>Correlação:</b> juntar eventos diferentes. Ex.: falhas de login seguidas de sucesso e depois criação de conta.</li>\n</ul>\n<h3>Sigma: a regra em formato aberto</h3>\n<p>Cada SIEM tem sua linguagem (SPL no Splunk, KQL no Sentinel). O <b>Sigma</b> é um formato em YAML que descreve a regra uma vez e é convertido para qualquer SIEM (com o sigma-cli / pySigma).</p>\n<pre>title: PowerShell com comando codificado\nstatus: stable\nlogsource:\n  product: windows\n  category: process_creation\ndetection:\n  selection:\n    Image|endswith: '\\powershell.exe'\n    CommandLine|contains:\n      - ' -enc '\n      - ' -EncodedCommand '\n  condition: selection\nfalsepositives:\n  - Scripts de administração legítimos\nlevel: high\ntags:\n  - attack.execution\n  - attack.t1059.001</pre>\n<p>Lendo: em eventos de criação de processo no Windows, se o programa termina em powershell.exe <b>e</b> a linha de comando tem -enc ou -EncodedCommand, gera um alerta alto, mapeado no MITRE como T1059.001.</p>\n<h3>Outros formatos que você vai ouvir</h3>\n<ul>\n<li><b>YARA:</b> regras para <b>arquivos</b> (strings e bytes que identificam um malware).</li>\n<li><b>Suricata / Snort:</b> regras para <b>tráfego de rede</b>.</li>\n<li><b>SPL e KQL:</b> as consultas nativas do Splunk e do Sentinel (veja o tópico SIEM).</li>\n</ul>\n<h3>Verdadeiro, falso, positivo, negativo</h3>\n<table><tr><th></th><th>A regra alertou</th><th>A regra não alertou</th></tr>\n<tr><td><b>Era ataque</b></td><td>Verdadeiro positivo ✅</td><td>Falso negativo ❌ (o pior: ninguém viu)</td></tr>\n<tr><td><b>Não era ataque</b></td><td>Falso positivo (ruído)</td><td>Verdadeiro negativo ✅</td></tr></table>\n<h3>Ajuste fino (tuning)</h3>\n<ul>\n<li>Muito falso positivo cansa o time (<b>fadiga de alertas</b>) e o alerta verdadeiro se perde.</li>\n<li>Exclusões devem ser <b>específicas</b>: \"o script X, no servidor Y, com a conta de serviço Z\", nunca \"ignorar todo o servidor\" ou \"ignorar o usuário admin\".</li>\n<li>Toda exceção tem dono, motivo e data de revisão.</li>\n<li>Antes de publicar, teste a regra com dados reais (quantos alertas ela teria gerado na semana passada?) e com uma simulação do ataque (Atomic Red Team).</li>\n</ul>\n<h3>Detection as code</h3>\n<p>Em times maduros, as regras ficam num repositório Git, passam por revisão, têm testes e são publicadas automaticamente. Cada regra tem documentação: o que detecta, por que importa, falsos positivos conhecidos e o que o analista deve fazer (o playbook).</p>\n<h3>O ciclo de vida de uma regra</h3>\n<p><b>Hipótese</b> (o que quero pegar?) → <b>dados</b> (tenho o log certo?) → <b>escrever</b> → <b>testar</b> → <b>publicar</b> → <b>medir</b> (quantos alertas, quantos verdadeiros) → <b>ajustar</b>.</p>\n<h3>No dia a dia de um SOC</h3>\n<ul>\n<li>Como analista júnior, você <b>lê</b> a regra para entender o alerta: o que exatamente disparou? É o mesmo padrão ou algo parecido?</li>\n<li>Quando fecha um falso positivo, registre o motivo. Muitos fechamentos pelo mesmo motivo viram um pedido de tuning.</li>\n<li>Threat hunting é o caminho inverso: procurar ataques que nenhuma regra pegou, a partir de uma hipótese.</li>\n</ul>\n<h3>Pratique no lab</h3>\n<p>No dashboard do lab, as regras R001 a R006 estão em <code>config/detection_rules.json</code>. Mude os limites na barra lateral e veja os alertas mudarem. A seção de exportação mostra as mesmas regras em <b>Sigma</b>, <b>SPL</b> e <b>KQL</b>.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Achar que \"nenhum alerta\" quer dizer \"nenhum ataque\". Pode ser falta de log ou de regra.</li>\n<li>Resolver falso positivo desligando a regra inteira.</li>\n<li>Exclusão ampla demais, que vira um ponto cego que o atacante pode usar.</li>\n<li>Regra só por IOC: o atacante troca o IP amanhã.</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>What is Sigma?</b><br><i>It's an open, YAML-based format for detection rules. You write the logic once, with the log source, the selection and the condition, and convert it to Splunk SPL, Sentinel KQL or other SIEMs. It also carries metadata like severity, false positives and MITRE ATT&CK tags.</i></p>\n<p><b>A rule generates lots of false positives. What do you do?</b><br><i>I look at what the false positives have in common and propose a narrow exclusion, for example a specific script on a specific server, documented with an owner and a review date. I don't disable the rule, because that creates a blind spot.</i></p>",chk:["Diferenciar detecção por IOC, comportamento, limite e anomalia", "Ler uma regra Sigma: logsource, selection, condition, level e tags", "Explicar verdadeiro e falso positivo, e por que o falso negativo é o pior", "Propor um ajuste fino com exclusão específica", "Dizer para que servem YARA e Suricata", "Explicar o ciclo de vida de uma regra", "Acertar 8 de 10 no quiz de Regras de Detecção"]},
{id:"cti",n:"Threat Intel e MITRE ATT&CK",ic:"🧭",tags:["CTI"],st:"<p class=\"mu\">Threat intelligence (CTI) é saber quem ataca, como ataca e com o quê, para defender melhor. O MITRE ATT&CK é o \"dicionário\" que todo SOC usa para falar sobre técnicas de ataque.</p>\n<h3>O que é, em uma frase</h3>\n<p>Threat intelligence é <b>informação sobre ameaças, com contexto, que ajuda a tomar uma decisão</b>: bloquear, procurar, priorizar ou ignorar. Uma lista de IPs sem contexto é dado. Saber que aquele IP é de uma campanha de phishing contra bancos brasileiros nesta semana é inteligência.</p>\n<h3>Comparação do dia a dia</h3>\n<p>A polícia avisa os bancos: \"uma quadrilha está usando este carro, chega às 10h e entra pela porta dos fundos\". A placa do carro é um <b>IOC</b> (fácil de trocar). O jeito de agir, chegar cedo e entrar pelos fundos, é o <b>TTP</b> (difícil de mudar).</p>\n<h3>Níveis de inteligência</h3>\n<ul>\n<li><b>Estratégica:</b> para a diretoria. \"Ransomware contra o setor de saúde cresceu este ano.\"</li>\n<li><b>Operacional:</b> sobre campanhas e grupos. \"O grupo X está mandando faturas falsas.\"</li>\n<li><b>Tática:</b> TTPs, como eles atacam. \"Usam macro do Word que abre PowerShell.\"</li>\n<li><b>Técnica:</b> os IOCs. Hashes, IPs, domínios, URLs.</li>\n</ul>\n<h3>Tipos de IOC e a pirâmide da dor</h3>\n<p>Quanto mais alto na pirâmide (de David Bianco), mais \"dói\" para o atacante quando você detecta:</p>\n<table><tr><th>Nível</th><th>Exemplo</th><th>Para o atacante trocar</th></tr>\n<tr><td>Hash</td><td>SHA256 de um arquivo</td><td>Trivial (muda um byte)</td></tr>\n<tr><td>Endereço IP</td><td>203.0.113.50</td><td>Fácil</td></tr>\n<tr><td>Domínio</td><td>update-office365.com</td><td>Simples</td></tr>\n<tr><td>Artefatos de rede ou do host</td><td>User-Agent estranho, chave de registro</td><td>Chato</td></tr>\n<tr><td>Ferramentas</td><td>Mimikatz, Cobalt Strike</td><td>Difícil</td></tr>\n<tr><td>TTPs</td><td>Phishing com macro → PowerShell → roubo de credencial</td><td>Muito difícil</td></tr></table>\n<h3>Onde buscar informação (OSINT)</h3>\n<ul>\n<li><b>VirusTotal:</b> reputação de hash, URL, domínio e IP.</li>\n<li><b>AbuseIPDB:</b> denúncias de IPs maliciosos. <b>GreyNoise:</b> diz se o IP é só \"ruído\" de varredura da internet.</li>\n<li><b>URLhaus</b> e <b>MalwareBazaar</b> (abuse.ch): URLs e amostras de malware.</li>\n<li><b>AlienVault OTX</b>, <b>MISP</b> (plataforma para compartilhar inteligência entre empresas), alertas da <b>CISA</b> e relatórios de fornecedores.</li>\n<li><b>Shodan:</b> o que está exposto na internet.</li>\n<li>Cuidado: <b>nunca envie arquivos internos ou confidenciais</b> para o VirusTotal. Prefira consultar o hash.</li>\n</ul>\n<h3>TLP: com quem posso compartilhar?</h3>\n<p>O Traffic Light Protocol diz até onde a informação pode ir: <b>TLP:CLEAR</b> (público), <b>TLP:GREEN</b> (a comunidade), <b>TLP:AMBER</b> (sua organização e quem precisa saber; <b>AMBER+STRICT</b>: só sua organização) e <b>TLP:RED</b> (só quem estava na conversa).</p>\n<h3>MITRE ATT&CK</h3>\n<ul>\n<li>Uma base de conhecimento pública, montada a partir de ataques reais, organizada em <b>táticas</b> (o objetivo, o \"porquê\") e <b>técnicas</b> (o \"como\").</li>\n<li>A matriz Enterprise tem <b>14 táticas</b>, na ordem de um ataque: Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration e Impact.</li>\n<li>Técnicas têm IDs: <b>T1566</b> Phishing, <b>T1110</b> Brute Force, <b>T1078</b> Valid Accounts, <b>T1059.001</b> PowerShell (uma <b>subtécnica</b> de T1059), <b>T1003</b> OS Credential Dumping, <b>T1071</b> Application Layer Protocol (C2 por HTTP), <b>T1486</b> Data Encrypted for Impact (ransomware).</li>\n<li>Também lista <b>grupos</b> (ex.: APT29 = G0016), softwares, mitigações e as fontes de log que detectam cada técnica.</li>\n<li>O <b>ATT&CK Navigator</b> pinta a matriz: o que já detectamos e onde estão os buracos.</li>\n</ul>\n<h3>Outros modelos</h3>\n<ul>\n<li><b>Cyber Kill Chain</b> (Lockheed Martin): 7 fases, de reconhecimento a ações no objetivo. Quebrar qualquer elo interrompe o ataque.</li>\n<li><b>Diamond Model:</b> todo evento liga adversário, infraestrutura, capacidade e vítima.</li>\n</ul>\n<h3>O ciclo de inteligência</h3>\n<p><b>Requisitos</b> (o que precisamos saber?) → <b>coleta</b> → <b>processamento</b> → <b>análise</b> → <b>disseminação</b> (entregar para quem decide) → <b>feedback</b>.</p>\n<h3>No dia a dia de um SOC</h3>\n<ul>\n<li><b>Enriquecer alertas:</b> o IP do alerta tem reputação ruim? Já apareceu em outros casos?</li>\n<li><b>Caçar IOCs de um relatório:</b> saiu um alerta da CISA com 20 hashes e domínios; procure no SIEM se algum apareceu nos últimos 90 dias.</li>\n<li><b>Mapear casos no ATT&CK:</b> o relatório do incidente diz quais técnicas foram vistas.</li>\n<li>IOC envelhece: um IP malicioso de seis meses atrás hoje pode ser de outra pessoa. Bloquear IP de CDN ou de nuvem compartilhada pode derrubar sites legítimos.</li>\n</ul>\n<h3>Pratique no lab</h3>\n<p>O dashboard do lab enriquece os IPs com reputação e geolocalização (arquivos fictícios em <code>data/enrichment/</code>) e cada alerta mostra a técnica do MITRE ATT&CK. No Terminal, o arquivo <code>logs/proxy.csv</code> tem o tráfego web do caso: encontre o domínio do atacante e o volume enviado.</p>\n<h3>Erros comuns</h3>\n<ul>\n<li>Achar que \"VirusTotal 0/70\" quer dizer seguro. Malware novo ou direcionado ainda não é conhecido.</li>\n<li>Bloquear IOCs sem checar a idade e se são compartilhados (CDN, nuvem).</li>\n<li>Subir um documento interno no VirusTotal: ele fica disponível para outros.</li>\n<li>Confundir tática (objetivo) e técnica (método).</li>\n</ul>\n<h3>Como explicar numa entrevista</h3>\n<p><b>What is the difference between an IOC and a TTP?</b><br><i>An IOC is an artefact like a hash, IP or domain, easy for the attacker to change. A TTP is the behaviour, how they attack, which is much harder to change. That's the idea behind the Pyramid of Pain: detecting TTPs hurts the attacker more.</i></p>\n<p><b>How do you use MITRE ATT&CK in your work?</b><br><i>To describe what I see in a common language, for example T1059.001 for malicious PowerShell, to check which techniques our rules cover, and to look at the next likely steps of an attacker when I find one technique.</i></p>",chk:["Explicar o que é threat intelligence e os 4 níveis", "Diferenciar IOC e TTP usando a pirâmide da dor", "Usar VirusTotal, AbuseIPDB e GreyNoise sem vazar dados", "Explicar o TLP (CLEAR, GREEN, AMBER, RED)", "Citar táticas do MITRE ATT&CK e técnicas com seus IDs", "Explicar como caçar os IOCs de um relatório no SIEM", "Acertar 8 de 10 no quiz de Threat Intel"]}
