<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Mini SOC Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Static build for Cloudflare Pages: runs streamlit_app.py in the browser via stlite (Pyodide).
      // Keep this list in sync with the Python/data files the app needs at runtime.
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
      // Optional e-mail login (conta.js): with a session, the cloud progress is written to /mnt/soclab
      // before the lab starts, and changes are sent back while it runs. Without one nothing changes.
      // Loaded with a dynamic import so the lab still opens if it fails.
      let conta = null;
      try { conta = await import("./conta.js"); } catch (e) { console.warn("conta.js:", e); }

      const paths = [
        "streamlit_app.py",
        "config/detection_rules.json",
        "data/sample_auth_logs.csv",
        "data/sample_auth_logs_ground_truth.csv",
        "data/enrichment/geoip.csv",
        "data/enrichment/threat_intel.csv",
        "data/examples/entra_signins.json",
        "data/examples/linux_auth.log",
        "data/examples/windows_security.evtx",
        "data/examples/windows_security.xml",
        "data/terminal/challenges.json",
        "soc_lab/__init__.py",
        "soc_lab/case_store.py",
        "soc_lab/challenges.py",
        "soc_lab/cli.py",
        "soc_lab/config.py",
        "soc_lab/correlation.py",
        "soc_lab/enrichment.py",
        "soc_lab/evtx.py",
        "soc_lab/filters.py",
        "soc_lab/i18n.py",
        "soc_lab/locales/en.json",
        "soc_lab/locales/pt-BR.json",
        "soc_lab/log_generator.py",
        "soc_lab/log_loader.py",
        "soc_lab/metrics.py",
        "soc_lab/parsers.py",
        "soc_lab/models.py",
        "soc_lab/reporting.py",
        "soc_lab/scoring.py",
        "soc_lab/sim/__init__.py",
        "soc_lab/sim/awk.py",
        "soc_lab/sim/bash.py",
        "soc_lab/sim/cmd.py",
        "soc_lab/sim/core.py",
        "soc_lab/sim/jq.py",
        "soc_lab/sim/powershell.py",
        "soc_lab/sim/ps_format.py",
        "soc_lab/sim/ps_parser.py",
        "soc_lab/sim/ps_values.py",
        "soc_lab/sim/regex.py",
        "soc_lab/terminal.py",
        "soc_lab/training.py",
        "soc_lab/detection/__init__.py",
        "soc_lab/detection/context.py",
        "soc_lab/detection/engine.py",
        "soc_lab/detection/export.py",
        "soc_lab/detection/playbooks.py",
        "soc_lab/detection/rules.py",
      ];

      const user = conta ? await conta.pullLabBeforeMount() : null;
      mount(
        {
          requirements: ["pandas"],
          entrypoint: "streamlit_app.py",
          files: Object.fromEntries(paths.map((p) => [p, { url: "./" + p }])),
          streamlitConfig: { "client.toolbarMode": "viewer" },
          // Progress survives a reload: /mnt is kept in the browser (IndexedDB). estudar.html reads it from there.
          idbfsMountpoints: ["/mnt"],
          env: { SOC_LAB_ANSWERS_DIR: "/mnt/soclab" },
        },
        document.getElementById("root"),
      );
      if (conta) {
        conta.mountLab(user);
        if (user) conta.watchLab();
      }
    </script>
  </body>
</html>
